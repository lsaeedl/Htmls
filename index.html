<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پرتال آموزشی دبستان دخترانه بشری</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <div class="bg-blob b1"></div>
  <div class="bg-blob b2"></div>
  <div class="bg-blob b3"></div>

  <!-- ===================== ورود دانش‌آموز ===================== -->
  <main id="loginScreen" class="page">
    <div class="brand">
      <div class="brand-emblem">🌙</div>
      <h1>دبستان دخترانه بشری</h1>
      <p>پرتال بازی‌های آموزشی</p>
      <p class="teacher-credit">زیر نظر آموزگار: خانم دهگودی</p>
    </div>

    <form id="loginForm" class="glass-card" novalidate>
      <div class="field">
        <label for="studentCode">کد دانش‌آموزی</label>
        <input type="text" id="studentCode" name="studentCode" inputmode="numeric" autocomplete="off" required>
      </div>

      <div class="field">
        <label for="fullName">نام و نام‌خانوادگی</label>
        <input type="text" id="fullName" name="fullName" autocomplete="off" required>
      </div>

      <div id="loginError" class="field-error" role="alert"></div>

      <button type="submit" id="loginBtn" class="btn btn-primary">
        <span id="loginBtnText">ورود به پرتال</span>
      </button>
    </form>
  </main>

  <!-- ===================== هاب بازی‌ها ===================== -->
  <main id="hubScreen" class="page hidden">
    <div class="hub-header">
      <div class="welcome">سلام <strong id="studentNameDisplay"></strong> عزیز 🌸</div>
      <div class="teacher-credit hub-teacher-credit" aria-label="آموزگار بازی‌ها">آموزگار: خانم دهگودی</div>
      <button id="logoutBtn" class="btn btn-ghost" style="width:auto; padding:10px 18px;">خروج</button>
    </div>

    <div id="gamesGrid" class="games-grid">
      <!-- کاشی‌های بازی به‌صورت پویا توسط main.js ساخته می‌شوند -->
    </div>
  </main>

  <footer class="site-footer">
    طراحی و پیاده‌سازی: سعید سراوانی
  </footer>

  <script src="assets/js/google-sync.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
