<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>بازی نشانه «و»</title>

<style>

/* =========================
   تنظیمات کلی
========================= */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{
    font-family:
    Tahoma,
    Arial,
    sans-serif;

    overflow-x:hidden;

    background:#f4dce7;
}


/* =========================
   پس زمینه
========================= */

.game{
    min-height:100vh;

    padding:15px;

    background-image:
    linear-gradient(
        rgba(255,255,255,.12),
        rgba(255,255,255,.12)
    ),
    url("https://cdn.imgurl.ir/uploads/m957830_F930F719-7A8A-4355-968B-EF1D9C0E578A.png");

    background-size:cover;

    background-position:center;

    background-repeat:no-repeat;

    background-attachment:fixed;
}


/* =========================
   صفحه اصلی
========================= */

.container{
    width:100%;
    max-width:900px;

    min-height:95vh;

    margin:auto;

    position:relative;
}


/* =========================
   صفحه خوش آمد
========================= */

.start-screen{

    min-height:92vh;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:20px;
}


.welcome-card{

    width:min(95%,620px);

    padding:35px 25px;

    text-align:center;

    background:
    linear-gradient(
        145deg,
        rgba(255,255,255,.96),
        rgba(255,239,247,.96)
    );

    border:5px solid white;

    border-radius:42px;

    box-shadow:

    0 10px 0 #c899af,

    0 20px 45px
    rgba(80,50,70,.2);
}


/* توپ لوگو */

.logo-ball{

    width:105px;

    height:105px;

    margin:
    0 auto 15px;

    border-radius:50%;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:55px;

    font-weight:bold;

    color:white;

    background:
    linear-gradient(
        145deg,
        #ffd4e4,
        #e684aa
    );

    box-shadow:

    inset -12px -15px
    rgba(0,0,0,.13),

    inset 10px 10px
    rgba(255,255,255,.45),

    0 9px 0 #bd7895;
}


.welcome-card h1{

    margin:10px 0;

    color:#70475f;

    font-size:36px;

    text-shadow:
    2px 3px white;
}


.welcome-card p{

    color:#98758a;

    font-size:19px;

    line-height:1.8;
}


/* ورودی نام */

.name-input{

    width:100%;

    padding:16px;

    border:

    4px solid
    #efd0df;

    border-radius:23px;

    background:white;

    font-size:20px;

    text-align:center;

    outline:none;
}


/* دکمه شروع */

.start-button{

    margin-top:20px;

    padding:
    16px 42px;

    border:0;

    border-radius:25px;

    background:
    linear-gradient(
        180deg,
        #ffb6d1,
        #e68aaa
    );

    color:white;

    font-size:22px;

    font-weight:bold;

    cursor:pointer;

    box-shadow:

    0 8px 0 #bd6e91,

    0 14px 25px
    rgba(100,50,80,.18);
}


.start-button:active{

    transform:
    translateY(6px);

    box-shadow:
    0 2px 0 #bd6e91;
}


/* =========================
   بازی
========================= */

#game{

    display:none;

    padding:
    10px 5px 30px;
}


/* بالای صفحه */

.top{

    display:flex;

    justify-content:
    space-between;

    align-items:center;

    gap:10px;

    margin-bottom:18px;
}


.badge{

    background:
    rgba(255,255,255,.94);

    border:
    3px solid white;

    border-radius:23px;

    padding:
    10px 16px;

    color:#684b60;

    font-weight:bold;

    box-shadow:
    0 6px 0 #cdaabd;
}


/* =========================
   کارت سوال
========================= */

.question-card{

    background:
    rgba(255,255,255,.96);

    border:
    5px solid white;

    border-radius:35px;

    padding:20px;

    text-align:center;

    box-shadow:

    0 9px 0 #c7a4b7,

    0 15px 30px
    rgba(80,50,70,.16);
}


.question-card small{

    color:#a07891;

    font-size:16px;
}


.question{

    color:#684b60;

    font-size:28px;

    line-height:1.8;

    margin:
    7px 0 0;
}


/* =========================
   توپ ها
========================= */

.balls{

    display:grid;

    grid-template-columns:
    repeat(4,1fr);

    gap:18px;

    max-width:850px;

    margin:
    30px auto;
}


/* توپ */

.ball{

    position:relative;

    border:0;

    aspect-ratio:1;

    border-radius:50%;

    display:flex;

    align-items:center;

    justify-content:center;

    text-align:center;

    padding:12px;

    color:white;

    font-size:20px;

    font-weight:900;

    cursor:pointer;

    overflow:hidden;


    box-shadow:

    inset -14px -18px
    rgba(0,0,0,.14),

    inset 10px 10px
    rgba(255,255,255,.42),

    inset 0 0 20px
    rgba(255,255,255,.18),

    0 9px 0
    rgba(70,50,65,.22),

    0 15px 25px
    rgba(70,50,65,.16);


    transition:
    transform .15s,
    filter .15s;
}


/* نور توپ */

.ball::before{

    content:"";

    position:absolute;

    width:40%;

    height:22%;

    top:12%;

    left:18%;

    border-radius:50%;

    background:
    rgba(255,255,255,.55);

    transform:
    rotate(-25deg);

    filter:blur(2px);
}


/* بافت */

.ball::after{

    content:"";

    position:absolute;

    inset:0;

    border-radius:50%;

    opacity:.13;

    background-image:

    radial-gradient(
        rgba(255,255,255,.9)
        1px,
        transparent 1px
    );

    background-size:7px 7px;
}


/* رنگ ها */

.ball:nth-child(1){

    background:
    linear-gradient(
        145deg,
        #ffc2d8,
        #df729b
    );
}


.ball:nth-child(2){

    background:
    linear-gradient(
        145deg,
        #a5eee9,
        #4eb5bb
    );
}


.ball:nth-child(3){

    background:
    linear-gradient(
        145deg,
        #ccd2ff,
        #8996e1
    );
}


.ball:nth-child(4){

    background:
    linear-gradient(
        145deg,
        #ffe49d,
        #e3ad43
    );
}


.ball:nth-child(5){

    background:
    linear-gradient(
        145deg,
        #d8f1ae,
        #8dc76d
    );
}


.ball:nth-child(6){

    background:
    linear-gradient(
        145deg,
        #e9bcec,
        #b978c1
    );
}


.ball:nth-child(7){

    background:
    linear-gradient(
        145deg,
        #ffc39f,
        #dc8059
    );
}


.ball:nth-child(8){

    background:
    linear-gradient(
        145deg,
        #b9e6ff,
        #70b5df
    );
}


.ball:nth-child(9){

    background:
    linear-gradient(
        145deg,
        #ffc3c3,
        #dc8585
    );
}


.ball:nth-child(10){

    background:
    linear-gradient(
        145deg,
        #c8edda,
        #75bb99
    );
}


.ball:nth-child(11){

    background:
    linear-gradient(
        145deg,
        #e0c5ff,
        #9f78d1
    );
}


/* لمس */

.ball:active{

    transform:
    scale(.91)
    translateY(5px);
}


/* جواب درست */

.ball.correct{

    animation:
    correctBall .7s ease;

    outline:
    6px solid white;

    pointer-events:none;
}


@keyframes correctBall{

    0%{
        transform:scale(1);
    }

    35%{
        transform:
        scale(1.23)
        rotate(-6deg);
    }

    65%{
        transform:
        scale(.94)
        rotate(5deg);
    }

    100%{
        transform:scale(1);
    }
}


/* جواب غلط */

.ball.wrong{

    animation:
    wrongBall .45s ease;
}


@keyframes wrongBall{

    0%,100%{
        transform:
        translateX(0);
    }

    25%{
        transform:
        translateX(-13px);
    }

    50%{
        transform:
        translateX(13px);
    }

    75%{
        transform:
        translateX(-8px);
    }
}


/* =========================
   پیام
========================= */

.message{

    position:fixed;

    left:50%;

    top:50%;

    transform:
    translate(-50%,-50%)
    scale(.5);

    opacity:0;

    z-index:100;

    background:white;

    padding:
    25px 30px;

    border-radius:32px;

    color:#684b60;

    font-size:23px;

    font-weight:bold;

    text-align:center;

    box-shadow:
    0 20px 50px
    rgba(70,40,60,.3);

    transition:.25s;

    pointer-events:none;
}


.message.show{

    opacity:1;

    transform:
    translate(-50%,-50%)
    scale(1);
}


/* =========================
   فشفشه
========================= */

.spark{

    position:fixed;

    z-index:200;

    font-size:38px;

    pointer-events:none;

    animation:
    fireworks 1s forwards;
}


@keyframes fireworks{

    0%{

        opacity:1;

        transform:
        translate(0,0)
        scale(.3)
        rotate(0);
    }

    100%{

        opacity:0;

        transform:
        translate(
            var(--x),
            var(--y)
        )
        scale(1.5)
        rotate(360deg);
    }
}


/* =========================
   بمب
========================= */

.bomb{

    position:fixed;

    left:50%;

    top:50%;

    z-index:150;

    font-size:100px;

    opacity:0;

    pointer-events:none;
}


.bomb.show{

    animation:
    bombAnimation .75s ease;
}


@keyframes bombAnimation{

    0%{

        opacity:0;

        transform:
        translate(-50%,-50%)
        scale(.2);
    }

    35%{

        opacity:1;

        transform:
        translate(-50%,-50%)
        scale(1.3);
    }

    70%{

        opacity:1;

        transform:
        translate(-50%,-50%)
        scale(1);
    }

    100%{

        opacity:0;

        transform:
        translate(-50%,-50%)
        scale(1.5);
    }
}


/* =========================
   موبایل
========================= */

@media(max-width:650px){

    .game{
        padding:10px;
    }


    .welcome-card h1{
        font-size:30px;
    }


    .question{
        font-size:21px;
    }


    .balls{

        grid-template-columns:
        repeat(3,1fr);

        gap:12px;
    }


    .ball{
        font-size:16px;
    }


    .badge{

        font-size:14px;

        padding:
        9px 12px;
    }

}

</style>

</head>


<body>


<div class="game">


<div class="container">


<!-- =========================
     صفحه اول
========================= -->

<section
class="start-screen"
id="startScreen">


<div class="welcome-card">


<div class="logo-ball">

و

</div>


<h1>

🌸 خوش آمدی قهرمان! 🌸

</h1>


<p>

به بازی شیرین نشانه «و» خوش آمدی!

</p>


<p>

اول اسم خودت را بنویس:

</p>


<input

class="name-input"

id="nameInput"

type="text"

placeholder="نام کودک"


autocomplete="off">


<br>


<button

class="start-button"

id="startButton"

type="button">

🎮 شروع بازی

</button>


</div>


</section>



<!-- =========================
     بازی
========================= -->

<section id="game">


<div class="top">


<div class="badge">

👋 سلام

<span id="childName"></span>

</div>


<div class="badge">

⭐ امتیاز:

<span id="score">

0

</span>

</div>


</div>



<div class="question-card">


<small>

🎯 همه توپ‌های درست را پیدا کن

</small>


<h1 class="question">

در کدام کلمات نشانه «و»
صدا ندارد؟

</h1>


</div>



<!-- توپ ها -->

<div class="balls">


<button
class="ball"
data-correct="false">

موش

</button>


<button
class="ball"
data-correct="false">

رودخانه

</button>


<button
class="ball"
data-correct="false">

سودابه

</button>


<button
class="ball"
data-correct="false">

کودک

</button>


<button
class="ball"
data-correct="true">

خواهر

</button>


<button
class="ball"
data-correct="false">

ورزش

</button>


<button
class="ball"
data-correct="false">

وزنه

</button>


<button
class="ball"
data-correct="false">

نوک

</button>


<button
class="ball"
data-correct="false">

خودکار

</button>


<button
class="ball"
data-correct="true">

استخوان

</button>


<button
class="ball"
data-correct="true">

خواهش

</button>


</div>


</section>


</div>


</div>



<!-- پیام -->

<div
class="message"
id="message">

</div>



<!-- بمب -->

<div
class="bomb"
id="bomb">

💣

</div>



<script>


/* =========================
   عناصر
========================= */

const startButton =
document.getElementById(
"startButton"
);


const nameInput =
document.getElementById(
"nameInput"
);


const startScreen =
document.getElementById(
"startScreen"
);


const game =
document.getElementById(
"game"
);


const childName =
document.getElementById(
"childName"
);


const scoreText =
document.getElementById(
"score"
);


const message =
document.getElementById(
"message"
);


const bomb =
document.getElementById(
"bomb"
);


let score = 0;

let correctFound = 0;

const totalCorrect = 3;


/* =========================
   شروع بازی
========================= */

startButton.addEventListener(
"click",
function(){

    const name =
    nameInput.value.trim();


    if(name === ""){

        showMessage(
        "🌸 اول نام کودک را بنویس!"
        );

        return;
    }


    childName.textContent =
    name;


    startScreen.style.display =
    "none";


    game.style.display =
    "block";

});


/* Enter */

nameInput.addEventListener(
"keydown",
function(event){

    if(event.key === "Enter"){

        startButton.click();

    }

});


/* =========================
   توپ ها
========================= */

const balls =
document.querySelectorAll(
".ball"
);


balls.forEach(
function(ball){

    ball.addEventListener(
    "click",
    function(){

        const correct =
        this.dataset.correct ===
        "true";


        /* جواب درست */

        if(correct){

            if(
            this.classList.contains(
            "correct"
            )
            ){

                return;

            }


            this.classList.add(
            "correct"
            );


            correctFound++;

            score++;


            scoreText.textContent =
            score;


            showMessage(
            "🎇 آفرین! درست پیدا کردی!"
            );


            createFireworks();


            /* پایان */

            if(
            correctFound ===
            totalCorrect
            ){

                setTimeout(
                function(){

                    showMessage(
                    "🏆 فوق‌العاده بود! هر سه کلمه را پیدا کردی!"
                    );

                },
                900
                );

            }

        }


        /* جواب غلط */

        else{

            this.classList.add(
            "wrong"
            );


            showBomb();


            playBeep();


            showMessage(
            "💣 اووه! این یکی درست نیست!"
            );


            setTimeout(
            function(){

                ball.classList.remove(
                "wrong"
                );

            },
            500
            );

        }

    });

});


/* =========================
   پیام
========================= */

function showMessage(text){

    message.textContent =
    text;


    message.classList.add(
    "show"
    );


    clearTimeout(
    window.messageTimer
    );


    window.messageTimer =
    setTimeout(
    function(){

        message.classList.remove(
        "show"
        );

    },
    1100
    );

}


/* =========================
   فشفشه
========================= */

function createFireworks(){

    const icons = [

        "🎇",
        "✨",
        "⭐",
        "🌟",
        "🎉"

    ];


    for(
    let i=0;
    i<22;
    i++
    ){

        const spark =
        document.createElement(
        "div"
        );


        spark.className =
        "spark";


        spark.textContent =
        icons[
            Math.floor(
            Math.random()
            *
            icons.length
            )
        ];


        spark.style.left =
        "50%";


        spark.style.top =
        "45%";


        spark.style.setProperty(

            "--x",

            (
                Math.random()
                *
                520
                -
                260
            )
            +
            "px"

        );


        spark.style.setProperty(

            "--y",

            (
                Math.random()
                *
                520
                -
                260
            )
            +
            "px"

        );


        document.body.appendChild(
        spark
        );


        setTimeout(
        function(){

            spark.remove();

        },
        1000
        );

    }

}


/* =========================
   بمب
========================= */

function showBomb(){

    bomb.classList.remove(
    "show"
    );


    void bomb.offsetWidth;


    bomb.classList.add(
    "show"
    );


    setTimeout(
    function(){

        bomb.classList.remove(
        "show"
        );

    },
    800
    );

}


/* =========================
   صدای بوق
========================= */

function playBeep(){

    try{

        const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;


        const audio =
        new AudioContext();


        const oscillator =
        audio.createOscillator();


        const gain =
        audio.createGain();


        oscillator.type =
        "square";


        oscillator.frequency.value =
        180;


        gain.gain.value =
        0.15;


        oscillator.connect(
        gain
        );


        gain.connect(
        audio.destination
        );


        oscillator.start();


        oscillator.stop(
        audio.currentTime
        +
        0.25
        );

    }

    catch(error){

        /* اگر صدا پشتیبانی نشود، بازی ادامه دارد */

    }

}

</script>


</body>
</html>
