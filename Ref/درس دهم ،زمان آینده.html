<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>آماده‌ای؟</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  min-height:100%;
}

body{
  font-family:Tahoma,Arial,sans-serif;
  background:#120d38;
  overflow-x:hidden;
}

/* =========================
پس زمینه
========================= */

#app{
  min-height:100vh;
  padding:15px;
  position:relative;
  overflow:hidden;

  background-image:
    linear-gradient(
      rgba(20,15,65,.18),
      rgba(20,15,65,.52)
    ),
    url("https://cdn.imgurl.ir/uploads/i858583_IMG_5205.jpeg");

  background-size:cover;
  background-position:center;
  background-attachment:fixed;
}

.container{
  width:100%;
  max-width:960px;
  margin:auto;
  position:relative;
  z-index:10;
}

/* نورهای شناور */

.orb{
  position:absolute;
  border-radius:50%;
  filter:blur(50px);
  opacity:.30;
  pointer-events:none;
}

.orb1{
  width:260px;
  height:260px;
  background:#ff5bd6;
  top:-100px;
  right:-70px;
  animation:orb1 7s infinite alternate;
}

.orb2{
  width:280px;
  height:280px;
  background:#42e6ff;
  bottom:-110px;
  left:-80px;
  animation:orb2 8s infinite alternate;
}

@keyframes orb1{
  to{
    transform:translate(45px,35px) scale(1.25);
  }
}

@keyframes orb2{
  to{
    transform:translate(40px,-30px) scale(1.2);
  }
}

/* ستاره‌ها */

.star{
  position:absolute;
  color:white;
  opacity:.55;
  pointer-events:none;
  animation:starFloat 4s infinite ease-in-out;
}

@keyframes starFloat{
  0%,100%{
    transform:translateY(0) scale(.8);
    opacity:.25;
  }

  50%{
    transform:translateY(-20px) scale(1.25);
    opacity:.9;
  }
}

/* =========================
صفحه شروع
========================= */

#start{
  min-height:94vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

.start-card{

  width:min(94%,650px);

  padding:35px 24px 40px;

  text-align:center;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.38),
      rgba(255,255,255,.10)
    );

  border:
    1px solid rgba(255,255,255,.75);

  border-radius:42px;

  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);

  box-shadow:

    inset 0 2px 4px rgba(255,255,255,.7),

    inset 0 -18px 30px rgba(0,0,0,.12),

    0 25px 70px rgba(0,0,0,.40),

    0 10px 0 rgba(48,35,100,.65);

  transform:
    perspective(1000px)
    rotateX(2deg);
}

.start-logo{

  width:140px;
  height:140px;

  margin:auto;

  border-radius:38px;

  background-image:
    linear-gradient(
      rgba(255,255,255,.12),
      rgba(255,255,255,.25)
    ),
    url("https://cdn.imgurl.ir/uploads/p554287_IMG_5204.jpeg");

  background-size:cover;
  background-position:center;

  border:5px solid rgba(255,255,255,.9);

  box-shadow:

    inset 0 6px 12px rgba(255,255,255,.7),

    inset 0 -15px 20px rgba(0,0,0,.18),

    0 13px 0 rgba(63,47,115,.75),

    0 22px 35px rgba(0,0,0,.35);

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:60px;

  animation:
    logoFloat 2.4s infinite ease-in-out;
}

@keyframes logoFloat{

  0%,100%{
    transform:
      translateY(0)
      rotateY(0deg);
  }

  50%{
    transform:
      translateY(-10px)
      rotateY(8deg);
  }

}

.start-card h1{

  color:white;

  font-size:40px;

  margin:24px 0 8px;

  text-shadow:
    0 4px 10px rgba(0,0,0,.45);
}

.start-card p{

  color:white;

  font-size:18px;

  line-height:1.9;

  text-shadow:
    0 2px 5px rgba(0,0,0,.4);
}

.name-label{

  display:block;

  margin:22px 0 8px;

  color:white;

  font-weight:bold;
}

.name{

  width:100%;

  padding:17px;

  border-radius:22px;

  border:3px solid rgba(255,255,255,.75);

  background:rgba(255,255,255,.82);

  color:#493568;

  font-size:19px;

  text-align:center;

  outline:none;

  box-shadow:
    inset 0 4px 10px rgba(0,0,0,.08);
}

.start-btn{

  width:100%;

  margin-top:20px;

  padding:18px;

  border:1px solid rgba(255,255,255,.75);

  border-radius:25px;

  color:white;

  font-size:23px;

  font-weight:bold;

  cursor:pointer;

  background:
    linear-gradient(
      135deg,
      #ff8fd2,
      #7650d8
    );

  box-shadow:

    inset 0 3px 5px rgba(255,255,255,.45),

    0 9px 0 #4d377f,

    0 16px 30px rgba(0,0,0,.3);

  transition:.18s;
}

.start-btn:active{

  transform:translateY(7px);

  box-shadow:
    inset 0 3px 5px rgba(255,255,255,.3),
    0 2px 0 #4d377f;
}

/* =========================
بازی
========================= */

#play{
  display:none;
  padding:8px 0 45px;
}

.top{

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:10px;

  margin-bottom:20px;
}

.badge{

  padding:12px 7px;

  color:white;

  text-align:center;

  font-weight:bold;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.40),
      rgba(255,255,255,.10)
    );

  border:
    1px solid rgba(255,255,255,.65);

  border-radius:20px;

  backdrop-filter:blur(15px);

  box-shadow:

    inset 0 2px 4px rgba(255,255,255,.5),

    0 7px 18px rgba(0,0,0,.25);

  text-shadow:
    0 2px 5px rgba(0,0,0,.5);
}

/* =========================
سؤال
========================= */

.question-box{

  padding:22px;

  text-align:center;

  border-radius:32px;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.48),
      rgba(255,255,255,.12)
    );

  border:
    1px solid rgba(255,255,255,.75);

  backdrop-filter:blur(20px);

  box-shadow:

    inset 0 2px 4px rgba(255,255,255,.6),

    inset 0 -15px 25px rgba(0,0,0,.12),

    0 14px 32px rgba(0,0,0,.3);
}

.question-label{

  color:#fff0a0;

  font-size:16px;

  font-weight:bold;

  text-shadow:
    0 2px 5px rgba(0,0,0,.5);
}

.question{

  color:white;

  font-size:29px;

  font-weight:bold;

  line-height:1.9;

  margin-top:7px;

  text-shadow:
    0 4px 8px rgba(0,0,0,.65);
}

/* =========================
کارت جواب
========================= */

.answers{

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:20px;

  margin-top:30px;

  perspective:1400px;
}

.answer{

  position:relative;

  min-height:145px;

  padding:15px;

  border-radius:30px;

  border:
    3px solid rgba(255,255,255,.95);

  cursor:pointer;

  overflow:hidden;

  display:flex;

  align-items:center;

  justify-content:center;

  text-align:center;

  transform-style:preserve-3d;

  /*
  تصویر دوم = بافت کارت
  */

  background-image:
    url("https://cdn.imgurl.ir/uploads/p554287_IMG_5204.jpeg");

  background-size:cover;

  background-position:center;

  box-shadow:

    inset 0 5px 10px rgba(255,255,255,.65),

    inset 0 -15px 25px rgba(0,0,0,.25),

    0 12px 0 rgba(53,39,105,.95),

    0 20px 35px rgba(0,0,0,.32);

  transition:
    transform .25s,
    box-shadow .25s,
    filter .25s;
}


/*
لایه شیشه‌ای
*/

.answer .glass{

  position:absolute;

  width:88%;
  height:72%;

  left:6%;
  top:14%;

  border-radius:24px;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.86),
      rgba(255,255,255,.62)
    );

  border:
    2px solid rgba(255,255,255,.95);

  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);

  box-shadow:

    inset 0 3px 6px rgba(255,255,255,.95),

    inset 0 -7px 12px rgba(0,0,0,.08),

    0 7px 18px rgba(0,0,0,.15);

  pointer-events:none;

  z-index:1;
}


/*
متن
*/

.answer .text{

  position:relative;

  z-index:5;

  color:#2b174b;

  font-family:
    Tahoma,
    Arial,
    sans-serif;

  font-size:23px;

  font-weight:900;

  line-height:1.7;

  text-shadow:

    0 1px 0 white,

    0 2px 3px rgba(255,255,255,.8);
}


/*
انعکاس نور روی کارت
*/

.answer .shine{

  position:absolute;

  top:-80%;

  left:-70%;

  width:45%;

  height:230%;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.65),
      transparent
    );

  transform:rotate(25deg);

  transition:
    left .8s;

  z-index:7;

  pointer-events:none;
}

.answer:hover .shine{

  left:140%;
}


/*
حالت شناور
*/

.answer:hover{

  transform:
    translateY(-10px)
    rotateX(6deg)
    rotateY(-4deg)
    scale(1.035);

  filter:brightness(1.08);

  box-shadow:

    inset 0 5px 10px rgba(255,255,255,.8),

    0 0 25px rgba(255,255,255,.45),

    0 18px 0 rgba(53,39,105,.95),

    0 28px 45px rgba(0,0,0,.38);
}

.answer:active{

  transform:
    translateY(7px)
    scale(.97);
}


/* درست */

.answer.correct{

  animation:
    correct .8s ease;

}

@keyframes correct{

  0%{
    transform:scale(1);
  }

  35%{
    transform:
      scale(1.14)
      rotateY(10deg);

    filter:brightness(1.5);
  }

  70%{
    transform:
      scale(.97)
      rotateY(-7deg);
  }

  100%{
    transform:scale(1);
  }
}


/* غلط */

.answer.burn{

  animation:
    burn .9s forwards;
}

@keyframes burn{

  0%{
    transform:scale(1);
    opacity:1;
  }

  20%{
    transform:
      scale(1.08)
      rotate(-4deg);

    filter:
      brightness(1.8)
      saturate(2);
  }

  45%{
    transform:
      scale(.94)
      rotate(5deg);

    opacity:.75;

    filter:
      brightness(2)
      saturate(2);
  }

  70%{
    transform:
      scale(.6)
      rotate(-8deg);

    opacity:.4;
  }

  100%{
    transform:
      scale(.1)
      rotate(20deg);

    opacity:0;
  }
}

/* =========================
پیام
========================= */

.message{

  position:fixed;

  left:50%;
  top:50%;

  width:min(90%,430px);

  padding:25px;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.98),
      rgba(239,232,255,.96)
    );

  border:
    4px solid white;

  border-radius:30px;

  text-align:center;

  color:#513c70;

  font-size:22px;

  font-weight:bold;

  box-shadow:
    0 25px 70px rgba(0,0,0,.45);

  z-index:5000;

  opacity:0;

  transform:
    translate(-50%,-50%)
    scale(.5);

  pointer-events:none;

  transition:.25s;
}

.message.show{

  opacity:1;

  transform:
    translate(-50%,-50%)
    scale(1);
}


/* =========================
انفجار
========================= */

.explosion{

  position:fixed;

  left:50%;
  top:50%;

  display:none;

  z-index:6000;

  font-size:120px;

  pointer-events:none;
}

.explosion.show{

  display:block;

  animation:
    explosion .85s ease;
}

@keyframes explosion{

  0%{
    opacity:0;

    transform:
      translate(-50%,-50%)
      scale(.1);
  }

  25%{
    opacity:1;

    transform:
      translate(-50%,-50%)
      scale(1.5)
      rotate(-12deg);
  }

  60%{
    opacity:1;

    transform:
      translate(-50%,-50%)
      scale(1);
  }

  100%{
    opacity:0;

    transform:
      translate(-50%,-50%)
      scale(2)
      rotate(15deg);
  }
}


/* =========================
فشفشه
========================= */

.spark{

  position:fixed;

  z-index:7000;

  font-size:34px;

  pointer-events:none;

  animation:
    spark .95s forwards;
}

@keyframes spark{

  0%{
    opacity:1;

    transform:
      translate(0,0)
      scale(.2);
  }

  100%{
    opacity:0;

    transform:
      translate(var(--x),var(--y))
      scale(1.5)
      rotate(360deg);
  }
}


/* =========================
کارنامه
========================= */

.report{

  display:none;

  margin-top:25px;

  padding:30px 20px;

  text-align:center;

  border-radius:38px;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.45),
      rgba(255,255,255,.12)
    );

  border:
    2px solid rgba(255,255,255,.75);

  backdrop-filter:blur(20px);

  box-shadow:

    inset 0 3px 5px rgba(255,255,255,.7),

    inset 0 -18px 30px rgba(0,0,0,.12),

    0 20px 50px rgba(0,0,0,.35);
}

.report-icon{

  font-size:70px;

  animation:
    reportFloat 2s infinite ease-in-out;
}

@keyframes reportFloat{

  50%{
    transform:
      translateY(-10px)
      rotate(3deg);
  }
}

.report h1{

  color:white;

  font-size:30px;

  text-shadow:
    0 4px 8px rgba(0,0,0,.55);
}

.report-name{

  color:white;

  font-size:18px;

  margin-bottom:20px;
}

.result-grid{

  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:12px;
}

.result{

  padding:17px;

  border-radius:22px;

  background:
    rgba(255,255,255,.80);

  box-shadow:

    inset 0 3px 5px rgba(255,255,255,.8),

    0 6px 0 rgba(67,49,110,.45);
}

.result .label{

  display:block;

  color:#756489;

  font-size:14px;
}

.result .number{

  display:block;

  margin-top:5px;

  color:#6946ba;

  font-size:29px;

  font-weight:bold;
}

.final-message{

  margin:20px 0;

  padding:16px;

  border-radius:22px;

  background:
    linear-gradient(
      135deg,
      #fff1a9,
      #ffd8ef
    );

  color:#59426e;

  font-size:18px;

  font-weight:bold;
}

.restart{

  padding:15px 35px;

  border:0;

  border-radius:22px;

  color:white;

  background:
    linear-gradient(
      135deg,
      #ff8fd2,
      #7650d8
    );

  box-shadow:
    0 7px 0 #50398b;

  font-size:19px;

  font-weight:bold;

  cursor:pointer;
}

.restart:active{

  transform:translateY(5px);

  box-shadow:
    0 2px 0 #50398b;
}


/* =========================
موبایل
========================= */

@media(max-width:650px){

  #app{
    padding:10px;
  }

  .start-card{
    padding:28px 17px 32px;
  }

  .start-logo{
    width:115px;
    height:115px;
  }

  .start-card h1{
    font-size:34px;
  }

  .top{
    gap:7px;
  }

  .badge{
    font-size:11px;
    padding:9px 4px;
  }

  .question{
    font-size:21px;
  }

  .answers{
    grid-template-columns:1fr;
    gap:15px;
  }

  .answer{
    min-height:100px;
  }

  .answer .text{
    font-size:20px;
  }

}

</style>
</head>


<body>

<div id="app">

<div class="orb orb1"></div>
<div class="orb orb2"></div>

<div class="star" style="top:10%;left:15%">✦</div>
<div class="star" style="top:25%;left:85%">✧</div>
<div class="star" style="top:60%;left:8%">✦</div>
<div class="star" style="top:78%;left:90%">✧</div>

<div class="container">


<!-- =========================
صفحه شروع
========================= -->

<section id="start">

<div class="start-card">

<div class="start-logo">
✨
</div>

<h1>
آماده‌ای؟
</h1>

<p>
جمله‌ها را به <strong>زمان آینده</strong> کامل کن.
</p>

<label class="name-label">
نام کودک
</label>

<input
id="name"
class="name"
type="text"
placeholder="نامت را اینجا بنویس"
autocomplete="off"
>

<button
id="startBtn"
class="start-btn"
type="button">

🚀 شروع

</button>

</div>

</section>


<!-- =========================
بازی
========================= -->

<section id="play">

<div class="top">

<div class="badge">
👤 <span id="childName"></span>
</div>

<div class="badge">
⭐ امتیاز:

</div>

<div class="badge">
🎯 <span id="questionNo">1</span>/8
</div>

</div>


<div class="question-box">

<div class="question-label">
🔮 زمان آینده
</div>

<div
id="question"
class="question">
</div>

</div>


<div
id="answers"
class="answers">
</div>


<!-- =========================
کارنامه
========================= -->

<div
id="report"
class="report">

<div class="report-icon">
🏆
</div>

<h1>
کارنامه‌ی یادگیری
</h1>

<div class="report-name">
نام کودک:
<strong id="reportName"></strong>
</div>

<div class="result-grid">

<div class="result">

<span class="label">
امتیاز نهایی
</span>

<span
id="finalScore"
class="number">
0
</span>

</div>

<div class="result">

<span class="label">
پاسخ درست
</span>

<span
id="correctCount"
class="number">
0
</span>

</div>

<div class="result">

<span class="label">
پاسخ غلط
</span>

<span
id="wrongCount"
class="number">
0
</span>

</div>

<div class="result">

<span class="label">
درصد موفقیت
</span>

<span

</div>

</div>

<div

<button

</section>

class="explosion">

</div>


<script>

/* =================================================
سؤال‌ها
================================================= */

const questions=[

{
text:"آن‌ها کتاب ______.",
answers:[
"خواهند خرید",
"خواهید خرید",
"می‌خرند"
],
correct:"خواهند خرید"
},

{

{

answers:[

],

},

{

answers:[

"پوشیده بودید"
],
correct:"خواهید پوشید"
},

{
text:"من دانشمند ______.",
answers:[
"هستم",
"است",
"خواهم شد"
],
correct:"خواهم شد"
},

{
text:"رعنا مهندس ______.",
answers:[
"است",
"خواهد شد",
"بود"
],
correct:"خواهد شد"
},

{
text:"ما درس یاد ______.",
answers:[
"می‌گیریم",
"خواهید گرفت",
"خواهیم گرفت"
],
correct:"خواهیم گرفت"
},

{
text:"تو کبوتر را ______.",
answers:[
"دیده بودی",
"خواهید دید",
"خواهی دید"
],
correct:"خواهی دید"
}

];


/* =================================================
متغیرها
================================================= */

let current=0;
let score=0;
let correctCount=0;
let wrongCount=0;
let locked=false;


/* =================================================
عناصر
================================================= */

const start=
document.getElementById("start");

const play=
document.getElementById("play");

const startBtn=
document.getElementById("startBtn");

const nameInput=
document.getElementById("name");

const childName=
document.getElementById("childName");

const scoreEl=
document.getElementById("score");

const questionNo=
document.getElementById("questionNo");

const questionEl=
document.getElementById("question");

const answersEl=
document.getElementById("answers");

const report=
document.getElementById("report");

const reportName=
document.getElementById("reportName");

const finalScore=
document.getElementById("finalScore");

const correctEl=
document.getElementById("correctCount");

const wrongEl=
document.getElementById("wrongCount");

const percentEl=
document.getElementById("percent");

const finalMessage=
document.getElementById("finalMessage");

const restart=
document.getElementById("restart");

const message=
document.getElementById("message");

const explosion=
document.getElementById("explosion");


/* =================================================
شروع
================================================= */

startBtn.addEventListener(
"click",
function(){

const name=
nameInput.value.trim();

if(!name){

showMessage(
"🌸 لطفاً نام کودک را بنویس!"
);

return;
}

childName.textContent=name;

current=0;
score=0;
correctCount=0;
wrongCount=0;

scoreEl.textContent="0";

start.style.display="none";

play.style.display="block";

showQuestion();

});


nameInput.addEventListener(
"keydown",
function(e){

if(e.key==="Enter"){
startBtn.click();
}

});


/* =================================================
نمایش سؤال
================================================= */

function showQuestion(){

locked=false;

const q=
questions[current];

questionNo.textContent=
current+1;

questionEl.textContent=
q.text;

answersEl.innerHTML="";


/*
تصادفی کردن گزینه‌ها
*/

const options=
[...q.answers].sort(
()=>Math.random()-.5
);


options.forEach(
function(answer){

const button=
document.createElement("button");

button.type="button";

button.className="answer";


/*
لایه شیشه
*/

const glass=
document.createElement("div");

glass.className="glass";


/*
متن
*/

const text=
document.createElement("span");

text.className="text";

text.textContent=
answer;


/*
انعکاس
*/

const shine=
document.createElement("div");

shine.className="shine";


button.appendChild(glass);

button.appendChild(text);

button.appendChild(shine);

button.dataset.answer=
answer;

button.addEventListener(
"click",
function(){

checkAnswer(
button,
q.correct
);

});

answersEl.appendChild(button);

});

}


/* =================================================
بررسی جواب
================================================= */

function checkAnswer(
button,
correct
){

if(locked){
return;
}

locked=true;

const selected=
button.dataset.answer;


/* درست */

if(selected===correct){

button.classList.add("correct");

score+=10;

correctCount++;

scoreEl.textContent=
score;

fireworks();

showMessage(
"✨ آفرین! پاسخ درست است."
);


setTimeout(
function(){

current++;

if(current>=questions.length){

finishGame();

}else{

showQuestion();

}

},
1100
);

}


/* غلط */

else{

button.classList.add("burn");

score-=5;

if(score<0){
score=0;
}

wrongCount++;

scoreEl.textContent=
score;

showExplosion();

playBeep();

showMessage(
"🔥 امتیازت سوخت! ۵ امتیاز کسر شد."
);


/*
کارت غلط حذف می‌شود
*/

setTimeout(
function(){

button.remove();

locked=false;

},
900
);

}

}


/* =================================================
پایان
================================================= */

function finishGame(){

answersEl.innerHTML="";

report.style.display="block";

reportName.textContent=
childName.textContent;

finalScore.textContent=
score;

correctEl.textContent=
correctCount;

wrongEl.textContent=
wrongCount;

const percent=
Math.round(
(correctCount/questions.length)*100
);

percentEl.textContent=
percent+"٪";


if(percent>=90){

finalMessage.textContent=
"🏆 فوق‌العاده بود! زمان آینده را عالی یاد گرفته‌ای.";

}

else if(percent>=70){

finalMessage.textContent=
"🌟 خیلی خوب بود! فقط کمی بیشتر تمرین کن.";

}

else if(percent>=50){

finalMessage.textContent=
"👏 خوب تلاش کردی! با کمی تمرین بهتر می‌شوی.";

}

else{

finalMessage.textContent=
"💪 دوباره تمرین کن؛ تو می‌توانی!";

}

fireworks();

}


/* =================================================
بازی دوباره
================================================= */

restart.addEventListener(
"click",
function(){

current=0;
score=0;
correctCount=0;
wrongCount=0;

scoreEl.textContent="0";

report.style.display="none";

showQuestion();

});


/* =================================================
پیام
================================================= */

function showMessage(text){

message.textContent=text;

message.classList.add("show");

clearTimeout(
window.messageTimer
);

window.messageTimer=
setTimeout(
function(){

message.classList.remove("show");

},
1100
);

}


/* =================================================
انفجار
================================================= */

function showExplosion(){

explosion.classList.remove("show");

void explosion.offsetWidth;

explosion.classList.add("show");

setTimeout(
function(){

explosion.classList.remove("show");

},
850
);

}


/* =================================================
فشفشه
================================================= */

function fireworks(){

const icons=[
"✨",
"⭐",
"🌟",
"🎉",
"💫",
"🎊"
];

for(
let i=0;
i<30;
i++
){

const spark=
document.createElement("div");

spark.className="spark";

spark.textContent=
icons[
Math.floor(
Math.random()*icons.length
)
];

spark.style.left="50%";
spark.style.top="45%";

spark.style.setProperty(
"--x",
(
Math.random()*700-350
)+"px"
);

spark.style.setProperty(
"--y",
(
Math.random()*650-325
)+"px"
);

document.body.appendChild(spark);

setTimeout(
function(){

spark.remove();

},
1000
);

}

}


/* =================================================
صدای اشتباه
================================================= */

function playBeep(){

try{

const AudioContext=
window.AudioContext||
window.webkitAudioContext;

const audio=
new AudioContext();

const oscillator=
audio.createOscillator();

const gain=
audio.createGain();

oscillator.type="square";

oscillator.frequency.value=170;

gain.gain.value=.15;

oscillator.connect(gain);

gain.connect(
audio.destination
);

oscillator.start();

oscillator.stop(
audio.currentTime+.3
);

}catch(e){}

}

</script>
