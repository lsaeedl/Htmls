<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>باغ کلمات هم‌معنی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --sun:#FFC93C;
    --sky:#5AC8FA;
    --grass:#6BCB77;
    --petal:#FF6F91;
    --violet:#A78BFA;
    --cream:#FFF8EC;
    --ink:#3A2E4D;
    --card-back-1:#8E7CFF;
    --card-back-2:#6BCFFF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    font-family:'Vazirmatn', sans-serif;
    background:
      radial-gradient(circle at 10% 15%, rgba(255,255,255,0.35) 0, transparent 40%),
      radial-gradient(circle at 90% 85%, rgba(255,255,255,0.25) 0, transparent 45%),
      linear-gradient(160deg, #FFE29A 0%, #FF9CC4 45%, #8E7CFF 100%);
    color:var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:24px 14px 60px;
    overflow-x:hidden;
  }

  /* floating background blobs for atmosphere */
  .blob{
    position:fixed;
    border-radius:50%;
    filter:blur(2px);
    opacity:0.5;
    animation:float 9s ease-in-out infinite;
    z-index:0;
    pointer-events:none;
  }
  @keyframes float{
    0%,100%{transform:translateY(0) rotate(0deg);}
    50%{transform:translateY(-26px) rotate(12deg);}
  }

  header{
    position:relative;
    z-index:1;
    text-align:center;
    margin-bottom:18px;
  }
  .eyebrow{
    display:inline-block;
    background:var(--cream);
    color:var(--petal);
    font-weight:700;
    font-size:14px;
    padding:6px 18px;
    border-radius:999px;
    box-shadow:0 4px 0 rgba(0,0,0,0.08);
    margin-bottom:10px;
    letter-spacing:0.5px;
  }
  h1{
    font-size:clamp(28px, 6vw, 44px);
    font-weight:900;
    margin:0;
    color:#4B2E83;
    text-shadow:2px 2px 0 rgba(255,255,255,0.55);
  }
  .subtitle{
    font-size:16px;
    font-weight:600;
    color:#5C3D8F;
    margin-top:8px;
  }

  .stats{
    position:relative;
    z-index:1;
    display:flex;
    gap:12px;
    margin:14px 0 22px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .stat-pill{
    background:rgba(255,255,255,0.85);
    backdrop-filter:blur(4px);
    padding:10px 20px;
    border-radius:18px;
    font-weight:700;
    font-size:15px;
    box-shadow:0 4px 12px rgba(75,46,131,0.15);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .stat-pill span.num{
    color:var(--petal);
    font-size:18px;
  }

  .board{
    position:relative;
    z-index:1;
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:14px;
    width:100%;
    max-width:560px;
  }
  @media (max-width:480px){
    .board{grid-template-columns:repeat(3, 1fr); gap:10px;}
  }

  .card{
    aspect-ratio:1/1;
    perspective:800px;
    cursor:pointer;
  }
  .card-inner{
    position:relative;
    width:100%;
    height:100%;
    transition:transform 0.5s cubic-bezier(.68,-0.4,.27,1.4);
    transform-style:preserve-3d;
  }
  .card.flipped .card-inner{
    transform:rotateY(180deg);
  }
  .card.matched .card-inner{
    transform:rotateY(180deg) scale(1.05);
  }
  .card-face{
    position:absolute;
    inset:0;
    border-radius:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    backface-visibility:hidden;
    padding:6px;
    text-align:center;
  }
  .card-back{
    background:linear-gradient(145deg, var(--card-back-1), var(--card-back-2));
    box-shadow:0 6px 0 rgba(75,46,131,0.35), 0 8px 14px rgba(0,0,0,0.15);
    font-size:28px;
  }
  .card-back::after{
    content:"🌼";
    filter:drop-shadow(0 2px 2px rgba(0,0,0,0.2));
  }
  .card-front{
    background:var(--cream);
    transform:rotateY(180deg);
    font-weight:700;
    font-size:clamp(14px, 4.2vw, 19px);
    color:#4B2E83;
    box-shadow:0 6px 0 rgba(0,0,0,0.08), 0 8px 14px rgba(0,0,0,0.12);
    border:3px solid transparent;
  }
  .card.matched .card-front{
    background:linear-gradient(145deg, #D8FFDB, #B9F6C6);
    border-color:var(--grass);
    animation:bloom 0.6s ease;
  }
  @keyframes bloom{
    0%{transform:rotateY(180deg) scale(1);}
    40%{transform:rotateY(180deg) scale(1.18);}
    100%{transform:rotateY(180deg) scale(1.05);}
  }
  .card.wrong .card-inner{
    animation:shake 0.45s;
  }
  @keyframes shake{
    0%,100%{transform:rotateY(180deg) translateX(0);}
    25%{transform:rotateY(180deg) translateX(-8px);}
    75%{transform:rotateY(180deg) translateX(8px);}
  }

  .controls{
    position:relative;
    z-index:1;
    margin-top:26px;
    display:flex;
    gap:12px;
  }
  button.action{
    font-family:'Vazirmatn', sans-serif;
    font-weight:700;
    font-size:15px;
    padding:12px 26px;
    border:none;
    border-radius:16px;
    background:var(--petal);
    color:white;
    cursor:pointer;
    box-shadow:0 5px 0 #C24C6B;
    transition:transform 0.1s;
  }
  button.action:active{
    transform:translateY(4px);
    box-shadow:0 1px 0 #C24C6B;
  }
  button.action.secondary{
    background:var(--sky);
    box-shadow:0 5px 0 #2E9BCF;
  }
  button.action.secondary:active{
    box-shadow:0 1px 0 #2E9BCF;
  }

  .hint-bar{
    position:relative;
    z-index:1;
    margin-top:16px;
    font-size:14px;
    font-weight:600;
    color:#5C3D8F;
    background:rgba(255,255,255,0.7);
    padding:8px 16px;
    border-radius:12px;
  }

  /* Win overlay */
  .overlay{
    position:fixed;
    inset:0;
    background:rgba(75,46,131,0.55);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:10;
    padding:20px;
  }
  .overlay.show{display:flex;}
  .win-card{
    background:var(--cream);
    border-radius:26px;
    padding:34px 28px;
    text-align:center;
    max-width:360px;
    box-shadow:0 20px 40px rgba(0,0,0,0.3);
    animation:popin 0.5s cubic-bezier(.68,-0.4,.27,1.4);
  }
  @keyframes popin{
    0%{transform:scale(0.6); opacity:0;}
    100%{transform:scale(1); opacity:1;}
  }
  .win-card .big-emoji{
    font-size:56px;
    margin-bottom:6px;
  }
  .win-card h2{
    margin:6px 0;
    color:#4B2E83;
    font-size:24px;
  }
  .win-card p{
    color:#5C3D8F;
    font-weight:600;
    margin:4px 0 20px;
  }
  .stars{
    font-size:30px;
    letter-spacing:6px;
    margin-bottom:10px;
  }

  .confetti{
    position:fixed;
    top:-20px;
    font-size:20px;
    z-index:20;
    pointer-events:none;
    animation:fall linear forwards;
  }
  @keyframes fall{
    to{transform:translateY(110vh) rotate(360deg); opacity:0.2;}
  }
</style>
</head>
<body>

<div class="blob" style="width:90px;height:90px;background:var(--sun);top:8%;left:6%;animation-delay:0s;"></div>
<div class="blob" style="width:60px;height:60px;background:var(--grass);top:70%;left:4%;animation-delay:2s;"></div>
<div class="blob" style="width:70px;height:70px;background:var(--sky);top:12%;right:6%;animation-delay:1s;"></div>
<div class="blob" style="width:50px;height:50px;background:var(--petal);top:75%;right:8%;animation-delay:3s;"></div>

<header>
  <div class="eyebrow">فارسی پایه دوم دبستان 🌸</div>
  <h1>باغ کلمات هم‌معنی</h1>
  <div class="subtitle">کارت‌ها رو باز کن و کلمه‌ها رو با هم‌معنیشون جفت کن! 🐝</div>
</header>

<div class="stats">
  <div class="stat-pill">🌟 امتیاز: <span class="num" id="scoreVal">0</span></div>
  <div class="stat-pill">🔄 تلاش: <span class="num" id="movesVal">0</span></div>
  <div class="stat-pill">⏱️ زمان: <span class="num" id="timeVal">۰۰:۰۰</span></div>
</div>

<div class="board" id="board"></div>

<div class="hint-bar" id="hintBar">دو کارت رو انتخاب کن تا ببینی هم‌معنی هستن یا نه 🌼</div>

<div class="controls">
  <button class="action" id="restartBtn">🔁 بازی جدید</button>
  <button class="action secondary" id="hintBtn">💡 راهنمایی</button>
</div>

<div class="overlay" id="overlay">
  <div class="win-card">
    <div class="big-emoji">🏆</div>
    <h2>آفرین قهرمان کلمات!</h2>
    <div class="stars" id="starsDisplay">⭐⭐⭐</div>
    <p id="winSummary">همه‌ی کلمه‌ها رو درست جفت کردی!</p>
    <button class="action" id="playAgainBtn">🌻 دوباره بازی کن</button>
  </div>
</div>

<script>
  const pairs = [
    ["شاد", "خوشحال"],
    ["زیبا", "قشنگ"],
    ["آرام", "ساکت"],
    ["تند", "سریع"],
    ["بزرگ", "درشت"],
    ["کوچک", "ریز"],
    ["دانا", "عاقل"],
    ["نیرو", "قدرت"],
  ];

  let cards = [];
  let flipped = [];
  let matchedCount = 0;
  let moves = 0;
  let score = 0;
  let timerInterval = null;
  let seconds = 0;
  let lock = false;

  const board = document.getElementById('board');
  const scoreVal = document.getElementById('scoreVal');
  const movesVal = document.getElementById('movesVal');
  const timeVal = document.getElementById('timeVal');
  const hintBar = document.getElementById('hintBar');
  const overlay = document.getElementById('overlay');
  const starsDisplay = document.getElementById('starsDisplay');
  const winSummary = document.getElementById('winSummary');

  const toPersianDigits = (n) => n.toString().replace(/\d/g, d => "۰۱۲۳۴۵۶۷۸۹"[d]);

  function formatTime(s){
    const m = Math.floor(s/60).toString().padStart(2,'0');
    const sec = (s%60).toString().padStart(2,'0');
    return toPersianDigits(m) + ":" + toPersianDigits(sec);
  }

  function shuffle(arr){
    for(let i = arr.length -1; i>0; i--){
      const j = Math.floor(Math.random()*(i+1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function buildDeck(){
    let deck = [];
    pairs.forEach((p, idx) => {
      deck.push({word:p[0], pairId:idx});
      deck.push({word:p[1], pairId:idx});
    });
    return shuffle(deck);
  }

  function startTimer(){
    clearInterval(timerInterval);
    seconds = 0;
    timeVal.textContent = formatTime(seconds);
    timerInterval = setInterval(() => {
      seconds++;
      timeVal.textContent = formatTime(seconds);
    }, 1000);
  }

  function render(){
    board.innerHTML = "";
    cards.forEach((c, i) => {
      const cardEl = document.createElement('div');
      cardEl.className = 'card';
      cardEl.dataset.index = i;
      cardEl.innerHTML = `
        <div class="card-inner">
          <div class="card-face card-back"></div>
          <div class="card-face card-front">${c.word}</div>
        </div>
      `;
      cardEl.addEventListener('click', () => onCardClick(i));
      board.appendChild(cardEl);
    });
  }

  function onCardClick(i){
    if(lock) return;
    const cardEl = board.children[i];
    const c = cards[i];
    if(cardEl.classList.contains('flipped') || cardEl.classList.contains('matched')) return;
    if(flipped.length >= 2) return;

    cardEl.classList.add('flipped');
    flipped.push(i);

    if(flipped.length === 2){
      moves++;
      movesVal.textContent = toPersianDigits(moves);
      const [i1, i2] = flipped;
      if(cards[i1].pairId === cards[i2].pairId){
        lock = true;
        setTimeout(() => {
          board.children[i1].classList.add('matched');
          board.children[i2].classList.add('matched');
          matchedCount++;
          score += 15;
          scoreVal.textContent = toPersianDigits(score);
          hintBar.textContent = "آفرین! این دو کلمه هم‌معنی بودن 🌸";
          flipped = [];
          lock = false;
          if(matchedCount === pairs.length){
            finishGame();
          }
        }, 350);
      } else {
        lock = true;
        board.children[i1].classList.add('wrong');
        board.children[i2].classList.add('wrong');
        hintBar.textContent = "این دو کلمه هم‌معنی نبودن، دوباره تلاش کن 🐞";
        setTimeout(() => {
          board.children[i1].classList.remove('flipped','wrong');
          board.children[i2].classList.remove('flipped','wrong');
          flipped = [];
          lock = false;
        }, 800);
      }
    }
  }

  function finishGame(){
    clearInterval(timerInterval);
    let starCount = 3;
    if(moves > pairs.length * 2) starCount = 2;
    if(moves > pairs.length * 3) starCount = 1;
    starsDisplay.textContent = "⭐".repeat(starCount) + "☆".repeat(3-starCount);
    winSummary.textContent = `زمان: ${formatTime(seconds)} | تلاش: ${toPersianDigits(moves)} | امتیاز: ${toPersianDigits(score)}`;
    setTimeout(() => {
      overlay.classList.add('show');
      launchConfetti();
    }, 500);
  }

  function launchConfetti(){
    const emojis = ["🌸","🌼","🎉","🌟","🦋","🌷"];
    for(let i=0;i<40;i++){
      const el = document.createElement('div');
      el.className = 'confetti';
      el.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      el.style.left = Math.random()*100 + "vw";
      el.style.animationDuration = (2.5 + Math.random()*2) + "s";
      el.style.fontSize = (16 + Math.random()*14) + "px";
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 5000);
    }
  }

  function newGame(){
    cards = buildDeck();
    flipped = [];
    matchedCount = 0;
    moves = 0;
    score = 0;
    lock = false;
    scoreVal.textContent = "۰";
    movesVal.textContent = "۰";
    hintBar.textContent = "دو کارت رو انتخاب کن تا ببینی هم‌معنی هستن یا نه 🌼";
    overlay.classList.remove('show');
    render();
    startTimer();
  }

  document.getElementById('restartBtn').addEventListener('click', newGame);
  document.getElementById('playAgainBtn').addEventListener('click', newGame);
  document.getElementById('hintBtn').addEventListener('click', () => {
    hintBar.textContent = "راهنمایی: مثلاً «شاد» یعنی همون «خوشحال»! دنبال جفتش بگرد 😊";
  });

  newGame();
</script>

</body>
</html>
