<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>گردونه واژگان فارسی</title>

    <!-- ============================================================
    CSS – تمام استایل‌ها، انیمیشن‌ها و طراحی واکنش‌گرا
    ============================================================ -->
    <style>
        /* ---------- متغیرها و ریشه ---------- */
        :root {
            --pink-primary: #FF85C2;
            --pink-light: #FFB3D9;
            --pink-dark: #E85A9E;
            --pink-pastel: #FFD6E7;
            --purple-pastel: #D4B8FF;
            --blue-pastel: #B8D4FF;
            --green-pastel: #B8FFD4;
            --yellow-pastel: #FFE5B8;
            --orange-pastel: #FFD4B8;
            --shadow-soft: 0 12px 40px rgba(255, 133, 194, 0.30);
            --shadow-glow: 0 0 40px rgba(255, 133, 194, 0.50);
            --radius-round: 40px;
            --radius-soft: 24px;
            --font-persian: 'Vazir', 'IRANSans', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* ---------- بازنشانی و پایه ---------- */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-persian);
            background: linear-gradient(145deg, #FFF0F7 0%, #FFD9E8 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            direction: rtl;
            overflow-x: hidden;
            position: relative;
        }

        /* ---------- پس‌زمینه کودکانه ---------- */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background-image:
                radial-gradient(circle at 10% 20%, rgba(255, 215, 235, 0.5) 0%, transparent 50%),
                radial-gradient(circle at 90% 80%, rgba(180, 210, 255, 0.4) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(255, 230, 180, 0.3) 0%, transparent 70%);
        }

        /* المان‌های تزئینی شناور */
        .floating-decor {
            position: fixed;
            z-index: 0;
            pointer-events: none;
            font-size: 2.4rem;
            opacity: 0.40;
            animation: floatDecor 8s ease-in-out infinite alternate;
        }
        .floating-decor:nth-child(1) {
            top: 6%;
            right: 4%;
            animation-delay: 0s;
        }
        .floating-decor:nth-child(2) {
            top: 12%;
            left: 6%;
            animation-delay: 1.2s;
            font-size: 3rem;
        }
        .floating-decor:nth-child(3) {
            bottom: 18%;
            right: 8%;
            animation-delay: 2.4s;
            font-size: 2.8rem;
        }
        .floating-decor:nth-child(4) {
            bottom: 24%;
            left: 4%;
            animation-delay: 0.8s;
            font-size: 2.2rem;
        }
        .floating-decor:nth-child(5) {
            top: 45%;
            right: 2%;
            animation-delay: 3.2s;
            font-size: 1.8rem;
        }
        .floating-decor:nth-child(6) {
            top: 55%;
            left: 2%;
            animation-delay: 1.8s;
            font-size: 2.6rem;
        }

        @keyframes floatDecor {
            0% {
                transform: translateY(0px) rotate(0deg) scale(1);
            }
            100% {
                transform: translateY(-30px) rotate(12deg) scale(1.08);
            }
        }

        /* ---------- کانتینر اصلی ---------- */
        .game-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 820px;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: var(--radius-round);
            padding: 28px 24px 36px;
            box-shadow:
                0 20px 60px rgba(255, 133, 194, 0.25),
                inset 0 2px 0 rgba(255, 255, 255, 0.70);
            border: 1px solid rgba(255, 255, 255, 0.40);
            transition: all 0.3s ease;
        }

        /* ---------- هدر بازی ---------- */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px 16px;
            margin-bottom: 20px;
            padding-bottom: 14px;
            border-bottom: 2px dashed rgba(255, 133, 194, 0.30);
        }

        .game-title {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--pink-dark);
            text-shadow: 0 3px 12px rgba(255, 133, 194, 0.30);
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .game-title span {
            font-size: 1.8rem;
        }
        .student-name-badge {
            font-size: 0.85rem;
            background: rgba(255, 255, 255, 0.60);
            padding: 4px 16px;
            border-radius: 40px;
            color: #6A2E5A;
            font-weight: 600;
            box-shadow: inset 0 1px 4px rgba(255, 255, 255, 0.80);
            margin-right: 8px;
        }

        .score-area {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .score-box {
            background: linear-gradient(135deg, #FFE5F0, #FFD0E4);
            padding: 8px 22px;
            border-radius: 60px;
            box-shadow: inset 0 2px 6px rgba(255, 255, 255, 0.60), 0 4px 16px rgba(255, 133, 194, 0.25);
            font-size: 1.2rem;
            font-weight: 700;
            color: #7A2E5A;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .score-box .score-number {
            font-size: 1.8rem;
            color: var(--pink-dark);
            min-width: 44px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .sound-toggle {
            background: rgba(255, 255, 255, 0.70);
            border: none;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(255, 133, 194, 0.20);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }
        .sound-toggle:hover {
            transform: scale(1.08);
            box-shadow: 0 6px 24px rgba(255, 133, 194, 0.35);
        }
        .sound-toggle:active {
            transform: scale(0.94);
        }

        /* ---------- شخصیت مداد ---------- */
        .pencil-character {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 6px 0 10px;
            min-height: 76px;
            transition: all 0.4s ease;
        }
        .pencil-wrapper {
            display: flex;
            align-items: center;
            gap: 14px;
            background: rgba(255, 255, 255, 0.50);
            padding: 6px 20px 6px 28px;
            border-radius: 60px;
            backdrop-filter: blur(4px);
            box-shadow: 0 4px 20px rgba(255, 133, 194, 0.15);
            transition: all 0.4s ease;
        }

        .pencil-icon {
            font-size: 3.2rem;
            line-height: 1;
            filter: drop-shadow(0 6px 16px rgba(255, 133, 194, 0.30));
            transition: all 0.4s ease;
            transform-origin: center;
            animation: pencilFloat 3s ease-in-out infinite;
        }
        .pencil-icon.happy {
            animation: pencilHappy 0.6s ease forwards;
        }
        .pencil-icon.sad {
            animation: pencilSad 0.6s ease forwards;
        }

        @keyframes pencilFloat {
            0%,
            100% {
                transform: translateY(0) rotate(-2deg);
            }
            50% {
                transform: translateY(-8px) rotate(2deg);
            }
        }
        @keyframes pencilHappy {
            0% {
                transform: scale(1) rotate(0deg);
            }
            30% {
                transform: scale(1.25) rotate(-8deg);
            }
            60% {
                transform: scale(0.95) rotate(4deg);
            }
            100% {
                transform: scale(1) rotate(0deg);
            }
        }
        @keyframes pencilSad {
            0% {
                transform: translateX(0) rotate(0deg);
            }
            20% {
                transform: translateX(-10px) rotate(-6deg);
            }
            40% {
                transform: translateX(10px) rotate(6deg);
            }
            60% {
                transform: translateX(-6px) rotate(-3deg);
            }
            100% {
                transform: translateX(0) rotate(0deg);
            }
        }

        .pencil-message {
            font-size: 1.15rem;
            font-weight: 600;
            color: #6A2E5A;
            padding: 4px 12px;
            background: rgba(255, 255, 255, 0.60);
            border-radius: 30px;
            min-width: 80px;
            text-align: center;
            transition: all 0.4s ease;
            box-shadow: inset 0 1px 4px rgba(255, 255, 255, 0.80);
        }
        .pencil-message.happy-msg {
            color: #2A7A4A;
            background: rgba(180, 255, 200, 0.50);
        }
        .pencil-message.sad-msg {
            color: #A04040;
            background: rgba(255, 200, 200, 0.50);
        }

        /* ---------- گردونه (Canvas) ---------- */
        .wheel-section {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 10px 0 16px;
            padding: 12px;
        }

        .wheel-wrapper {
            position: relative;
            width: 100%;
            max-width: 460px;
            aspect-ratio: 1/1;
            margin: 0 auto;
        }

        #wheelCanvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
            border-radius: 50%;
            box-shadow:
                0 12px 48px rgba(255, 133, 194, 0.30),
                inset 0 -4px 20px rgba(255, 255, 255, 0.40),
                0 0 0 6px rgba(255, 255, 255, 0.50);
            transition: box-shadow 0.3s ease;
            cursor: pointer;
            touch-action: none;
        }
        #wheelCanvas.spinning {
            box-shadow:
                0 12px 60px rgba(255, 133, 194, 0.50),
                inset 0 -4px 20px rgba(255, 255, 255, 0.40),
                0 0 0 8px rgba(255, 215, 235, 0.70),
                0 0 60px rgba(255, 200, 220, 0.40);
        }

        /* فلش بالای گردونه */
        .wheel-pointer {
            position: absolute;
            top: -14px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            font-size: 3.4rem;
            line-height: 1;
            filter: drop-shadow(0 6px 20px rgba(255, 80, 140, 0.50));
            animation: pointerBounce 2s ease-in-out infinite;
            pointer-events: none;
            text-shadow: 0 0 30px rgba(255, 133, 194, 0.30);
        }
        @keyframes pointerBounce {
            0%,
            100% {
                transform: translateX(-50%) translateY(0) scale(1);
            }
            50% {
                transform: translateX(-50%) translateY(-8px) scale(1.06);
            }
        }

        /* ---------- بخش سؤال ---------- */
        .question-area {
            margin: 16px 0 20px;
            padding: 16px 20px 20px;
            background: rgba(255, 255, 255, 0.60);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: var(--radius-soft);
            box-shadow: 0 8px 32px rgba(255, 133, 194, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.50);
            transition: all 0.4s ease;
            min-height: 140px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .question-area.shake {
            animation: shakeCard 0.5s ease;
        }
        @keyframes shakeCard {
            0%,
            100% {
                transform: translateX(0);
            }
            20% {
                transform: translateX(-16px) rotate(-2deg);
            }
            40% {
                transform: translateX(16px) rotate(2deg);
            }
            60% {
                transform: translateX(-10px);
            }
            80% {
                transform: translateX(10px);
            }
        }

        .question-text {
            font-size: 1.4rem;
            font-weight: 700;
            color: #4A2A3A;
            text-align: center;
            margin-bottom: 16px;
            line-height: 1.6;
        }
        .question-text .highlight-word {
            color: var(--pink-dark);
            background: rgba(255, 133, 194, 0.15);
            padding: 0 10px;
            border-radius: 12px;
            font-size: 1.6rem;
        }

        .options-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 14px;
            width: 100%;
            max-width: 480px;
        }

        .option-btn {
            flex: 1 1 calc(50% - 14px);
            min-width: 120px;
            padding: 14px 18px;
            border: none;
            border-radius: 60px;
            font-size: 1.15rem;
            font-weight: 700;
            color: #3A2A3A;
            background: linear-gradient(145deg, #FFFFFF, #FFF5F9);
            box-shadow: 0 6px 24px rgba(255, 133, 194, 0.20), inset 0 2px 0 #FFFFFF;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: var(--font-persian);
            position: relative;
            overflow: hidden;
            touch-action: manipulation;
        }
        .option-btn:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 10px 32px rgba(255, 133, 194, 0.30), inset 0 2px 0 #FFFFFF;
        }
        .option-btn:active:not(:disabled) {
            transform: scale(0.96);
        }
        .option-btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            transform: none !important;
        }
        .option-btn .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 133, 194, 0.30);
            transform: scale(0);
            animation: rippleAnim 0.7s ease-out forwards;
            pointer-events: none;
        }
        @keyframes rippleAnim {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }
        .option-btn.correct-answer {
            background: linear-gradient(145deg, #90EE90, #66D866) !important;
            box-shadow: 0 0 40px rgba(80, 220, 80, 0.50) !important;
            color: #1A4A1A;
            transform: scale(1.04);
        }
        .option-btn.wrong-answer {
            background: linear-gradient(145deg, #FF8A8A, #E06060) !important;
            box-shadow: 0 0 40px rgba(220, 60, 60, 0.40) !important;
            color: #4A1A1A;
            transform: scale(0.96);
        }
        .option-btn.show-correct {
            background: linear-gradient(145deg, #90EE90, #66D866) !important;
            box-shadow: 0 0 30px rgba(80, 220, 80, 0.35) !important;
        }

        /* ---------- دکمه‌های کنترل ---------- */
        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 14px;
            margin: 18px 0 8px;
        }

        .btn {
            padding: 14px 34px;
            border: none;
            border-radius: 60px;
            font-size: 1.15rem;
            font-weight: 700;
            font-family: var(--font-persian);
            color: #FFFFFF;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 6px 24px rgba(255, 133, 194, 0.30);
            touch-action: manipulation;
            min-width: 120px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn:active:not(:disabled) {
            transform: scale(0.94);
        }
        .btn:disabled {
            opacity: 0.50;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-primary {
            background: linear-gradient(145deg, #FF85C2, #E85A9E);
            box-shadow: 0 6px 28px rgba(255, 133, 194, 0.40);
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 10px 40px rgba(255, 133, 194, 0.50), 0 0 30px rgba(255, 133, 194, 0.20);
        }

        .btn-success {
            background: linear-gradient(145deg, #66D866, #44B844);
            box-shadow: 0 6px 28px rgba(80, 200, 80, 0.35);
        }
        .btn-success:hover:not(:disabled) {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 10px 40px rgba(80, 200, 80, 0.45), 0 0 30px rgba(80, 200, 80, 0.20);
        }

        .btn-gold {
            background: linear-gradient(145deg, #FFD700, #F0B800);
            box-shadow: 0 6px 28px rgba(255, 215, 0, 0.40);
            color: #4A3A00;
        }
        .btn-gold:hover:not(:disabled) {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 10px 40px rgba(255, 215, 0, 0.50), 0 0 30px rgba(255, 215, 0, 0.20);
        }

        .btn-outline {
            background: rgba(255, 255, 255, 0.70);
            box-shadow: 0 6px 20px rgba(255, 133, 194, 0.15);
            color: #6A2E5A;
            border: 2px solid rgba(255, 133, 194, 0.30);
        }
        .btn-outline:hover:not(:disabled) {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 10px 32px rgba(255, 133, 194, 0.25);
            border-color: var(--pink-primary);
        }

        .btn .glow {
            position: absolute;
            inset: -2px;
            border-radius: 60px;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.40), transparent 70%);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .btn:hover:not(:disabled) .glow {
            opacity: 1;
        }
        .btn .bounce-in {
            animation: btnBounce 0.6s ease;
        }
        @keyframes btnBounce {
            0% {
                transform: scale(0.7);
                opacity: 0;
            }
            50% {
                transform: scale(1.12);
            }
            70% {
                transform: scale(0.95);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* ============================================================
           صفحه‌ی سوم – کارنامه (مودال تمام‌صفحه)
           ============================================================ */
        .result-overlay {
            position: fixed;
            inset: 0;
            z-index: 10001;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
            animation: fadeInOverlay 0.5s ease;
        }
        .result-overlay.show {
            display: flex;
        }
        @keyframes fadeInOverlay {
            0% {
                opacity: 0;
                transform: scale(0.95);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .result-card {
            background: linear-gradient(145deg, #FFFFFF, #FFF5F9);
            border-radius: var(--radius-round);
            padding: 40px 36px 44px;
            max-width: 620px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 30px 80px rgba(255, 133, 194, 0.30);
            border: 1px solid rgba(255, 255, 255, 0.60);
            text-align: center;
            position: relative;
        }
        .result-card .close-result {
            position: absolute;
            top: 16px;
            left: 20px;
            background: none;
            border: none;
            font-size: 2rem;
            cursor: pointer;
            color: #B08A9A;
            transition: transform 0.3s ease;
            line-height: 1;
        }
        .result-card .close-result:hover {
            transform: rotate(90deg) scale(1.1);
            color: var(--pink-dark);
        }

        .result-card .result-icon {
            font-size: 4rem;
            display: block;
            margin-bottom: 4px;
        }
        .result-card .result-title {
            font-size: 2rem;
            font-weight: 800;
            color: var(--pink-dark);
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .result-card .result-title .trophy {
            font-size: 3.2rem;
            animation: trophyGlow 1.6s ease-in-out infinite alternate;
        }
        @keyframes trophyGlow {
            0% {
                filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.30));
                transform: scale(1);
            }
            100% {
                filter: drop-shadow(0 0 40px rgba(255, 215, 0, 0.70));
                transform: scale(1.08);
            }
        }
        .result-card .result-student {
            font-size: 1.2rem;
            background: rgba(255, 255, 255, 0.60);
            padding: 4px 24px;
            border-radius: 40px;
            color: #6A2E5A;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 12px;
        }

        .result-card .result-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 14px;
            margin: 16px 0 24px;
        }
        .result-card .result-item {
            background: rgba(255, 255, 255, 0.60);
            padding: 14px 10px;
            border-radius: var(--radius-soft);
            box-shadow: inset 0 1px 4px rgba(255, 255, 255, 0.80);
        }
        .result-card .result-item .label {
            font-size: 0.85rem;
            color: #7A5A6A;
            font-weight: 500;
        }
        .result-card .result-item .value {
            font-size: 2rem;
            font-weight: 800;
            color: var(--pink-dark);
        }
        .result-card .result-item .value.green {
            color: #3A9A4A;
        }
        .result-card .result-item .value.red {
            color: #C05050;
        }
        .result-card .result-item .value.gold {
            color: #D4A000;
        }

        .result-card .result-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 14px;
            margin-top: 12px;
        }
        .result-card .result-actions .btn {
            min-width: 130px;
            flex: 1 1 auto;
        }

        /* استایل چاپ – فقط کارنامه چاپ شود */
        @media print {
            body * {
                visibility: hidden;
            }
            .result-overlay,
            .result-overlay * {
                visibility: visible;
            }
            .result-overlay {
                position: fixed;
                inset: 0;
                background: white !important;
                backdrop-filter: none !important;
                -webkit-backdrop-filter: none !important;
                padding: 20px;
                display: flex !important;
                align-items: center;
                justify-content: center;
            }
            .result-card {
                box-shadow: none !important;
                border: 1px solid #ddd !important;
                max-width: 100% !important;
                border-radius: 20px !important;
            }
            .result-card .close-result,
            .result-card .result-actions .btn {
                display: none !important;
            }
            .result-card .result-actions {
                display: none !important;
            }

                    gain.gain.setValueAtTime((volume || 0.25), ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + duration);
                } catch (_) { /* silent */ }
            }

            function playSound(soundId) {
                if (!state.soundEnabled) return;
                try {
                    switch (soundId) {
                        case 'start':
                            playTone(523, 0.12, 'sine', 0.20);
                            setTimeout(() => playTone(659, 0.12, 'sine', 0.20), 130);
                            setTimeout(() => playTone(784, 0.18, 'sine', 0.22), 260);
                            break;
                        case 'spin':
                            for (let i = 0; i < 6; i++) {
                                setTimeout(() => {
                                    playTone(300 + i * 80, 0.06, 'sawtooth', 0.08);
                                }, i * 70);
                            }
                            break;
                        case 'tick':
                            playTone(1200, 0.06, 'sine', 0.12);
                            setTimeout(() => playTone(1400, 0.06, 'sine', 0.10), 80);
                            break;
                        case 'success':
                            playTone(523, 0.10, 'sine', 0.18);
                            setTimeout(() => playTone(659, 0.10, 'sine', 0.18), 120);
                            setTimeout(() => playTone(784, 0.14, 'sine', 0.20), 240);
                            setTimeout(() => playTone(1047, 0.20, 'sine', 0.22), 400);
                            break;
                        case 'wrong':
                            playTone(400, 0.20, 'sawtooth', 0.12);
                            setTimeout(() => playTone(300, 0.25, 'sawtooth', 0.10), 180);
                            break;
                        case 'gameover':
                            playTone(523, 0.10, 'sine', 0.18);
                            setTimeout(() => playTone(659, 0.10, 'sine', 0.18), 130);
                            setTimeout(() => playTone(784, 0.10, 'sine', 0.18), 260);
                            setTimeout(() => playTone(1047, 0.10, 'sine', 0.20), 390);
                            setTimeout(() => playTone(1319, 0.25, 'sine', 0.24), 520);
                            break;
                        case 'cheer':
                            playTone(880, 0.08, 'sine', 0.15);
                            setTimeout(() => playTone(1047, 0.08, 'sine', 0.15), 90);
                            setTimeout(() => playTone(1319, 0.10, 'sine', 0.15), 180);
                            setTimeout(() => playTone(1568, 0.14, 'sine', 0.18), 270);
                            break;
                        default:
                            break;
                    }
                } catch (_) { /* silent */ }
            }

            // ----------------------------------------------------------
            // ۶. توابع کمکی
            // ----------------------------------------------------------
            function shuffleArray(arr) {
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                return arr;
            }

            function pickRandom(arr, count) {
                const shuffled = shuffleArray([...arr]);
                return shuffled.slice(0, count);
            }

            function getRandomWrongMeaning(correctMeaning, excludeWord) {
                const others = VOCABULARY.filter(v => v.meaning !== correctMeaning && v.word !== excludeWord);
                if (others.length === 0) return 'معنی دیگر';
                const picked = others[Math.floor(Math.random() * others.length)];
                return picked.meaning;
            }

            function formatTime(seconds) {
                const m = Math.floor(seconds / 60);
                const s = Math.floor(seconds % 60);
                if (m > 0) return `${m} دقیقه و ${s} ثانیه`;
                return `${s} ثانیه`;
            }

            // ----------------------------------------------------------
            // ۷. گردونه – رسم و چرخش (با نمایش کامل کلمات)
            // ----------------------------------------------------------
            function drawWheel(rotation) {
                const w = canvas.width;
                const h = canvas.height;
                const cx = w / 2;
                const cy = h / 2;
                const radius = Math.min(w, h) * 0.44;

                ctx.clearRect(0, 0, w, h);

                if (state.gameWords.length === 0) {
                    ctx.fillStyle = '#FFD0E4';
                    ctx.beginPath();
                    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#8A5A7A';
                    ctx.font = 'bold 20px Vazir, IRANSans, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('🎯', cx, cy - 10);
                    ctx.font = '16px Vazir, IRANSans, sans-serif';
                    ctx.fillText('واژه‌ای نیست', cx, cy + 30);
                    return;
                }

                const n = state.gameWords.length;
                const angleStep = (Math.PI * 2) / n;

                for (let i = 0; i < n; i++) {
                    const startAngle = rotation + i * angleStep;
                    const endAngle = startAngle + angleStep;

                    const color = PASTEL_COLORS[i % PASTEL_COLORS.length];
                    ctx.beginPath();
                    ctx.moveTo(cx, cy);
                    ctx.arc(cx, cy, radius, startAngle, endAngle);
                    ctx.closePath();

                    const grad = ctx.createRadialGradient(
                        cx + radius * 0.3 * Math.cos(startAngle + angleStep / 2),
                        cy + radius * 0.3 * Math.sin(startAngle + angleStep / 2),
                        10,
                        cx, cy, radius
                    );
                    grad.addColorStop(0, lightenColor(color, 40));
                    grad.addColorStop(0.7, color);
                    grad.addColorStop(1, darkenColor(color, 20));
                    ctx.fillStyle = grad;
                    ctx.fill();

                    // براقیت
                    ctx.save();
                    ctx.beginPath();
                    ctx.moveTo(cx, cy);
                    ctx.arc(cx, cy, radius, startAngle, endAngle);
                    ctx.closePath();
                    ctx.clip();

                    const glossGrad = ctx.createRadialGradient(
                        cx + radius * 0.2 * Math.cos(startAngle + angleStep / 2),
                        cy + radius * 0.2 * Math.sin(startAngle + angleStep / 2),
                        2,
                        cx + radius * 0.1 * Math.cos(startAngle + angleStep / 2),
                        cy + radius * 0.1 * Math.sin(startAngle + angleStep / 2),
                        radius * 0.9
                    );
                    glossGrad.addColorStop(0, 'rgba(255,255,255,0.45)');
                    glossGrad.addColorStop(0.5, 'rgba(255,255,255,0.10)');
                    glossGrad.addColorStop(1, 'rgba(255,255,255,0)');
                    ctx.fillStyle = glossGrad;
                    ctx.fill();
                    ctx.restore();

                    ctx.strokeStyle = 'rgba(255,255,255,0.60)';
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    // متن کامل
                    const midAngle = startAngle + angleStep / 2;
                    const textRadius = radius * 0.62;
                    const x = cx + textRadius * Math.cos(midAngle);
                    const y = cy + textRadius * Math.sin(midAngle);

                    const word = state.gameWords[i].word;
                    let fontSize = 16;
                    if (word.length >= 8) fontSize = 12;
                    else if (word.length >= 6) fontSize = 14;
                    else if (word.length >= 4) fontSize = 16;

                    ctx.save();
                    ctx.translate(x, y);
                    ctx.rotate(midAngle + (midAngle > Math.PI / 2 ? Math.PI : 0));
                    ctx.fillStyle = '#4A2A3A';
                    ctx.font = `bold ${fontSize}px Vazir, IRANSans, sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.shadowColor = 'rgba(255,255,255,0.50)';
                    ctx.shadowBlur = 6;
                    ctx.fillText(word, 0, 0);
                    ctx.restore();
                }

                // دایره مرکزی
                const centerGrad = ctx.createRadialGradient(cx - 6, cy - 6, 4, cx, cy, radius * 0.16);
                centerGrad.addColorStop(0, '#FFFFFF');
                centerGrad.addColorStop(0.6, '#FFE5F0');
                centerGrad.addColorStop(1, '#FFB3D9');
                ctx.beginPath();
                ctx.arc(cx, cy, radius * 0.14, 0, Math.PI * 2);
                ctx.fillStyle = centerGrad;
                ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,0.70)';
                ctx.lineWidth = 3;
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(cx - 4, cy - 6, radius * 0.06, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,0.30)';
                ctx.fill();
            }

            function lightenColor(color, amount) {
                const r = parseInt(color.slice(1, 2), 16) * 17 || parseInt(color.slice(1, 3), 16);
                const g = parseInt(color.slice(2, 3), 16) * 17 || parseInt(color.slice(3, 5), 16);
                const b = parseInt(color.slice(3, 4), 16) * 17 || parseInt(color.slice(5, 7), 16);
                const nr = Math.min(255, r + amount);
                const ng = Math.min(255, g + amount);
                const nb = Math.min(255, b + amount);
                return `rgb(${nr},${ng},${nb})`;
            }

            function darkenColor(color, amount) {
                const r = parseInt(color.slice(1, 2), 16) * 17 || parseInt(color.slice(1, 3), 16);
                const g = parseInt(color.slice(2, 3), 16) * 17 || parseInt(color.slice(3, 5), 16);
                const b = parseInt(color.slice(3, 4), 16) * 17 || parseInt(color.slice(5, 7), 16);
                const nr = Math.max(0, r - amount);
                const ng = Math.max(0, g - amount);
                const nb = Math.max(0, b - amount);
                return `rgb(${nr},${ng},${nb})`;
            }

            // ----------------------------------------------------------
            // ۸. منطق چرخش گردونه
            // ----------------------------------------------------------
            function getSelectedIndex(rotation) {
                const n = state.gameWords.length;
                if (n === 0) return -1;
                const angleStep = (Math.PI * 2) / n;
                const pointerAngle = -Math.PI / 2;
                let rawAngle = (pointerAngle - rotation) % (Math.PI * 2);
                if (rawAngle < 0) rawAngle += Math.PI * 2;
                const idx = Math.floor(rawAngle / angleStep);
                return Math.min(idx, n - 1);
            }

            function spinWheel() {
                if (state.isSpinning || state.isAnswering || state.gameOver) return;
                if (state.gameWords.length === 0) {
                    setStatus('🎯 همه واژه‌ها تمام شد!', '');
                    return;
                }
                if (!state.gameStarted) {
                    setStatus('⏳ ابتدا «شروع بازی» را بزن.', '');
                    return;
                }

                state.isSpinning = true;
                btnSpin.disabled = true;
                canvas.classList.add('spinning');
                playSound('spin');

                const baseSpeed = 0.08 + Math.random() * 0.06;
                const extraSpins = 4 + Math.random() * 4;
                const targetRotation = state.rotation + (Math.PI * 2 * extraSpins) + (Math.random() * Math.PI * 2);
                const startRotation = state.rotation;
                const duration = 3000 + Math.random() * 1200;
                const startTime = performance.now();

                setOptionsEnabled(false);

                function animateSpin(now) {
                    const elapsed = now - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    const eased = 1 - Math.pow(1 - progress, 4);
                    state.rotation = startRotation + (targetRotation - startRotation) * eased;

                    drawWheel(state.rotation);

                    if (progress < 1) {
                        requestAnimationFrame(animateSpin);
                    } else {
                        state.rotation = targetRotation;
                        drawWheel(state.rotation);
                        canvas.classList.remove('spinning');
                        state.isSpinning = false;
                        playSound('tick');

                        const idx = getSelectedIndex(state.rotation);
                        if (idx >= 0 && idx < state.gameWords.length) {
                            state.selectedIndex = idx;
                            state.currentWord = state.gameWords[idx];
                            state.gameWords.splice(idx, 1);
                            state.usedWords.push(state.currentWord);
                            state.remainingWords = state.gameWords.length;

                            showQuestion(state.currentWord);
                            playSound('success');
                            setPencilHappy();
                            setPencilMessage('واژه انتخاب شد! ✨');
                        } else {
                            setStatus('⚠️ خطا در انتخاب واژه، دوباره امتحان کن.', '');
                            btnSpin.disabled = false;
                            state.isSpinning = false;
                        }
                    }
                }
                requestAnimationFrame(animateSpin);
            }

            // ----------------------------------------------------------
            // ۹. نمایش سؤال
            // ----------------------------------------------------------
            function showQuestion(wordObj) {
                state.isAnswering = true;
                const correctMeaning = wordObj.meaning;
                const wrongMeaning = getRandomWrongMeaning(correctMeaning, wordObj.word);

                const options = [
                    { text: correctMeaning, correct: true },
                    { text: wrongMeaning, correct: false }
                ];
                shuffleArray(options);

                questionText.innerHTML =
                    `معنی کلمهٔ <span class="highlight-word">«${wordObj.word}»</span> چیست؟`;

                optionsContainer.innerHTML = '';
                options.forEach((opt) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.textContent = opt.text;
                    btn.dataset.correct = opt.correct ? 'true' : 'false';
                    btn.addEventListener('click', () => handleAnswer(btn, wordObj, opt.correct));
                    btn.addEventListener('mousedown', function(e) {
                        const rect = this.getBoundingClientRect();
                        const ripple = document.createElement('span');
                        ripple.className = 'ripple';
                        const size = Math.max(rect.width, rect.height);
                        ripple.style.width = ripple.style.height = size + 'px';
                        ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
                        ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
                        this.appendChild(ripple);
                        setTimeout(() => ripple.remove(), 700);
                    });
                    optionsContainer.appendChild(btn);
                });

                setStatus(`🔍 ${state.remainingWords} واژهٔ باقی‌مانده`, '');
                btnSpin.disabled = true;
                questionArea.classList.remove('shake');
            }

            // ----------------------------------------------------------
            // ۱۰. مدیریت پاسخ
            // ----------------------------------------------------------
            function handleAnswer(btn, wordObj, isCorrect) {
                if (!state.isAnswering) return;
                state.isAnswering = false;

                const allBtns = optionsContainer.querySelectorAll('.option-btn');
                allBtns.forEach(b => b.disabled = true);

                if (isCorrect) {
                    btn.classList.add('correct-answer');
                    state.correctCount++;
                    state.correctWords.push(wordObj);
                    playSound('cheer');
                    setPencilHappy();
                    setPencilMessage('آفرین! 👏');
                    questionText.innerHTML = '✅ <span style="color:#2A7A4A;">آفرین! پاسخ درست بود.</span>';
                    setStatus('🌟 عالی! پاسخ درست بود.', 'happy');
                    updateCounts();
                    launchConfetti();
                    allBtns.forEach(b => {
                        if (b.dataset.correct === 'true') {
                            b.classList.add('show-correct');
                        }
                    });
                } else {
                    btn.classList.add('wrong-answer');
                    state.wrongCount++;
                    state.wrongWords.push(wordObj);
                    playSound('wrong');
                    setPencilSad();
                    setPencilMessage('اشکالی ندارد! 💪');
                    questionText.innerHTML =
                        `❌ <span style="color:#A04040;">اشکالی ندارد، دوباره تلاش کن.</span><br><span style="font-size:0.9rem;color:#6A4A6A;">پاسخ صحیح: <strong>«${wordObj.meaning}»</strong></span>`;
                    setStatus('😅 پاسخ اشتباه بود.', 'sad');
                    updateCounts();
                    questionArea.classList.remove('shake');
                    void questionArea.offsetWidth;
                    questionArea.classList.add('shake');
                    allBtns.forEach(b => {
                        if (b.dataset.correct === 'true') {
                            b.classList.add('show-correct');
                        }
                    });
                }

                setTimeout(() => {
                    questionArea.classList.remove('shake');
                    if (state.gameWords.length === 0) {
                        endGame();
                    } else {
                        state.isAnswering = false;
                        btnSpin.disabled = false;
                        setOptionsEnabled(false);
                        questionText.innerHTML = '🔄 گردونه را بچرخان!';
                        optionsContainer.innerHTML = '';
                        setStatus(`🎯 ${state.gameWords.length} واژه باقی‌مانده`, '');
                        if (state.gameWords.length > 0) {
                            btnSpin.disabled = false;
                        } else {
                            endGame();
                        }
                    }
                }, isCorrect ? 1200 : 2000);
            }

            // ----------------------------------------------------------
            // ۱۱. پایان بازی – نمایش کارنامه (صفحه‌ی سوم)
            // ----------------------------------------------------------
            function endGame() {
                state.gameOver = true;
                state.isPlaying = false;
                state.isAnswering = false;
                btnSpin.disabled = true;
                playSound('gameover');
                setPencilHappy();
                setPencilMessage('🎉 بازی تمام شد!');

                const elapsed = (Date.now() - state.startTime) / 1000;
                // پر کردن کارنامه
                rCorrect.textContent = state.correctCount;
                rWrong.textContent = state.wrongCount;
                rTime.textContent = formatTime(elapsed);
                platformSaved = true;
                syncSaveResult(student.studentCode, GAME_ID, state.correctCount, state.wrongCount, Math.round(elapsed));
                resultStudentName.textContent = state.studentName ? `🧑‍🎓 ${state.studentName}` : '';

                // نمایش کارنامه
                resultOverlay.classList.add('show');

                setStatus('🏁 بازی به پایان رسید!', '');
                questionText.innerHTML = '🎊 کارنامهٔ شما آماده است!';
                optionsContainer.innerHTML = '';

                // جشن
                launchConfetti();
                setTimeout(() => launchConfetti(), 800);
                setTimeout(() => launchConfetti(), 1600);
            }

            // ----------------------------------------------------------
            // ۱۲. شروع بازی (بعد از ثبت نام)
            // ----------------------------------------------------------
            function startGame() {
                const selected = pickRandom(VOCABULARY, 12);
                state.gameWords = selected.map(v => ({ ...v }));
                state.usedWords = [];
                state.correctWords = [];
                state.wrongWords = [];
                state.currentWord = null;
                state.correctCount = 0;
                state.wrongCount = 0;
                state.gameOver = false;
                state.isPlaying = true;
                state.isAnswering = false;
                state.isSpinning = false;
                state.gameStarted = true;
                state.remainingWords = state.gameWords.length;
                state.rotation = 0;
                state.startTime = Date.now();

                updateCounts();
                startTimer();
                resultOverlay.classList.remove('show');
                btnSpin.disabled = false;
                btnStart.disabled = true;
                questionArea.classList.remove('shake');

                drawWheel(0);

                setPencilHappy();
                setPencilMessage(`بازی شروع شد! 🚀 ${state.studentName}`);
                setStatus(`🎯 ${state.gameWords.length} واژه در گردونه`, '');
                questionText.innerHTML = '🌀 گردونه را بچرخان!';
                optionsContainer.innerHTML = '';
                playSound('start');

                studentNameBadge.textContent = state.studentName ? `👩‍🎓 ${state.studentName}` : '';
            }

            // ----------------------------------------------------------
            // ۱۳. بازی دوباره (از کارنامه)
            // ----------------------------------------------------------
            function restartGame() {
                // بستن کارنامه
                resultOverlay.classList.remove('show');

                // بازنشانی حالت
                state.gameWords = [];
                state.usedWords = [];
                state.correctWords = [];
                state.wrongWords = [];
                state.currentWord = null;
                state.correctCount = 0;
                state.wrongCount = 0;
                state.gameOver = false;
                state.isPlaying = false;
                state.isAnswering = false;
                state.isSpinning = false;
                state.gameStarted = false;
                state.remainingWords = 0;
                state.rotation = 0;

                updateCounts();
                btnSpin.disabled = true;
                btnStart.disabled = true;
                questionArea.classList.remove('shake');

                optionsContainer.innerHTML = '';
                questionText.innerHTML = 'برای شروع بازی، نام خود را وارد کن.';
                setPencilHappy();
                setPencilMessage('سلام! 😊');
                setStatus('✏️ نام خود را وارد کن', '');

                drawWheel(0);
                confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
                confettiCanvas.classList.remove('active');

                // نمایش مودال نام
                nameModal.classList.remove('hidden');
                studentNameInput.value = state.studentName || '';
                studentNameInput.focus();
                nameError.textContent = '';
                nameSubmitBtn.disabled = false;
                studentNameBadge.textContent = '';
            }

            // ----------------------------------------------------------
            // ۱۴. به‌روزرسانی شمارنده‌ها و تایمر
            // ----------------------------------------------------------
            function updateCounts() {
                headerCorrect.textContent = state.correctCount;
                headerWrong.textContent = state.wrongCount;
            }

            function startTimer() {
                clearInterval(timerInterval);
                timeLeft = window.timerSeconds || 180;
                updateTimer();
                timerInterval = setInterval(() => {
                    timeLeft--;
                    updateTimer();
                    if (timeLeft <= 0) {
                        clearInterval(timerInterval);
                        state.isPlaying = false;
                        btnSpin.disabled = true;
                    }
                }, 1000);
            }

            function updateTimer() {
                const minutes = Math.floor(timeLeft / 60);
                const seconds = String(timeLeft % 60).padStart(2, '0');
                gameTimer.textContent = `${minutes}:${seconds}`;
            }

            // ----------------------------------------------------------
            // ۱۵. وضعیت مداد
            // ----------------------------------------------------------
            function setPencilHappy() {
                pencilIcon.classList.remove('sad');
                pencilIcon.classList.add('happy');
                setTimeout(() => pencilIcon.classList.remove('happy'), 700);
            }

            function setPencilSad() {
                pencilIcon.classList.remove('happy');
                pencilIcon.classList.add('sad');
                setTimeout(() => pencilIcon.classList.remove('sad'), 700);
            }

            function setPencilMessage(msg) {
                pencilMessage.textContent = msg;
                pencilMessage.classList.remove('happy-msg', 'sad-msg');
                if (msg.includes('آفرین') || msg.includes('عالی') || msg.includes('درست')) {
                    pencilMessage.classList.add('happy-msg');
                } else if (msg.includes('اشکال') || msg.includes('تلاش')) {
                    pencilMessage.classList.add('sad-msg');
                }
            }

            // ----------------------------------------------------------
            // ۱۶. وضعیت و گزینه‌ها
            // ----------------------------------------------------------
            function setStatus(msg, type) {
                statusMsg.textContent = msg;
                statusMsg.style.color = type === 'happy' ? '#2A7A4A' : type === 'sad' ? '#A04040' : '#8A6A7A';
            }

            function setOptionsEnabled(enabled) {
                const btns = optionsContainer.querySelectorAll('.option-btn');
                btns.forEach(b => b.disabled = !enabled);
            }

            // ----------------------------------------------------------
            // ۱۷. کانفتی (با Canvas)
            // ----------------------------------------------------------
            let confettiPieces = [];
            let confettiAnimId = null;

            function launchConfetti() {
                const canvas = confettiCanvas;
                const ctx = confettiCtx;
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                canvas.classList.add('active');

                const colors = ['#FF85C2', '#FFD700', '#FF6B6B', '#4ECDC4', '#FFE66D', '#A29BFE', '#FD79A8', '#00CEC9'];
                const pieces = [];
                for (let i = 0; i < 120; i++) {
                    pieces.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height * 0.3 - 20,
                        w: 6 + Math.random() * 10,
                        h: 4 + Math.random() * 8,
                        color: colors[Math.floor(Math.random() * colors.length)],
                        vx: (Math.random() - 0.5) * 8,
                        vy: 2 + Math.random() * 6,
                        rot: Math.random() * 360,
                        rotSpeed: (Math.random() - 0.5) * 12,
                        life: 1,
                        decay: 0.003 + Math.random() * 0.005,
                        shape: Math.random() > 0.5 ? 'rect' : 'circle',
                    });
                }
                confettiPieces = pieces;

                if (confettiAnimId) cancelAnimationFrame(confettiAnimId);

                function animateConfetti() {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    let alive = false;
                    confettiPieces.forEach(p => {
                        p.x += p.vx;
                        p.y += p.vy;
                        p.vy += 0.08;
                        p.rot += p.rotSpeed;
                        p.life -= p.decay;
                        if (p.life > 0) {
                            alive = true;
                            ctx.save();
                            ctx.translate(p.x, p.y);
                            ctx.rotate((p.rot * Math.PI) / 180);
                            ctx.globalAlpha = p.life * 0.9;
                            ctx.fillStyle = p.color;
                            if (p.shape === 'rect') {
                                ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                            } else {
                                ctx.beginPath();
                                ctx.arc(0, 0, p.w / 2, 0, Math.PI * 2);
                                ctx.fill();
                            }
                            ctx.restore();
                        }
                    });
                    if (alive) {
                        confettiAnimId = requestAnimationFrame(animateConfetti);
                    } else {
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        canvas.classList.remove('active');
                        confettiAnimId = null;
                    }
                }
                animateConfetti();

                setTimeout(() => {
                    if (confettiAnimId) {
                        cancelAnimationFrame(confettiAnimId);
                        confettiAnimId = null;
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        canvas.classList.remove('active');
                    }
                }, 5000);
            }

            // ----------------------------------------------------------
            // ۱۸. اشتراک‌گذاری (از کارنامه)
            // ----------------------------------------------------------
            function shareResult() {
                const elapsed = (Date.now() - state.startTime) / 1000;
                const name = state.studentName || 'دانش‌آموز';
                const text =
                    `🧑‍🎓 ${name} در بازی «گردونه واژگان فارسی» بازی را به پایان رساند.\n` +
                    `✅ پاسخ صحیح: ${state.correctCount}\n` +
                    `❌ پاسخ اشتباه: ${state.wrongCount}\n` +
                    `⏱️ زمان: ${formatTime(elapsed)}\n` +
                    `🎯 #گردونه_واژگان #آموزش_فارسی`;

                if (navigator.share && window.innerWidth <= 768) {
                    navigator.share({
                        title: 'کارنامه بازی گردونه واژگان',
                        text: text,
                    }).catch(() => {
                        copyToClipboard(text);
                    });
                } else {
                    copyToClipboard(text);
                }
            }

            function copyToClipboard(text) {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(() => {
                        setStatus('✅ کارنامه کپی شد!', 'happy');
                        setPencilMessage('کپی شد! 📋');
                    }).catch(() => {
                        fallbackCopy(text);
                    });
                } else {
                    fallbackCopy(text);
                }
            }

            function fallbackCopy(text) {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                ta.style.left = '-9999px';
                document.body.appendChild(ta);
                ta.select();
                try {
                    document.execCommand('copy');
                    setStatus('✅ کارنامه کپی شد!', 'happy');
                    setPencilMessage('کپی شد! 📋');
                } catch (_) {
                    setStatus('⚠️ کپی نشد، دستی کپی کن.', 'sad');
                }
                document.body.removeChild(ta);
            }

            // ----------------------------------------------------------
            // ۱۹. چاپ کارنامه
            // ----------------------------------------------------------
            function printResult() {
                window.print();
            }

            // ----------------------------------------------------------
            // ۲۰. مدیریت مودال و ثبت نام
            // ----------------------------------------------------------
            function handleNameSubmit() {
                nameError.textContent = '';
                state.studentName = student.fullName;
                state.nameRegistered = true;
                nameModal.classList.add('hidden');
                startGame();
                btnStart.disabled = true;
            }

            studentNameInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    handleNameSubmit();
                }
            });

            nameSubmitBtn.addEventListener('click', handleNameSubmit);

            // ----------------------------------------------------------
            // ۲۱. رویدادهای دکمه‌ها
            // ----------------------------------------------------------
            btnStart.addEventListener('click', function() {
                if (!state.nameRegistered) {
                    nameModal.classList.remove('hidden');
                    studentNameInput.focus();
                } else {
                    startGame();
                }
            });

            btnSpin.addEventListener('click', spinWheel);

            // دکمه‌های کارنامه
            btnRestartFromResult.addEventListener('click', restartGame);
            btnShareFromResult.addEventListener('click', shareResult);
            btnPrintResult.addEventListener('click', printResult);
            closeResult.addEventListener('click', function() {
                resultOverlay.classList.remove('show');
            });

            soundToggle.addEventListener('click', function() {
                state.soundEnabled = !state.soundEnabled;
                this.textContent = state.soundEnabled ? '🔊' : '🔇';
                setStatus(state.soundEnabled ? '🔊 صدا روشن' : '🔇 صدا خاموش', '');
            });

            // چرخش با کلیک روی گردونه
            canvas.addEventListener('click', function(e) {
                if (!btnSpin.disabled && state.gameStarted && !state.isSpinning && !state.isAnswering) {
                    spinWheel();
                }
            });

            canvas.addEventListener('touchstart', function(e) {
                e.preventDefault();
                if (!btnSpin.disabled && state.gameStarted && !state.isSpinning && !state.isAnswering) {
                    spinWheel();
                }
            }, { passive: false });

            // تغییر اندازه
            let resizeTimer;
            window.addEventListener('resize', function() {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => {
                    drawWheel(state.rotation);
                    confettiCanvas.width = window.innerWidth;
                    confettiCanvas.height = window.innerHeight;
                }, 200);
            });

            // ----------------------------------------------------------
            // ۲۲. مقداردهی اولیه
            // ----------------------------------------------------------
            function init() {
                confettiCanvas.width = window.innerWidth;
                confettiCanvas.height = window.innerHeight;
                drawWheel(0);
                setPencilMessage('سلام! 😊');
                state.studentName = student.fullName;
                state.nameRegistered = true;
                setStatus('✏️ برای شروع آماده‌ای؟', '');
                btnSpin.disabled = true;
                btnStart.disabled = false;
                questionText.innerHTML = 'برای شروع بازی، دکمه را بزن!';
                nameModal.classList.add('hidden');
            }

            init();

            console.log('🎯 گردونه واژگان فارسی – نسخه ۳.۰ (با صفحه‌ی کارنامه مجزا)');
            console.log('📚 تعداد واژگان:', VOCABULARY.length);

        })();
    </script>
