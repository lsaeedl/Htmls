<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>گردونه واژگان فارسی</title>

    <!-- ============================================================
    CSS – تمام استایل‌ها، انیمیشن‌ها و طراحی واکنش‌گرا
    ============================================================ -->
    <style>
        :root {
            --pink-primary: #FF85C2;
            --pink-light: #FFB3D9;
            --pink-dark: #E85A9E;
            --pink-pastel: #FFD6E7;
            --purple-pastel: #D4B8FF;
            --blue-pastel: #B8D4FF;
            --green-pastel: #B8FFD4;
            --yellow-pastel: #FFE5B8;
            --orange-pastel: #FFD4B8;
            --shadow-soft: 0 12px 40px rgba(255, 133, 194, 0.30);
            --shadow-glow: 0 0 40px rgba(255, 133, 194, 0.50);
            --radius-round: 40px;
            --radius-soft: 24px;
            --font-persian: 'Vazir', 'IRANSans', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-persian);
            background: linear-gradient(145deg, #FFF0F7 0%, #FFD9E8 100%);
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            direction: rtl;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background-image:
                radial-gradient(circle at 10% 20%, rgba(255, 215, 235, 0.5) 0%, transparent 50%),
                radial-gradient(circle at 90% 80%, rgba(180, 210, 255, 0.4) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(255, 230, 180, 0.3) 0%, transparent 70%);
        }

        .floating-decor {
            position: fixed;
            z-index: 0;
            pointer-events: none;
            font-size: 2.4rem;
            opacity: 0.40;
            animation: floatDecor 8s ease-in-out infinite alternate;
        }
        .floating-decor:nth-child(1) { top: 6%; right: 4%; animation-delay: 0s; }
        .floating-decor:nth-child(2) { top: 12%; left: 6%; animation-delay: 1.2s; font-size: 3rem; }
        .floating-decor:nth-child(3) { bottom: 18%; right: 8%; animation-delay: 2.4s; font-size: 2.8rem; }
        .floating-decor:nth-child(4) { bottom: 24%; left: 4%; animation-delay: 0.8s; font-size: 2.2rem; }
        .floating-decor:nth-child(5) { top: 45%; right: 2%; animation-delay: 3.2s; font-size: 1.8rem; }
        .floating-decor:nth-child(6) { top: 55%; left: 2%; animation-delay: 1.8s; font-size: 2.6rem; }

        @keyframes floatDecor {
            0% { transform: translateY(0px) rotate(0deg) scale(1); }
            100% { transform: translateY(-30px) rotate(12deg) scale(1.08); }
        }

        /* کانتینر اصلی بازی با مکانیزم Flexbox استاندارد پلتفرم */
        .game-wrapper {
            flex: 1 1 0;
            position: relative;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            z-index: 1;
        }

        .game-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 820px;
            height: 100%;
            max-height: 720px;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: var(--radius-round);
            padding: 20px 24px;
            box-shadow:
                0 20px 60px rgba(255, 133, 194, 0.25),
                inset 0 2px 0 rgba(255, 255, 255, 0.70);
            border: 1px solid rgba(255, 255, 255, 0.40);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px 12px;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 2px dashed rgba(255, 133, 194, 0.30);
        }

        .game-title {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--pink-dark);
            text-shadow: 0 3px 12px rgba(255, 133, 194, 0.30);
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .game-title span {
            font-size: 1.6rem;
        }
        .student-name-badge {
            font-size: 0.85rem;
            background: rgba(255, 255, 255, 0.60);
            padding: 4px 14px;
            border-radius: 40px;
            color: #6A2E5A;
            font-weight: 600;
            box-shadow: inset 0 1px 4px rgba(255, 255, 255, 0.80);
            margin-right: 6px;
        }

        .score-area {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .score-box {
            background: linear-gradient(135deg, #FFE5F0, #FFD0E4);
            padding: 6px 16px;
            border-radius: 60px;
            box-shadow: inset 0 2px 6px rgba(255, 255, 255, 0.60), 0 4px 16px rgba(255, 133, 194, 0.25);
            font-size: 1rem;
            font-weight: 700;
            color: #7A2E5A;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .sound-toggle {
            background: rgba(255, 255, 255, 0.70);
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(255, 133, 194, 0.20);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }
        .sound-toggle:hover {
            transform: scale(1.08);
        }

        .pencil-character {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 2px 0;
            min-height: 50px;
        }
        .pencil-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.50);
            padding: 4px 16px 4px 20px;
            border-radius: 60px;
            backdrop-filter: blur(4px);
            box-shadow: 0 4px 20px rgba(255, 133, 194, 0.15);
        }

        .pencil-icon {
            font-size: 2.2rem;
            line-height: 1;
            animation: pencilFloat 3s ease-in-out infinite;
        }
        .pencil-icon.happy { animation: pencilHappy 0.6s ease forwards; }
        .pencil-icon.sad { animation: pencilSad 0.6s ease forwards; }

        @keyframes pencilFloat {
            0%, 100% { transform: translateY(0) rotate(-2deg); }
            50% { transform: translateY(-5px) rotate(2deg); }
        }
        @keyframes pencilHappy {
            0% { transform: scale(1) rotate(0deg); }
            30% { transform: scale(1.2) rotate(-8deg); }
            60% { transform: scale(0.95) rotate(4deg); }
            100% { transform: scale(1) rotate(0deg); }
        }
        @keyframes pencilSad {
            0% { transform: translateX(0) rotate(0deg); }
            20% { transform: translateX(-8px) rotate(-6deg); }
            40% { transform: translateX(8px) rotate(6deg); }
            100% { transform: translateX(0) rotate(0deg); }
        }

        .pencil-message {
            font-size: 1rem;
            font-weight: 600;
            color: #6A2E5A;
            padding: 2px 10px;
            background: rgba(255, 255, 255, 0.60);
            border-radius: 30px;
            text-align: center;
        }
        .pencil-message.happy-msg { color: #2A7A4A; background: rgba(180, 255, 200, 0.50); }
        .pencil-message.sad-msg { color: #A04040; background: rgba(255, 200, 200, 0.50); }

        .wheel-section {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 4px 0;
        }

        .wheel-wrapper {
            position: relative;
            width: 220px;
            max-width: 100%;
            aspect-ratio: 1/1;
            margin: 0 auto;
        }

        #wheelCanvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
            border-radius: 50%;
            box-shadow:
                0 12px 48px rgba(255, 133, 194, 0.30),
                inset 0 -4px 20px rgba(255, 255, 255, 0.40),
                0 0 0 5px rgba(255, 255, 255, 0.50);
            cursor: pointer;
            touch-action: none;
        }

        .wheel-pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            font-size: 2.4rem;
            line-height: 1;
            filter: drop-shadow(0 4px 12px rgba(255, 80, 140, 0.50));
            pointer-events: none;
        }

        .question-area {
            margin: 8px 0;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.60);
            backdrop-filter: blur(8px);
            border-radius: var(--radius-soft);
            box-shadow: 0 8px 32px rgba(255, 133, 194, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.50);
            min-height: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .question-area.shake { animation: shakeCard 0.5s ease; }
        @keyframes shakeCard {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-12px); }
            40% { transform: translateX(12px); }
            60% { transform: translateX(-6px); }
            80% { transform: translateX(6px); }
        }

        .question-text {
            font-size: 1.2rem;
            font-weight: 700;
            color: #4A2A3A;
            text-align: center;
            margin-bottom: 10px;
            line-height: 1.4;
        }
        .question-text .highlight-word {
            color: var(--pink-dark);
            background: rgba(255, 133, 194, 0.15);
            padding: 0 8px;
            border-radius: 10px;
            font-size: 1.3rem;
        }

        .options-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            width: 100%;
        }

        .option-btn {
            flex: 1 1 calc(50% - 10px);
            min-width: 110px;
            padding: 10px 14px;
            border: none;
            border-radius: 60px;
            font-size: 1rem;
            font-weight: 700;
            color: #3A2A3A;
            background: linear-gradient(145deg, #FFFFFF, #FFF5F9);
            box-shadow: 0 4px 16px rgba(255, 133, 194, 0.20), inset 0 2px 0 #FFFFFF;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: var(--font-persian);
        }
        .option-btn:hover:not(:disabled) {
            transform: translateY(-2px);
        }
        .option-btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }
        .option-btn.correct-answer {
            background: linear-gradient(145deg, #90EE90, #66D866) !important;
            color: #1A4A1A;
        }
        .option-btn.wrong-answer {
            background: linear-gradient(145deg, #FF8A8A, #E06060) !important;
            color: #4A1A1A;
        }
        .option-btn.show-correct {
            background: linear-gradient(145deg, #90EE90, #66D866) !important;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 6px;
        }

        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 60px;
            font-size: 1rem;
            font-weight: 700;
            font-family: var(--font-persian);
            color: #FFFFFF;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 18px rgba(255, 133, 194, 0.30);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn:active:not(:disabled) { transform: scale(0.96); }
        .btn:disabled { opacity: 0.50; cursor: not-allowed; }

        .btn-primary { background: linear-gradient(145deg, #FF85C2, #E85A9E); }
        .btn-success { background: linear-gradient(145deg, #66D866, #44B844); }
        .btn-gold { background: linear-gradient(145deg, #FFD700, #F0B800); color: #4A3A00; }
        .btn-outline { background: rgba(255, 255, 255, 0.70); color: #6A2E5A; border: 2px solid rgba(255, 133, 194, 0.30); }

        /* کارنامه / مودال تمام‌صفحه پایان بازی */
        .result-overlay {
            position: fixed;
            inset: 0;
            z-index: 10001;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(16px);
            display: none;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .result-overlay.show { display: flex; }

        .result-card {
            background: linear-gradient(145deg, #FFFFFF, #FFF5F9);
            border-radius: var(--radius-round);
            padding: 30px 24px;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 30px 80px rgba(255, 133, 194, 0.30);
            border: 1px solid rgba(255, 255, 255, 0.60);
            text-align: center;
            position: relative;
        }
        .result-card .close-result {
            position: absolute;
            top: 14px;
            left: 18px;
            background: none;
            border: none;
            font-size: 1.6rem;
            cursor: pointer;
            color: #B08A9A;
        }
        .result-card .result-icon { font-size: 3rem; display: block; margin-bottom: 2px; }
        .result-card .result-title {
            font-size: 1.6rem; font-weight: 800; color: var(--pink-dark); margin-bottom: 4px; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .result-card .result-student {
            font-size: 1rem; background: rgba(255, 255, 255, 0.60); padding: 2px 16px; border-radius: 40px; color: #6A2E5A; font-weight: 600; display: inline-block; margin-bottom: 10px;
        }

        .result-card .result-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 12px 0 20px; }
        .result-card .result-item { background: rgba(255, 255, 255, 0.60); padding: 10px 6px; border-radius: var(--radius-soft); }
        .result-card .result-item .label { font-size: 0.75rem; color: #7A5A6A; font-weight: 500; }
        .result-card .result-item .value { font-size: 1.5rem; font-weight: 800; color: var(--pink-dark); }
        .result-card .result-item .value.green { color: #3A9A4A; }
        .result-card .result-item .value.red { color: #C05050; }
        
        .result-card .result-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }

        #confettiCanvas { position: fixed; inset: 0; z-index: 9999; pointer-events: none; width: 100vw; height: 100vh; display: none; }
        #confettiCanvas.active { display: block; }
    </style>
<style id="platform-local-font">
@font-face{font-family:'Vazirmatn';src:url('../assets/misc/vazirmatn-arabic.woff2') format('woff2');font-weight:400 900;font-style:normal;font-display:swap;}
</style>
</head>
<body>

    <!-- اسکریپت اصلی پلتفرم -->
    <script src="../assets/js/google-sync.js"></script>

    <!-- المان‌های تزئینی پس‌زمینه -->
    <div class="floating-decor" aria-hidden="true">☁️</div>
    <div class="floating-decor" aria-hidden="true">⭐</div>
    <div class="floating-decor" aria-hidden="true">🌸</div>
    <div class="floating-decor" aria-hidden="true">💖</div>
    <div class="floating-decor" aria-hidden="true">🌺</div>
    <div class="floating-decor" aria-hidden="true">✨</div>

    <!-- بوم کانفتی -->
    <canvas id="confettiCanvas"></canvas>

    <!-- کارنامه (مودال تمام‌صفحه) -->
    <div class="result-overlay" id="resultOverlay">
        <div class="result-card" id="resultCard">
            <button class="close-result" id="closeResult" aria-label="بستن کارنامه">✕</button>
            <span class="result-icon">🏆</span>
            <div class="result-title">
                کارنامهٔ بازی
            </div>
            <div class="result-student" id="resultStudentName"></div>

            <div class="result-grid" id="resultGrid">
                <div class="result-item">
                    <div class="label">✅ درست</div>
                    <div class="value green" id="rCorrect">۰</div>
                </div>
                <div class="result-item">
                    <div class="label">❌ اشتباه</div>
                    <div class="value red" id="rWrong">۰</div>
                </div>
                <div class="result-item">
                    <div class="label">⏱️ زمان</div>
                    <div class="value" id="rTime" style="font-size:1.1rem;color:#6A4A7A;">۰ ثانیه</div>
                </div>
            </div>

            <div class="result-actions">
                <button class="btn btn-primary" id="btnRestartFromResult">🔄 بازی دوباره</button>
                <button class="btn btn-gold" id="btnShareFromResult">📤 اشتراک‌گذاری</button>
                <button class="btn btn-outline" id="btnPrintResult">🖨️ چاپ</button>
            </div>
        </div>
    </div>

    <!-- هدر اجباری پلتفرم -->
    <header class="platform-header" style="flex: 0 0 auto; background: rgba(255, 255, 255, 0.9); display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; border-bottom: 2px solid white; z-index: 1000;">
        <div style="display: flex; align-items: center; gap: 10px;">
            <div style="font-weight: 900; color: #4a004e; font-size: clamp(12px, 3vw, 15px);">🏠 خانه / بازی‌ها / گردونه واژگان</div>
            <div id="platformTeacherUI" style="font-weight: 900; color: #ff007f; font-size: clamp(12px, 3vw, 15px); border-right: 2px solid #ccc; padding-right: 10px;">آموزگار: خانم دهگودی</div>
        </div>
        <a href="../index.html" style="text-decoration: none; background: #00f5d4; color: #111; padding: 6px 14px; border-radius: 15px; font-weight: 900; font-size: 13px;">→ بازگشت</a>
    </header>

    <!-- کانتینر اصلی بازی با ساختار flex: 1 1 0 برای جلوگیری از Overlap -->
    <main class="game-wrapper">
        <div class="game-container" role="main" aria-label="بازی گردونه واژگان فارسی">

            <!-- هدر داخلی بازی -->
            <div class="game-header">
                <div class="game-title">
                    <span>🎯</span> گردونه واژگان
                    <span class="student-name-badge" id="studentNameBadge"></span>
                </div>
                <div class="score-area">
                    <div class="score-box">⏱ <span id="gameTimer">۰:۰۰</span></div>
                    <div class="score-box">✅ <span id="headerCorrect">۰</span> | ❌ <span id="headerWrong">۰</span></div>
                    <button class="sound-toggle" id="soundToggle" aria-label="روشن/خاموش صدا" title="صدا">🔊</button>
                </div>
            </div>

            <!-- شخصیت مداد -->
            <div class="pencil-character">
                <div class="pencil-wrapper">
                    <div class="pencil-icon" id="pencilIcon">✏️</div>
                    <div class="pencil-message" id="pencilMessage">سلام! 😊</div>
                </div>
            </div>

            <!-- گردونه -->
            <section class="wheel-section">
                <div class="wheel-wrapper">
                    <canvas id="wheelCanvas" width="400" height="400"></canvas>
                    <div class="wheel-pointer" aria-hidden="true">▼</div>
                </div>
            </section>

            <!-- سؤال و گزینه‌ها -->
            <section class="question-area" id="questionArea">
                <div class="question-text" id="questionText">برای شروع بازی دکمه را بزن.</div>
                <div class="options-container" id="optionsContainer"></div>
            </section>

            <!-- دکمه‌های کنترل -->
            <div class="controls" id="controlsContainer">
                <button class="btn btn-primary" id="btnStart" aria-label="شروع بازی">🚀 شروع بازی</button>
                <button class="btn btn-success" id="btnSpin" disabled aria-label="چرخاندن گردونه">🔄 چرخاندن گردونه</button>
            </div>

            <div style="text-align:center;font-size:0.85rem;color:#8A6A7A;font-weight:500;" id="statusMessage">
                ✨ برای شروع آماده‌ای؟
            </div>
        </div>
    </main>

    <!-- فوتر اجباری پلتفرم -->
    <footer class="platform-footer" style="flex: 0 0 auto; background: rgba(255, 255, 255, 0.9); text-align: center; padding: 10px; font-weight: 900; color: #4a004e; font-size: 13px; z-index: 1000; border-top: 2px solid white;">طراحی و پیاده‌سازی: سعید سراوانی</footer>

    <!-- جاوااسکریپت منطق پلتفرم و بازی -->
    <script>
        const GAME_ID = 1;
        let platformStudent = null;
        let platformSaved = false;
        let platformTeacherName = 'خانم دهگودی';
        let startedAt = 0;
        let timerSeconds = 180;

        (async function initPlatform(){
            try {
                if (typeof getCurrentStudent === 'function') {
                    platformStudent = getCurrentStudent();
                } else {
                    platformStudent = { fullName: "دانش‌آموز تستی", studentCode: "test-123" };
                }
                
                if (!platformStudent) { window.location.href = '../index.html'; return; }
                document.documentElement.style.visibility = 'hidden';

                if (typeof syncCheckAttempts === 'function') {
                    const attemptCheck = await syncCheckAttempts(platformStudent.studentCode, GAME_ID);
                    if (!attemptCheck.success) {
                        document.documentElement.style.visibility = 'visible';
                        document.body.innerHTML = '<main style="display:flex;height:100dvh;align-items:center;justify-content:center;text-align:center;padding:24px;background:#fff;color:#333;"><h2>' + (attemptCheck.error || 'امکان شرکت در این بازی وجود ندارد.') + '</h2></main>';
                        return;
                    }
                }
                
                if (typeof syncGetGameSettings === 'function') {
                    const settings = await syncGetGameSettings(GAME_ID);
                    timerSeconds = settings.timerSeconds || 180;
                }

                if (typeof syncListClasses === 'function' && platformStudent.className) {
                    try {
                        const classesResult = await syncListClasses();
                        if (classesResult && classesResult.success) {
                            const match = classesResult.classes.find(c => c.className === platformStudent.className);
                            if (match && match.teacherName) platformTeacherName = match.teacherName;
                        }
                    } catch(e) {}
                } else if (platformStudent.teacherName) {
                    platformTeacherName = platformStudent.teacherName;
                }

                const teacherUI = document.getElementById("platformTeacherUI");
                if(teacherUI) teacherUI.textContent = 'آموزگار: ' + platformTeacherName;
                
                document.documentElement.style.visibility = 'visible';
            } catch (error) {
                document.documentElement.style.visibility = 'visible';
            }
        })();

        async function saveGameResultFinal(corrects, wrongs) {
            if (!platformSaved && platformStudent && typeof syncSaveResult === 'function') {
                platformSaved = true;
                const duration = Math.round((Date.now() - startedAt) / 1000);
                await syncSaveResult(platformStudent.studentCode, GAME_ID, corrects, wrongs, duration);
            }
        }

        (function() {
            'use strict';

            const VOCABULARY = [
                { word: 'شاد', meaning: 'خوشحال' }, { word: 'ناراحت', meaning: 'غمگین' },
                { word: 'آموزگار', meaning: 'معلم' }, { word: 'ویژه', meaning: 'مخصوص' },
                { word: 'پیشنهاد', meaning: 'نظر' }, { word: 'سپاسگزاری', meaning: 'تشکر' },
                { word: 'آغاز', meaning: 'شروع' }, { word: 'اکنون', meaning: 'حالا' },
                { word: 'امام جماعت', meaning: 'پیشنماز' }, { word: 'کمک', meaning: 'یاری' },
                { word: 'موفق', meaning: 'پیروز' }, { word: 'پاکیزه', meaning: 'تمیز' },
                { word: 'کثیف', meaning: 'ناپاک' }, { word: 'آهسته', meaning: 'کند' },
                { word: 'مواظبت', meaning: 'مراقبت' }, { word: 'کوشش', meaning: 'تلاش' },
                { word: 'پاسخ', meaning: 'جواب' }, { word: 'خیلی', meaning: 'بسیار' }
            ];

            const PASTEL_COLORS = [
                '#FFB5C2', '#FFD4A8', '#FFE5A0', '#C8E6A0', '#A8D8B8',
                '#A8D0E6', '#B8C8F0', '#D4B8F0', '#F0B8D4', '#F0C8C8',
                '#F0D8B8', '#E0E0C8'
            ];

            const canvas = document.getElementById('wheelCanvas');
            const ctx = canvas.getContext('2d');
            const questionText = document.getElementById('questionText');
            const optionsContainer = document.getElementById('optionsContainer');
            const pencilIcon = document.getElementById('pencilIcon');
            const pencilMessage = document.getElementById('pencilMessage');
            const questionArea = document.getElementById('questionArea');
            const statusMsg = document.getElementById('statusMessage');
            const studentNameBadge = document.getElementById('studentNameBadge');

            const btnStart = document.getElementById('btnStart');
            const btnSpin = document.getElementById('btnSpin');
            const soundToggle = document.getElementById('soundToggle');

            const resultOverlay = document.getElementById('resultOverlay');
            const resultStudentName = document.getElementById('resultStudentName');
            const rCorrect = document.getElementById('rCorrect');
            const rWrong = document.getElementById('rWrong');
            const rTime = document.getElementById('rTime');
            const gameTimer = document.getElementById('gameTimer');
            const headerCorrect = document.getElementById('headerCorrect');
            const headerWrong = document.getElementById('headerWrong');
            let timerInterval = null;
            let timeLeft = 0;
            const btnRestartFromResult = document.getElementById('btnRestartFromResult');
            const btnShareFromResult = document.getElementById('btnShareFromResult');
            const btnPrintResult = document.getElementById('btnPrintResult');
            const closeResult = document.getElementById('closeResult');

            const confettiCanvas = document.getElementById('confettiCanvas');
            const confettiCtx = confettiCanvas.getContext('2d');

            const state = {
                gameWords: [], usedWords: [], correctWords: [], wrongWords: [], currentWord: null,
                correctCount: 0, wrongCount: 0, isPlaying: false, isSpinning: false, isAnswering: false,
                gameOver: false, soundEnabled: true, selectedIndex: -1, rotation: 0,
                remainingWords: 0, gameStarted: false
            };

            // مدیریت ایمن AudioContext مطابق دستورالعمل
            let audioCtx = null;
            function initAudio() {
                if (!audioCtx) audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
            }

            function playTone(freq, duration, type, volume) {
                if (!state.soundEnabled) return;
                try {
                    initAudio();
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = type || 'sine';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                    gain.gain.setValueAtTime((volume || 0.25), audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(audioCtx.currentTime);
                    osc.stop(audioCtx.currentTime + duration);
                } catch (_) { }
            }

            function playSound(soundId) {
                if (!state.soundEnabled) return;
                try {
                    switch (soundId) {
                        case 'start': playTone(523, 0.12, 'sine', 0.20); setTimeout(() => playTone(659, 0.12, 'sine', 0.20), 130); setTimeout(() => playTone(784, 0.18, 'sine', 0.22), 260); break;
                        case 'spin': for(let i=0;i<6;i++) setTimeout(()=>playTone(300+i*80,0.06,'sawtooth',0.08), i*70); break;
                        case 'tick': playTone(1200, 0.06, 'sine', 0.12); setTimeout(() => playTone(1400, 0.06, 'sine', 0.10), 80); break;
                        case 'success': playTone(523, 0.10, 'sine', 0.18); setTimeout(() => playTone(659, 0.10, 'sine', 0.18), 120); setTimeout(() => playTone(784, 0.14, 'sine', 0.20), 240); setTimeout(() => playTone(1047, 0.20, 'sine', 0.22), 400); break;
                        case 'wrong': playTone(400, 0.20, 'sawtooth', 0.12); setTimeout(() => playTone(300, 0.25, 'sawtooth', 0.10), 180); break;
                        case 'gameover': playTone(523, 0.10, 'sine', 0.18); setTimeout(() => playTone(659, 0.10, 'sine', 0.18), 130); setTimeout(() => playTone(784, 0.10, 'sine', 0.18), 260); setTimeout(() => playTone(1047, 0.10, 'sine', 0.20), 390); setTimeout(() => playTone(1319, 0.25, 'sine', 0.24), 520); break;
                    }
                } catch (_) { }
            }

            function shuffleArray(arr) {
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                return arr;
            }
            function pickRandom(arr, count) {
                const shuffled = shuffleArray([...arr]);
                return shuffled.slice(0, count);
            }
            function getRandomWrongMeaning(correctMeaning, excludeWord) {
                const others = VOCABULARY.filter(v => v.meaning !== correctMeaning && v.word !== excludeWord);
                if (others.length === 0) return 'معنی دیگر';
                return others[Math.floor(Math.random() * others.length)].meaning;
            }
            function formatTime(seconds) {
                const m = Math.floor(seconds / 60);
                const s = Math.floor(seconds % 60);
                return m > 0 ? `${m} دقیقه و ${s} ثانیه` : `${s} ثانیه`;
            }

            function drawWheel(rotation) {
                const w = canvas.width, h = canvas.height, cx = w / 2, cy = h / 2, radius = Math.min(w, h) * 0.44;
                ctx.clearRect(0, 0, w, h);

                if (state.gameWords.length === 0) {
                    ctx.fillStyle = '#FFD0E4'; ctx.beginPath(); ctx.arc(cx, cy, radius, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = '#8A5A7A'; ctx.font = 'bold 16px Vazir, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText('🎯 واژه‌ای نیست', cx, cy);
                    return;
                }

                const n = state.gameWords.length, angleStep = (Math.PI * 2) / n;
                for (let i = 0; i < n; i++) {
                    const startAngle = rotation + i * angleStep, endAngle = startAngle + angleStep;
                    const color = PASTEL_COLORS[i % PASTEL_COLORS.length];
                    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, radius, startAngle, endAngle); ctx.closePath();
                    ctx.fillStyle = color; ctx.fill();
                    ctx.strokeStyle = 'rgba(255,255,255,0.60)'; ctx.lineWidth = 2; ctx.stroke();

                    const midAngle = startAngle + angleStep / 2, textRadius = radius * 0.60;
                    const x = cx + textRadius * Math.cos(midAngle), y = cy + textRadius * Math.sin(midAngle);
                    const word = state.gameWords[i].word;
                    
                    ctx.save(); ctx.translate(x, y); ctx.rotate(midAngle + (midAngle > Math.PI / 2 ? Math.PI : 0));
                    ctx.fillStyle = '#4A2A3A'; ctx.font = 'bold 12px Vazir, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText(word, 0, 0); ctx.restore();
                }

                ctx.beginPath(); ctx.arc(cx, cy, radius * 0.15, 0, Math.PI * 2); ctx.fillStyle = '#FFFFFF'; ctx.fill();
                ctx.strokeStyle = '#FF85C2'; ctx.lineWidth = 3; ctx.stroke();
            }

            function getSelectedIndex(rotation) {
                const n = state.gameWords.length;
                if (n === 0) return -1;
                const angleStep = (Math.PI * 2) / n, pointerAngle = -Math.PI / 2;
                let rawAngle = (pointerAngle - rotation) % (Math.PI * 2);
                if (rawAngle < 0) rawAngle += Math.PI * 2;
                return Math.min(Math.floor(rawAngle / angleStep), n - 1);
            }

            function spinWheel() {
                if (state.isSpinning || state.isAnswering || state.gameOver) return;
                if (state.gameWords.length === 0) { setStatus('🎯 همه واژه‌ها تمام شد!', ''); return; }
                if (!state.gameStarted) { setStatus('⏳ ابتدا «شروع بازی» را بزن.', ''); return; }

                initAudio();
                state.isSpinning = true; btnSpin.disabled = true; playSound('spin');
                const extraSpins = 3 + Math.random() * 3, targetRotation = state.rotation + (Math.PI * 2 * extraSpins) + (Math.random() * Math.PI * 2), startRotation = state.rotation, duration = 2500, startTime = performance.now();

                function animateSpin(now) {
                    const elapsed = now - startTime, progress = Math.min(elapsed / duration, 1), eased = 1 - Math.pow(1 - progress, 3);
                    state.rotation = startRotation + (targetRotation - startRotation) * eased;
                    drawWheel(state.rotation);

                    if (progress < 1) requestAnimationFrame(animateSpin);
                    else {
                        state.rotation = targetRotation; drawWheel(state.rotation); state.isSpinning = false; playSound('tick');
                        const idx = getSelectedIndex(state.rotation);
                        if (idx >= 0 && idx < state.gameWords.length) {
                            state.selectedIndex = idx; state.currentWord = state.gameWords[idx]; state.gameWords.splice(idx, 1);
                            state.usedWords.push(state.currentWord); state.remainingWords = state.gameWords.length;
                            showQuestion(state.currentWord); playSound('success'); setPencilHappy(); setPencilMessage('واژه انتخاب شد! ✨');
                        } else {
                            btnSpin.disabled = false; state.isSpinning = false;
                        }
                    }
                }
                requestAnimationFrame(animateSpin);
            }

            function showQuestion(wordObj) {
                state.isAnswering = true;
                const options = [{ text: wordObj.meaning, correct: true }, { text: getRandomWrongMeaning(wordObj.meaning, wordObj.word), correct: false }];
                shuffleArray(options);
                questionText.innerHTML = `معنی کلمهٔ <span class="highlight-word">«${wordObj.word}»</span> چیست؟`;
                optionsContainer.innerHTML = '';
                options.forEach((opt) => {
                    const btn = document.createElement('button'); btn.className = 'option-btn'; btn.textContent = opt.text; btn.dataset.correct = opt.correct ? 'true' : 'false';
                    btn.addEventListener('click', () => handleAnswer(btn, wordObj, opt.correct));
                    optionsContainer.appendChild(btn);
                });
                setStatus(`🔍 ${state.remainingWords} واژهٔ باقی‌مانده`, ''); btnSpin.disabled = true;
            }

            function handleAnswer(btn, wordObj, isCorrect) {
                if (!state.isAnswering) return;
                state.isAnswering = false;
                const allBtns = optionsContainer.querySelectorAll('.option-btn'); allBtns.forEach(b => b.disabled = true);

                if (isCorrect) {
                    btn.classList.add('correct-answer'); state.correctCount++; state.correctWords.push(wordObj); playSound('success'); setPencilHappy(); setPencilMessage('آفرین! 👏');
                    questionText.innerHTML = '✅ <span style="color:#2A7A4A;">آفرین! پاسخ درست بود.</span>'; setStatus('🌟 عالی!', 'happy'); updateCounts(); launchConfetti();
                    allBtns.forEach(b => { if (b.dataset.correct === 'true') b.classList.add('show-correct'); });
                } else {
                    btn.classList.add('wrong-answer'); state.wrongCount++; state.wrongWords.push(wordObj); playSound('wrong'); setPencilSad(); setPencilMessage('اشکالی ندارد! 💪');
                    questionText.innerHTML = `❌ <span style="color:#A04040;">پاسخ صحیح: <strong>«${wordObj.meaning}»</strong></span>`;
                    setStatus('😅 پاسخ اشتباه بود.', 'sad'); updateCounts(); questionArea.classList.remove('shake'); void questionArea.offsetWidth; questionArea.classList.add('shake');
                    allBtns.forEach(b => { if (b.dataset.correct === 'true') b.classList.add('show-correct'); });
                }

                setTimeout(() => {
                    questionArea.classList.remove('shake');
                    if (state.gameWords.length === 0) endGame();
                    else {
                        state.isAnswering = false; btnSpin.disabled = false; questionText.innerHTML = '🔄 گردونه را بچرخان!';
                        optionsContainer.innerHTML = ''; setStatus(`🎯 ${state.gameWords.length} واژه باقی‌مانده`, '');
                    }
                }, 1200);
            }

            async function endGame() {
                state.gameOver = true; state.isPlaying = false; state.isAnswering = false; btnSpin.disabled = true;
                playSound('gameover'); setPencilHappy(); setPencilMessage('🎉 بازی تمام شد!');

                const elapsed = (Date.now() - startedAt) / 1000;
                rCorrect.textContent = state.correctCount;
                rWrong.textContent = state.wrongCount;
                rTime.textContent = formatTime(elapsed);

                // ثبت نتیجه از طریق تابع استاندارد پلتفرم (فقط یک‌بار)
                await saveGameResultFinal(state.correctCount, state.wrongCount);

                const studentFullName = (platformStudent && platformStudent.fullName) ? platformStudent.fullName : "دانش‌آموز";
                resultStudentName.textContent = `🧑‍🎓 ${studentFullName}`;
                resultOverlay.classList.add('show'); 
                questionText.innerHTML = '🎊 کارنامهٔ شما آماده است!'; 
                optionsContainer.innerHTML = '';
                launchConfetti();
            }

            function startGame() {
                initAudio();
                startedAt = Date.now();
                
                const selected = pickRandom(VOCABULARY, 8);
                state.gameWords = selected.map(v => ({ ...v })); 
                state.usedWords = []; state.correctWords = []; state.wrongWords = []; state.currentWord = null;
                state.correctCount = 0; state.wrongCount = 0; state.gameOver = false; state.isPlaying = true; state.isAnswering = false; state.isSpinning = false;
                state.gameStarted = true; state.remainingWords = state.gameWords.length; state.rotation = 0;
                
                updateCounts(); resultOverlay.classList.remove('show');
                btnSpin.disabled = false; btnStart.disabled = true; questionArea.classList.remove('shake'); drawWheel(0);
                
                const studentFullName = (platformStudent && platformStudent.fullName) ? platformStudent.fullName : "دانش‌آموز";
                setPencilHappy(); setPencilMessage(`سلام ${studentFullName}! 🚀`); 
                setStatus(`🎯 ${state.gameWords.length} واژه در گردونه`, '');
                questionText.innerHTML = '🌀 گردونه را بچرخان!'; optionsContainer.innerHTML = ''; playSound('start');
                studentNameBadge.textContent = studentFullName;
            }

            function restartGame() {
                window.location.href = '../index.html';
            }

            function updateCounts() { headerCorrect.textContent = state.correctCount; headerWrong.textContent = state.wrongCount; }
            
            function startTimer() {
                clearInterval(timerInterval);
                timeLeft = timerSeconds;
                updateTimer();
                timerInterval = setInterval(() => {
                    timeLeft--; updateTimer();
                    if (timeLeft <= 0) { clearInterval(timerInterval); state.isPlaying = false; btnSpin.disabled = true; endGame(); }
                }, 1000);
            }
            
            function updateTimer() {
                const minutes = Math.floor(timeLeft / 60), seconds = String(timeLeft % 60).padStart(2, '0');
                gameTimer.textContent = `${minutes}:${seconds}`;
            }

            function setPencilHappy() { pencilIcon.classList.remove('sad'); pencilIcon.classList.add('happy'); setTimeout(() => pencilIcon.classList.remove('happy'), 700); }
            function setPencilSad() { pencilIcon.classList.remove('happy'); pencilIcon.classList.add('sad'); setTimeout(() => pencilIcon.classList.remove('sad'), 700); }
            function setPencilMessage(msg) { pencilMessage.textContent = msg; }
            function setStatus(msg) { statusMsg.textContent = msg; }

            let confettiPieces = [], confettiAnimId = null;
            function launchConfetti() {
                const canvas = confettiCanvas, ctx = confettiCtx; canvas.width = window.innerWidth; canvas.height = window.innerHeight; canvas.classList.add('active');
                const colors = ['#FF85C2', '#FFD700', '#FF6B6B', '#4ECDC4', '#FFE66D'], pieces = [];
                for (let i = 0; i < 80; i++) pieces.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height * 0.3 - 20, w: 6 + Math.random() * 8, h: 4 + Math.random() * 6, color: colors[Math.floor(Math.random() * colors.length)], vx: (Math.random() - 0.5) * 6, vy: 2 + Math.random() * 4, rot: Math.random() * 360, rotSpeed: (Math.random() - 0.5) * 10, life: 1, decay: 0.005 });
                confettiPieces = pieces; if (confettiAnimId) cancelAnimationFrame(confettiAnimId);
                function animateConfetti() {
                    ctx.clearRect(0, 0, canvas.width, canvas.height); let alive = false;
                    confettiPieces.forEach(p => {
                        p.x += p.vx; p.y += p.vy; p.vy += 0.08; p.rot += p.rotSpeed; p.life -= p.decay;
                        if (p.life > 0) {
                            alive = true; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate((p.rot * Math.PI) / 180); ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
                            ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
                        }
                    });
                    if (alive) confettiAnimId = requestAnimationFrame(animateConfetti);
                    else { ctx.clearRect(0, 0, canvas.width, canvas.height); canvas.classList.remove('active'); confettiAnimId = null; }
                }
                animateConfetti();
            }

            function shareResult() {
                const elapsed = (Date.now() - startedAt) / 1000;
                const name = (platformStudent && platformStudent.fullName) ? platformStudent.fullName : 'دانش‌آموز';
                const text = `🧑‍🎓 ${name} در بازی «گردونه واژگان فارسی» موفق شد.\n✅ درست: ${state.correctCount}\n❌ اشتباه: ${state.wrongCount}\n⏱️ زمان: ${formatTime(elapsed)}`;
                if (navigator.share) navigator.share({ title: 'کارنامه بازی', text: text }).catch(() => {});
            }
            function printResult() { window.print(); }

            btnStart.addEventListener('click', () => {
                startGame();
                startTimer();
            });
            btnSpin.addEventListener('click', spinWheel);
            btnRestartFromResult.addEventListener('click', restartGame);
            btnShareFromResult.addEventListener('click', shareResult);
            btnPrintResult.addEventListener('click', printResult);
            closeResult.addEventListener('click', () => resultOverlay.classList.remove('show'));
            soundToggle.addEventListener('click', function() { state.soundEnabled = !state.soundEnabled; this.textContent = state.soundEnabled ? '🔊' : '🔇'; });
            canvas.addEventListener('click', () => { if (!btnSpin.disabled && state.gameStarted && !state.isSpinning && !state.isAnswering) spinWheel(); });

            function init() {
                confettiCanvas.width = window.innerWidth; confettiCanvas.height = window.innerHeight;
                drawWheel(0);
                if (platformStudent && platformStudent.fullName) {
                    studentNameBadge.textContent = platformStudent.fullName;
                }
                btnSpin.disabled = true; btnStart.disabled = false;
            }

            init();

        })();
    </script>
