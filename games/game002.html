<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>بازی گردونه واژگان فارسی</title>
    <style>
        @font-face {
            font-family: 'Vazir';
            src: local('Vazir'), local('Tahoma');
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
            font-family: 'Vazir', Tahoma, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100dvh;
            overflow: hidden;
            background-color: #050515;
            color: #fff;
            display: flex;
            flex-direction: column;
        }

        /* پس‌زمینه کهکشانی متحرک */
        #space-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* ساختار کلی صفحات داخل کانتینر اصلی */
        .game-wrapper {
            flex: 1 1 0;
            position: relative;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            z-index: 2;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .screen.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* استایل‌های صفحه خوش‌آمدگویی */
        .welcome-title {
            font-size: 2.2rem;
            text-align: center;
            color: #00f2fe;
            text-shadow: 0 0 15px rgba(0, 242, 254, 0.6);
            margin-bottom: 20px;
            font-weight: bold;
        }

        .space-avatar {
            width: 130px;
            height: 130px;
            background: linear-gradient(135deg, #7f00ff, #e100ff);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            margin-bottom: 30px;
            box-shadow: 0 0 25px rgba(225, 0, 255, 0.5);
            animation: float 3s ease-in-out infinite;
        }

        .btn {
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 242, 254, 0.4);
            transition: all 0.3s;
            min-width: 200px;
        }

        .btn:disabled {
            background: #444;
            box-shadow: none;
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn:active:not(:disabled) {
            transform: scale(0.95);
        }

        /* کنترل صدا */
        .audio-control {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
            z-index: 1005;
        }

        /* هدر اطلاعات بازی */
        .game-header {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 20px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 15px;
            font-size: 0.9rem;
        }

        .student-name { color: #00f2fe; font-weight: bold; }
        .score-val { color: #ff007f; font-weight: bold; }
        .stats-val { color: #00ff88; font-weight: bold; }

        /* بخش گردونه */
        .wheel-container {
            position: relative;
            width: 250px;
            height: 250px;
            margin: 15px 0;
        }

        .wheel-pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid #ff007f;
            z-index: 5;
            filter: drop-shadow(0 0 8px #ff007f);
        }

        #wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 6px solid #4facfe;
            box-shadow: 0 0 30px rgba(79, 172, 254, 0.6), inset 0 0 20px rgba(0,0,0,0.8);
            position: relative;
            overflow: hidden;
            transition: transform 4s cubic-bezier(0.1, 0.8, 0.1, 1);
        }

        .wheel-center-pin {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            background: radial-gradient(circle, #fff, #7f00ff);
            border-radius: 50%;
            z-index: 4;
            box-shadow: 0 0 15px #fff;
        }

        /* بخش پاسخ و عملیات */
        .action-area {
            width: 100%;
            max-width: 340px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 140px;
            justify-content: center;
        }

        .current-word-display {
            font-size: 1.8rem;
            color: #fff;
            text-shadow: 0 0 10px #7f00ff;
            margin-bottom: 15px;
            font-weight: bold;
            display: none;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border-radius: 25px;
            border: 2px solid #7f00ff;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 1.1rem;
            text-align: center;
            outline: none;
            transition: all 0.3s;
        }

        input[type="text"]:focus {
            border-color: #00f2fe;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
            background: rgba(255, 255, 255, 0.15);
        }

        .feedback-box {
            text-align: center;
            font-size: 1.1rem;
            margin: 10px 0;
            min-height: 27px;
            font-weight: bold;
        }

        /* کارت نهایی پایان بازی */
        .end-card {
            background: rgba(15, 15, 40, 0.85);
            border: 2px solid #00f2fe;
            padding: 30px;
            border-radius: 25px;
            text-align: center;
            max-width: 360px;
            width: 100%;
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.3);
        }

        .end-card h2 {
            color: #00ff88;
            margin-bottom: 20px;
            font-size: 1.8rem;
        }

        .final-stat {
            font-size: 1.1rem;
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 5px;
        }

        .sparkle {
            position: absolute;
            pointer-events: none;
            background: white;
            border-radius: 50%;
            animation: explode 0.6s ease-out forwards;
        }

        @keyframes explode {
            0% { transform: translate(0,0) scale(1); opacity: 1; }
            100% { transform: translate(var(--x), var(--y)) scale(0); opacity: 0; }
        }
    </style>
<style id="platform-local-font">
@font-face{font-family:'Vazirmatn';src:url('../assets/misc/vazirmatn-arabic.woff2') format('woff2');font-weight:400 900;font-style:normal;font-display:swap;}
</style>
</head>
<body>

    <script src="../assets/js/google-sync.js"></script>

    <canvas id="space-bg"></canvas>

    <!-- هدر پلتفرم -->
    <header class="platform-header" style="flex: 0 0 auto; background: rgba(255, 255, 255, 0.9); display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; border-bottom: 2px solid white; z-index: 1000;">
        <div style="display: flex; align-items: center; gap: 10px;">
            <div style="font-weight: 900; color: #4a004e; font-size: clamp(12px, 3vw, 15px);">🏠 خانه / بازی‌ها / گردونه واژگان</div>
            <div id="platformTeacherUI" style="font-weight: 900; color: #ff007f; font-size: clamp(12px, 3vw, 15px); border-right: 2px solid #ccc; padding-right: 10px;">آموزگار: خانم دهگودی</div>
        </div>
        <a href="../index.html" style="text-decoration: none; background: #00f5d4; color: #111; padding: 6px 14px; border-radius: 15px; font-weight: 900; font-size: 13px;">→ بازگشت</a>
    </header>

    <button class="audio-control" id="audio-toggle" onclick="toggleMute()">🔊</button>

    <main class="game-wrapper">
        <div class="screen active" id="welcome-screen">
            <h1 class="welcome-title">بازی گردونه واژگان فارسی</h1>
            <div class="space-avatar">🚀</div>
            <p style="margin-bottom: 20px;">آماده‌ای واژه‌ها را پیدا کنی؟</p>
            <button class="btn" id="start-game-btn" onclick="startGame()">شروع بازی</button>
        </div>

        <div class="screen" id="game-screen">
            <div class="game-header">
                <div>دانش‌آموز: <span class="student-name" id="header-name">-</span></div>
                <div>⏱ زمان: <span class="stats-val" id="header-timer">۰:۰۰</span></div>
                <div>صحیح: <span class="stats-val" id="header-correct">0</span> / غلط: <span class="score-val" id="header-wrong">0</span></div>
            </div>

            <div class="wheel-container">
                <div class="wheel-pointer"></div>
                <div class="wheel-center-pin"></div>
                <canvas id="wheel"></canvas>
            </div>

            <div class="action-area">
                <div class="current-word-display" id="word-display">واژه</div>
                
                <div id="answer-form-container" style="display: none; width: 100%;">
                    <input type="text" id="answer-input" placeholder="معنی این کلمه چیست؟" autocomplete="off">
                    <button class="btn" id="submit-answer-btn" style="margin-top: 10px; width: 100%;" onclick="checkAnswer()">ثبت پاسخ</button>
                </div>

                <button class="btn" id="spin-btn" onclick="spinWheel()">چرخش گردونه</button>
                
                <button class="btn" id="next-btn" style="display: none;" onclick="prepareNextTurn()">مرحله بعد 🌟</button>

                <div class="feedback-box" id="feedback-text"></div>
            </div>
        </div>

        <div class="screen" id="end-screen">
            <div class="end-card">
                <h2 id="end-title">تبریک!</h2>
                <p style="margin-bottom: 20px; color: #aaa;" id="end-subtitle">شما همه واژگان را کامل کردید.</p>
                
                <div class="final-stat"><span>دانش‌آموز:</span> <span id="end-name" style="color:#00f2fe"></span></div>
                <div class="final-stat"><span>پاسخ‌های صحیح:</span> <span id="end-correct" style="color:#00ff88"></span></div>
                <div class="final-stat"><span>پاسخ‌های غلط:</span> <span id="end-wrong" style="color:#ff2a2a"></span></div>
                
                <button class="btn" style="margin-top: 25px; width: 100%;" onclick="resetGameToWelcome()">بازگشت به خانه</button>
            </div>
        </div>
    </main>

    <!-- فوتر پلتفرم -->
    <footer class="platform-footer" style="flex: 0 0 auto; background: rgba(5, 5, 21, 0.9); text-align: center; padding: 10px; font-weight: 900; color: #fff; font-size: 13px; z-index: 1000; border-top: 1px solid rgba(255,255,255,0.1);">طراحی و پیاده‌سازی: سعید سراوانی</footer>

    <script>
        const GAME_ID = 2;
        let globalStudent = null;
        let dynamicTimerSeconds = 180;
        let startedAt = null;
        let platformSaved = false;
        let platformTeacherName = 'خانم دهگودی';

        (async function initPlatform() {
            try {
                if (typeof getCurrentStudent === 'function') {
                    globalStudent = getCurrentStudent();
                } else {
                    globalStudent = { fullName: "دانش‌آموز تستی", studentCode: "test-123" };
                }

                if (!globalStudent) {
                    window.location.href = '../index.html';
                    return;
                }
                document.documentElement.style.visibility = 'hidden';

                if (typeof syncCheckAttempts === 'function') {
                    const attemptCheck = await syncCheckAttempts(globalStudent.studentCode, GAME_ID);
                    if (!attemptCheck.success) {
                        document.documentElement.style.visibility = 'visible';
                        document.body.innerHTML = '<main style="display:flex;height:100dvh;align-items:center;justify-content:center;text-align:center;padding:24px;background:#050515;color:#fff;"><h2>' + (attemptCheck.error || 'امکان شرکت در این بازی وجود ندارد.') + '</h2></main>';
                        return;
                    }
                }

                if (typeof syncGetGameSettings === 'function') {
                    const settings = await syncGetGameSettings(GAME_ID);
                    dynamicTimerSeconds = settings.timerSeconds || 180;
                }

                if (typeof syncListClasses === 'function' && globalStudent.className) {
                    try {
                        const classesResult = await syncListClasses();
                        if (classesResult && classesResult.success) {
                            const match = classesResult.classes.find(c => c.className === globalStudent.className);
                            if (match && match.teacherName) platformTeacherName = match.teacherName;
                        }
                    } catch(e) {}
                } else if (globalStudent.teacherName) {
                    platformTeacherName = globalStudent.teacherName;
                }

                const teacherUI = document.getElementById("platformTeacherUI");
                if(teacherUI) teacherUI.textContent = 'آموزگار: ' + platformTeacherName;

                document.documentElement.style.visibility = 'visible';
            } catch (error) {
                document.documentElement.style.visibility = 'visible';
            }
        })();

        async function saveGameResultFinal(corrects, wrongs) {
            if (!platformSaved && globalStudent && typeof syncSaveResult === 'function') {
                platformSaved = true;
                const duration = Math.round((Date.now() - startedAt) / 1000);
                await syncSaveResult(globalStudent.studentCode, GAME_ID, corrects, wrongs, duration);
            }
        }

        const vocabulary = [
            { word: "گفت و گو", meaning: "مشورت" },
            { word: "پیشنهاد", meaning: "نظر" },
            { word: "ویژه", meaning: "مخصوص" },
            { word: "غافل", meaning: "بی خبر" },
            { word: "اکنون", meaning: "حالا" },
            { word: "مفید", meaning: "سودمند" },
            { word: "زیان", meaning: "ضرر" },
            { word: "پرسش", meaning: "سوال" },
            { word: "آرام", meaning: "آهسته" },
            { word: "آموزگار", meaning: "معلم" }
        ];

        const positiveFeedbacks = ["آفرین!", "عالی بود!", "فوق‌العاده!", "احسنت!", "خیلی خوب!", "ستاره گرفتی!"];

        let studentName = "";
        let correctCount = 0;
        let wrongCount = 0;
        let remainingWords = [...vocabulary];
        let currentSelectedPair = null;
        let isMuted = false;
        let currentRotation = 0;
        let timerInterval = null;
        let timeLeft = 0;

        let audioCtx = null;
        let bgOscillator = null;
        let bgGain = null;

        function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            startSpaceMusic();
        }

        function startSpaceMusic() {
            try {
                bgOscillator = audioCtx.createOscillator();
                bgGain = audioCtx.createGain();
                
                bgOscillator.type = 'sine';
                bgOscillator.frequency.setValueAtTime(120, audioCtx.currentTime);
                
                bgGain.gain.setValueAtTime(isMuted ? 0 : 0.04, audioCtx.currentTime);
                bgOscillator.connect(bgGain);
                bgGain.connect(audioCtx.destination);
                bgOscillator.start();
            } catch(e) {}
        }

        function playSoundEffect(type) {
            if (isMuted || !audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'click') {
                osc.frequency.setValueAtTime(600, now);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'spin') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(400, now + 0.3);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'success') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.setValueAtTime(600, now + 0.1);
                osc.frequency.setValueAtTime(900, now + 0.2);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now); osc.stop(now + 0.4);
            } else if (type === 'error') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.linearRampToValueAtTime(90, now + 0.3);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            }
        }

        function toggleMute() {
            isMuted = !isMuted;
            document.getElementById('audio-toggle').innerText = isMuted ? "❌" : "🔊";
            if (bgGain && audioCtx) {
                bgGain.gain.setValueAtTime(isMuted ? 0 : 0.04, audioCtx.currentTime);
            }
        }

        const canvas = document.getElementById('space-bg');
        const ctx = canvas.getContext('2d');
        let stars = [];
        let galaxyAngle = 0;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        for (let i = 0; i < 80; i++) {
            stars.push({
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,
                size: Math.random() * 2,
                speed: 0.2 + Math.random() * 0.5
            });
        }

        function drawSpace() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#050515';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            galaxyAngle += 0.002;
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(galaxyAngle);
            
            let gradient = ctx.createRadialGradient(0, 0, 10, 0, 0, 250);
            gradient.addColorStop(0, 'rgba(127, 0, 255, 0.15)');
            gradient.addColorStop(0.5, 'rgba(0, 242, 254, 0.08)');
            gradient.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(-300, -300, 600, 600);
            ctx.restore();

            ctx.fillStyle = "#ffffff";
            stars.forEach(star => {
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
                star.y += star.speed;
                if (star.y > canvas.height) {
                    star.y = 0;
                    star.x = Math.random() * canvas.width;
                }
            });

            requestAnimationFrame(drawSpace);
        }
        drawSpace();

        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function startGame() {
            initAudio();
            playSoundEffect('click');
            
            studentName = (globalStudent && globalStudent.fullName) ? globalStudent.fullName : "دانش‌آموز";
            startedAt = Date.now();
            platformSaved = false;
            
            clearInterval(timerInterval);
            timeLeft = dynamicTimerSeconds;
            
            updateTimer();
            timerInterval = setInterval(() => { 
                timeLeft--; 
                updateTimer(); 
                if (timeLeft <= 0) { 
                    clearInterval(timerInterval); 
                    document.getElementById('spin-btn').disabled = true; 
                    document.getElementById('next-btn').disabled = true;
                    showEndScreen();
                } 
            }, 1000);
            
            document.getElementById('header-name').innerText = studentName;
            updateHeaderUIData();

            switchScreen('game-screen');
            initWheelCanvas();
        }

        function updateHeaderUIData() {
            document.getElementById('header-correct').innerText = correctCount;
            document.getElementById('header-wrong').innerText = wrongCount;
        }

        const wheelCanvas = document.getElementById('wheel');
        const wheelCtx = wheelCanvas.getContext('2d');
        const totalSegments = vocabulary.length;
        const segmentAngle = (2 * Math.PI) / totalSegments;
        
        const segmentColors = [
            '#1f124d', '#291154', '#34125c', '#3f1163', '#4b116b',
            '#112557', '#113161', '#113e6b', '#114b75', '#115980'
        ];

        function initWheelCanvas() {
            wheelCanvas.width = 300;
            wheelCanvas.height = 300;
            drawWheelStructure();
        }

        function drawWheelStructure() {
            const radius = wheelCanvas.width / 2;
            wheelCtx.clearRect(0, 0, wheelCanvas.width, wheelCanvas.height);
            wheelCtx.save();
            wheelCtx.translate(radius, radius);

            for (let i = 0; i < totalSegments; i++) {
                wheelCtx.beginPath();
                wheelCtx.moveTo(0, 0);
                wheelCtx.arc(0, 0, radius, i * segmentAngle, (i + 1) * segmentAngle);
                wheelCtx.fillStyle = segmentColors[i % segmentColors.length];
                wheelCtx.fill();
                
                wheelCtx.strokeStyle = 'rgba(79, 172, 254, 0.4)';
                wheelCtx.lineWidth = 2;
                wheelCtx.stroke();

                wheelCtx.save();
                wheelCtx.rotate(i * segmentAngle + segmentAngle / 2);
                wheelCtx.textAlign = "right";
                wheelCtx.textBaseline = "middle";
                
                wheelCtx.shadowColor = "#00f2fe";
                wheelCtx.shadowBlur = 4;
                wheelCtx.fillStyle = "#ffffff";
                wheelCtx.font = "bold 13px Vazir, Tahoma";
                
                wheelCtx.fillText(vocabulary[i].word, radius - 20, 0);
                wheelCtx.restore();
            }
            wheelCtx.restore();
        }

        function spinWheel() {
            if (remainingWords.length === 0) return;
            
            playSoundEffect('click');
            document.getElementById('spin-btn').disabled = true;
            document.getElementById('feedback-text').innerText = "";
            
            const randomPick = remainingWords[Math.floor(Math.random() * remainingWords.length)];
            currentSelectedPair = randomPick;

            const targetIdx = vocabulary.findIndex(v => v.word === randomPick.word);
            const targetSegmentCenterAngle = (targetIdx * segmentAngle) + (segmentAngle / 2);
            const stopAngleRad = (1.5 * Math.PI) - targetSegmentCenterAngle;
            
            const extraRotations = 5 * 360; 
            const targetRotationDegrees = (stopAngleRad * 180 / Math.PI) + extraRotations;
            
            currentRotation = targetRotationDegrees;
            const wheelEl = document.getElementById('wheel');
            wheelEl.style.transform = `rotate(${currentRotation}deg)`;

            let ticks = 0;
            const tickInterval = setInterval(() => {
                ticks++;
                if (ticks < 15) {
                    playSoundEffect('spin');
                } else {
                    clearInterval(tickInterval);
                }
            }, 220);

            setTimeout(() => {
                displayWordChallenge();
            }, 4050);
        }

        function displayWordChallenge() {
            document.getElementById('spin-btn').style.display = "none";
            
            const wordDisplay = document.getElementById('word-display');
            wordDisplay.innerText = `واژه: ${currentSelectedPair.word}`;
            wordDisplay.style.display = "block";
            
            document.getElementById('answer-form-container').style.display = "block";
            const answerInput = document.getElementById('answer-input');
            answerInput.value = "";
            answerInput.focus();
        }

        function checkAnswer() {
            const userAnswer = document.getElementById('answer-input').value.trim();
            if (userAnswer === "") return;

            document.getElementById('answer-form-container').style.display = "none";
            const feedbackText = document.getElementById('feedback-text');

            if (userAnswer === currentSelectedPair.meaning) {
                correctCount++;
                const randomEncouragement = positiveFeedbacks[Math.floor(Math.random() * positiveFeedbacks.length)];
                feedbackText.innerHTML = `<span style="color: #00ff88;">${randomEncouragement} ${studentName}! پاسخ درست است.</span>`;
                playSoundEffect('success');
                createSparkleParticles();
                
                remainingWords = remainingWords.filter(v => v.word !== currentSelectedPair.word);
                document.getElementById('next-btn').style.display = "block";
            } else {
                wrongCount++;
                feedbackText.innerHTML = `<span style="color: #ff2a2a;">${studentName} عزیز، پاسخ صحیح این واژه: «${currentSelectedPair.meaning}» بود.</span>`;
                playSoundEffect('error');
                
                setTimeout(() => {
                    prepareNextTurn();
                }, 3000);
            }

            updateHeaderUIData();
        }

        function prepareNextTurn() {
            document.getElementById('next-btn').style.display = "none";
            document.getElementById('word-display').style.display = "none";
            document.getElementById('feedback-text').innerText = "";
            
            if (remainingWords.length === 0) {
                showEndScreen();
            } else {
                document.getElementById('spin-btn').style.display = "block";
                document.getElementById('spin-btn').disabled = false;
            }
        }

        function createSparkleParticles() {
            const container = document.getElementById('game-screen');
            for (let i = 0; i < 30; i++) {
                const sparkle = document.createElement('div');
                sparkle.classList.add('sparkle');
                sparkle.style.left = '50%';
                sparkle.style.top = '40%';
                
                const angle = Math.random() * Math.PI * 2;
                const distance = 50 + Math.random() * 120;
                sparkle.style.setProperty('--x', `${Math.cos(angle) * distance}px`);
                sparkle.style.setProperty('--y', `${Math.sin(angle) * distance}px`);
                
                const colors = ['#00f2fe', '#4facfe', '#00ff88', '#fff', '#e100ff'];
                sparkle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                sparkle.style.width = sparkle.style.height = `${4 + Math.random() * 6}px`;

                container.appendChild(sparkle);
                setTimeout(() => sparkle.remove(), 600);
            }
        }

        async function showEndScreen() {
            clearInterval(timerInterval);
            
            document.getElementById('end-title').innerText = `تبریک ${studentName}!`;
            document.getElementById('end-name').innerText = studentName;
            document.getElementById('end-correct').innerText = correctCount;
            document.getElementById('end-wrong').innerText = wrongCount;
            
            await saveGameResultFinal(correctCount, wrongCount);
            
            switchScreen('end-screen');
        }

        function resetGameToWelcome() {
            playSoundEffect('click');
            window.location.href = '../index.html';
        }

        function updateTimer() {
            const timerText = document.getElementById('header-timer');
            const minutes = Math.floor(timeLeft / 60);
            const seconds = String(timeLeft % 60).padStart(2, '0');
            timerText.innerText = `${minutes}:${seconds}`;
        }
    </script>
</body>
</html>
