<!DOCTYPE html>
<html lang="fa" dir="rtl">

<meta charset="UTF-8">

<style>

/* =========================
   تنظیمات کلی
========================= */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{
    font-family:
    Tahoma,
    Arial,
    sans-serif;
    overflow-x:hidden;
    background:#f4dce7;
}

/* =========================
   پس زمینه
========================= */

.game{
    min-height:100vh;
    padding:15px;
    background-image:
    linear-gradient(
        rgba(255,255,255,.12),
        rgba(255,255,255,.12)
    ),
    url("../assets/img/game006-media-01.png");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;
    padding-bottom: 60px; /* فضای خالی برای فوتر */
}

/* =========================
   نوار ناوبری (Breadcrumb & Back)
========================= */
.top-nav {
    width: min(100%, 900px);
    margin: 0 auto 15px auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 15px 20px;
    background: rgba(255, 255, 255, 0.85);
    border: 3px solid white;
    border-radius: 25px;
    box-shadow: 0 8px 20px rgba(80,50,70,.1);
    z-index: 10;
    position: relative;
}

.nav-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
}

.breadcrumb {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    color: #70475f;
    font-weight: bold;
}

.breadcrumb a {
    text-decoration: none;
    color: #bd6e91;
    transition: color 0.2s;
}

.breadcrumb a:hover {
    color: #e68aaa;
}

.crumb-sep {
    color: #a07891;
}

.crumb-current {
    color: #70475f;
}

.back-btn {
    align-self: flex-start;
    display: inline-block;
    padding: 8px 16px;
    background: #bd6e91;
    color: white;
    text-decoration: none;
    border-radius: 15px;
    font-size: 14px;
    font-weight: bold;
    transition: transform 0.2s, background 0.2s;
    box-shadow: 0 4px 10px rgba(189, 110, 145, 0.3);
}

.back-btn:hover {
    background: #a35a7a;
    transform: translateY(-2px);
}

/* =========================
   صفحه اصلی
========================= */

.container{
    width:100%;
    max-width:900px;
    min-height:85vh;
    margin:auto;
    position:relative;
}

/* =========================
   صفحه خوش آمد
========================= */

.start-screen{
    min-height:75vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.welcome-card{
    width:min(95%,620px);
    padding:35px 25px;
    text-align:center;

        145deg,

    );

    border-radius:42px;
    box-shadow:
    0 10px 0 #c899af,
    0 20px 45px rgba(80,50,70,.2);
}

/* توپ لوگو */
.logo-ball{
    width:105px;
    height:105px;
    margin:0 auto 15px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:55px;
    font-weight:bold;
    color:white;
    background:
    linear-gradient(
        145deg,
        #ffd4e4,
        #e684aa
    );
    box-shadow:
    inset -12px -15px rgba(0,0,0,.13),
    inset 10px 10px rgba(255,255,255,.45),

}

.welcome-card h1{
    margin:10px 0;
    color:#70475f;
    font-size:36px;
    text-shadow:2px 3px white;
}

.welcome-card p{
    color:#98758a;
    font-size:19px;
    line-height:1.8;
}

.student-greeting {
    font-size: 22px;
    font-weight: bold;
    color: #bd6e91;
    margin: 15px 0;
    padding: 10px;
    background: rgba(255,255,255,0.6);
    border-radius: 15px;
    border: 2px dashed #efd0df;
}

/* دکمه شروع */
.start-button{
    margin-top:20px;
    padding:16px 42px;
    border:0;
    border-radius:25px;
    background:
    linear-gradient(
        180deg,
        #ffb6d1,
        #e68aaa
    );
    color:white;
    font-size:22px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:
    0 8px 0 #bd6e91,
    0 14px 25px rgba(100,50,80,.18);
}

.start-button:active{
    transform:translateY(6px);
    box-shadow:0 2px 0 #bd6e91;
}

/* =========================
   بازی
========================= */

#game{
    display:none;
    padding:10px 5px 30px;
}

/* بالای صفحه */
.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap: wrap;
    gap:10px;
    margin-bottom:18px;
}

.badge{
    background:rgba(255,255,255,.94);
    border:3px solid white;
    border-radius:23px;
    padding:10px 16px;
    color:#684b60;
    font-weight:bold;
    box-shadow:0 6px 0 #cdaabd;
}

/* =========================
   کارت سوال
========================= */

.question-card{
    background:rgba(255,255,255,.96);
    border:5px solid white;
    border-radius:35px;
    padding:20px;
    text-align:center;
    box-shadow:
    0 9px 0 #c7a4b7,
    0 15px 30px rgba(80,50,70,.16);
}

.question-card small{
    color:#a07891;
    font-size:16px;
}

.question{
    color:#684b60;
    font-size:28px;
    line-height:1.8;
    margin:7px 0 0;
}

/* =========================
   توپ ها
========================= */

.balls{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
    max-width:850px;
    margin:30px auto;
}

/* توپ */
.ball{
    position:relative;
    border:0;
    aspect-ratio:1;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:12px;
    color:white;
    font-size:20px;
    font-weight:900;
    cursor:pointer;
    overflow:hidden;
    box-shadow:
    inset -14px -18px rgba(0,0,0,.14),
    inset 10px 10px rgba(255,255,255,.42),
    inset 0 0 20px rgba(255,255,255,.18),
    0 9px 0 rgba(70,50,65,.22),
    0 15px 25px rgba(70,50,65,.16);
    transition:transform .15s,filter .15s;
}

/* نور توپ */
.ball::before{
    content:"";
    position:absolute;
    width:40%;
    height:22%;
    top:12%;
    left:18%;
    border-radius:50%;
    background:rgba(255,255,255,.55);
    transform:rotate(-25deg);
    filter:blur(2px);
}

/* بافت */
.ball::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:50%;
    opacity:.13;
    background-image:
    radial-gradient(
        rgba(255,255,255,.9) 1px,
        transparent 1px
    );
    background-size:7px 7px;
}

/* رنگ ها */
.ball:nth-child(1){ background:linear-gradient(145deg,#ffc2d8,#df729b); }
.ball:nth-child(2){ background:linear-gradient(145deg,#a5eee9,#4eb5bb); }
.ball:nth-child(3){ background:linear-gradient(145deg,#ccd2ff,#8996e1); }
.ball:nth-child(4){ background:linear-gradient(145deg,#ffe49d,#e3ad43); }
.ball:nth-child(5){ background:linear-gradient(145deg,#d8f1ae,#8dc76d); }
.ball:nth-child(6){ background:linear-gradient(145deg,#e9bcec,#b978c1); }
.ball:nth-child(7){ background:linear-gradient(145deg,#ffc39f,#dc8059); }
.ball:nth-child(8){ background:linear-gradient(145deg,#b9e6ff,#70b5df); }
.ball:nth-child(9){ background:linear-gradient(145deg,#ffc3c3,#dc8585); }
.ball:nth-child(10){ background:linear-gradient(145deg,#c8edda,#75bb99); }
.ball:nth-child(11){ background:linear-gradient(145deg,#e0c5ff,#9f78d1); }

/* لمس */
.ball:active{
    transform:scale(.91) translateY(5px);
}

/* جواب درست */
.ball.correct{
    animation:correctBall .7s ease;
    outline:6px solid white;
    pointer-events:none;
}

@keyframes correctBall{
    0%{ transform:scale(1); }
    35%{ transform:scale(1.23) rotate(-6deg); }
    65%{ transform:scale(.94) rotate(5deg); }
    100%{ transform:scale(1); }
}

/* جواب غلط */
.ball.wrong{
    animation:wrongBall .45s ease;
}

@keyframes wrongBall{
    0%,100%{ transform:translateX(0); }
    25%{ transform:translateX(-13px); }
    50%{ transform:translateX(13px); }
    75%{ transform:translateX(-8px); }
}

/* =========================
   پیام
========================= */

.message{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%) scale(.5);
    opacity:0;
    z-index:100;
    background:white;
    padding:25px 30px;
    border-radius:32px;
    color:#684b60;
    font-size:23px;
    font-weight:bold;
    text-align:center;
    box-shadow:0 20px 50px rgba(70,40,60,.3);
    transition:.25s;
    pointer-events:none;
}

.message.show{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
}

/* =========================
   فشفشه
========================= */

.spark{
    position:fixed;
    z-index:200;
    font-size:38px;
    pointer-events:none;
    animation:fireworks 1s forwards;
}

@keyframes fireworks{
    0%{
        opacity:1;
        transform:translate(0,0) scale(.3) rotate(0);
    }
    100%{
        opacity:0;
        transform:translate(var(--x),var(--y)) scale(1.5) rotate(360deg);
    }
}

/* =========================
   بمب
========================= */

.bomb{
    position:fixed;
    left:50%;
    top:50%;
    z-index:150;
    font-size:100px;
    opacity:0;
    pointer-events:none;
}

.bomb.show{
    animation:bombAnimation .75s ease;
}

@keyframes bombAnimation{
    0%{ opacity:0; transform:translate(-50%,-50%) scale(.2); }
    35%{ opacity:1; transform:translate(-50%,-50%) scale(1.3); }
    70%{ opacity:1; transform:translate(-50%,-50%) scale(1); }
    100%{ opacity:0; transform:translate(-50%,-50%) scale(1.5); }
}

/* =========================
   موبایل
========================= */

@media(max-width:650px){
    .game{ padding:10px; }
    .welcome-card h1{ font-size:30px; }
    .question{ font-size:21px; }
    .balls{
        grid-template-columns:repeat(3,1fr);
        gap:12px;
    }
    .ball{ font-size:16px; }
    .badge{ font-size:14px; padding:9px 12px; }
}

</style>

<body>

<!-- اسکریپت پلتفرم -->
<script src="../assets/js/google-sync.js"></script>
<script>
// INTEGRATION: دریافت اطلاعات و بررسی نوبت مجاز
const GAME_ID = 6;
let platformStudent = null;
let platformSaved = false;

(async function initPlatform(){
    platformStudent = getCurrentStudent();
    if (!platformStudent) {
        window.location.href = '../index.html';
        return;
    }
    
    document.documentElement.style.visibility = 'hidden';
    const attemptCheck = await syncCheckAttempts(platformStudent.studentCode, GAME_ID);
    if (!attemptCheck.success) {
        document.documentElement.style.visibility = 'visible';
        document.body.innerHTML = '<main style="font-family:Tahoma,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;text-align:center;padding:24px"><h2 style="color:#bd6e91;">' + (attemptCheck.error || 'امکان شرکت در این بازی وجود ندارد.') + '</h2></main>';
        return;
    }
    
    const settings = await syncGetGameSettings(GAME_ID);
    window.timerSeconds = settings.timerSeconds || 180;
    
    // دریافت نام آموزگار پلتفرم
    let teacherName = 'خانم دهگودی'; 
    if (platformStudent.teacherName) {
        teacherName = platformStudent.teacherName;
    } else if (platformStudent.className) {
        try {
            const classesResult = await syncListClasses();
            if (classesResult && classesResult.success) {
                const match = classesResult.classes.find(c => c.className === platformStudent.className);
                if (match && match.teacherName) {
                    teacherName = match.teacherName;
                }
            }
        } catch (e) {
            console.error('Error fetching teacher name:', e);
        }
    }
    window.platformTeacherName = teacherName;
    
    // تنظیم نام دانش آموز در صفحه استارت
    const startNameEl = document.getElementById("startStudentName");
    if(startNameEl) startNameEl.textContent = platformStudent.fullName;
    
    document.documentElement.style.visibility = 'visible';
})();

window.addEventListener('DOMContentLoaded', function () {
    // ایجاد نوار آموزگار
    if (!document.querySelector('.platform-teacher')) {
        const teacher = document.createElement('div');
        teacher.className = 'platform-teacher';
        teacher.textContent = 'آموزگار: ' + (window.platformTeacherName || 'خانم دهگودی');
        
        // قرار دادن نوار آموزگار در بالای Breadcrumb
        const topNav = document.querySelector('.nav-row');
        if(topNav) {
            teacher.style.cssText = 'font-weight:900; color:#bd6e91; font-size:16px; background:rgba(255,255,255,0.7); padding:5px 12px; border-radius:15px; border:2px dashed #efd0df;';
            topNav.appendChild(teacher);
        }
    }
    // ایجاد فوتر
    if (!document.querySelector('.platform-footer')) {
        const footer = document.createElement('footer');
        footer.className = 'platform-footer';
        footer.textContent = 'طراحی و پیاده‌سازی: سعید سراوانی';
        footer.style.cssText = 'text-align:center; font-weight:700; padding:12px; color:#fff; background:rgba(112, 71, 95, 0.9); position:fixed; bottom:0; width:100%; z-index:9999; font-size:14px;';
        document.body.appendChild(footer);
    }
});
</script>

<script>

/* =========================
   عناصر و وضعیت بازی
========================= */

const startButton = document.getElementById("startButton");
const startScreen = document.getElementById("startScreen");
const game = document.getElementById("game");
const childName = document.getElementById("childName");
const correctText = document.getElementById("correctCount");
const wrongText = document.getElementById("wrongCount");
const timerText = document.getElementById("timer");
const message = document.getElementById("message");
const bomb = document.getElementById("bomb");

let correctFound = 0;
let wrongCount = 0;
let timerInterval = null;
let timeLeft = 0;
let resultSaved = false;
let startedAt = 0;

const totalCorrect = 3;

/* =========================
   شروع بازی
========================= */

startButton.addEventListener("click", function(){
    startedAt = Date.now();
    childName.textContent = platformStudent ? platformStudent.fullName : "دانش‌آموز";
    
    startScreen.style.display = "none";
    game.style.display = "block";
    startTimer();
});

/* =========================
   توپ ها
========================= */

const balls = document.querySelectorAll(".ball");

balls.forEach(function(ball){
    ball.addEventListener("click", function(){
        const correct = this.dataset.correct === "true";

        /* جواب درست */
        if(correct){
            if(this.classList.contains("correct")){
                return;
            }
            this.classList.add("correct");
            correctFound++;
            correctText.textContent = correctFound.toLocaleString("fa-IR");

            showMessage("🎇 آفرین! درست پیدا کردی!");
            createFireworks();

            /* پایان */
            if(correctFound === totalCorrect){
                setTimeout(function(){
                    showMessage("🏆 فوق‌العاده بود! هر سه کلمه را پیدا کردی!");
                    finishGame();
                }, 900);
            }
        }
        /* جواب غلط */
        else{
            if(this.classList.contains("wrong") || this.classList.contains("correct")) return;
            wrongCount++;
            wrongText.textContent = wrongCount.toLocaleString("fa-IR");
            
            this.classList.add("wrong");
            showBomb();
            playBeep();
            
            showMessage("💣 اووه! این یکی درست نیست!");
            
            setTimeout(function(){
                ball.classList.remove("wrong");
            }, 500);
        }
    });
});

function startTimer(){
    clearInterval(timerInterval);
    timeLeft = window.timerSeconds || 180;
    updateTimer();
    timerInterval = setInterval(() => {
        timeLeft--;
        updateTimer();
        if(timeLeft <= 0){
            clearInterval(timerInterval);
            balls.forEach(ball => ball.disabled = true);
            finishGame(); // اتمام بازی با اتمام زمان
        }
    }, 1000);
}

function updateTimer(){
    timerText.textContent = `${Math.floor(timeLeft/60).toLocaleString("fa-IR")}:${String(timeLeft%60).padStart(2,"0").toLocaleString("fa-IR")}`;
}

async function finishGame(){
    if(resultSaved) return;
    resultSaved = true;
    clearInterval(timerInterval);
    balls.forEach(ball => ball.disabled = true);
    
    if (window.platformStudent) {
        const durationSeconds = Math.round((Date.now() - startedAt) / 1000);
        await syncSaveResult(window.platformStudent.studentCode, GAME_ID, correctFound, wrongCount, durationSeconds);
    }
}

/* =========================
   پیام
========================= */

function showMessage(text){
    message.textContent = text;
    message.classList.add("show");
    
    clearTimeout(window.messageTimer);
    window.messageTimer = setTimeout(function(){
        message.classList.remove("show");
    }, 1100);
}

/* =========================
   فشفشه
========================= */

function createFireworks(){
    const icons = ["🎇", "✨", "⭐", "🌟", "🎉"];

    for(let i=0; i<22; i++){
        const spark = document.createElement("div");
        spark.className = "spark";
        spark.textContent = icons[Math.floor(Math.random() * icons.length)];
        
        spark.style.left = "50%";
        spark.style.top = "45%";
        spark.style.setProperty("--x", (Math.random() * 520 - 260) + "px");
        spark.style.setProperty("--y", (Math.random() * 520 - 260) + "px");
        
        document.body.appendChild(spark);
        setTimeout(function(){ spark.remove(); }, 1000);
    }
}

/* =========================
   بمب
========================= */

function showBomb(){
    bomb.classList.remove("show");
    void bomb.offsetWidth;
    bomb.classList.add("show");
    
    setTimeout(function(){
        bomb.classList.remove("show");
    }, 800);
}

/* =========================
   صدای بوق
========================= */

function playBeep(){
    try{
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audio = new AudioContext();
        const oscillator = audio.createOscillator();
        const gain = audio.createGain();
        
        oscillator.type = "square";
        oscillator.frequency.value = 180;
        gain.gain.value = 0.15;
        
        oscillator.connect(gain);
        gain.connect(audio.destination);
        
        oscillator.start();
        oscillator.stop(audio.currentTime + 0.25);
    } catch(error) {
        /* اگر صدا پشتیبانی نشود، بازی ادامه دارد */
    }
}

</script>
