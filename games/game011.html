<script>

/* =====================================================
   سیستم صدا
===================================================== */

class AudioFX{

    constructor(){
        this.ctx=null;
    }

    init(){

        if(!this.ctx){

            this.ctx=new(
                window.AudioContext||
                window.webkitAudioContext
            )();

        }

        if(this.ctx.state==="suspended"){
            this.ctx.resume();
        }

    }

    playTone(
        freq,
        duration,
        type="sine",
        decay=true
    ){

        if(!this.ctx)return;

        const osc=
            this.ctx.createOscillator();

        const gain=
            this.ctx.createGain();

        osc.type=type;

        osc.frequency.setValueAtTime(
            freq,
            this.ctx.currentTime
        );

        gain.gain.setValueAtTime(
            .2,
            this.ctx.currentTime
        );

        if(decay){

            gain.gain.exponentialRampToValueAtTime(
                .001,
                this.ctx.currentTime+duration
            );

        }

        osc.connect(gain);

        gain.connect(
            this.ctx.destination
        );

        osc.start();

        osc.stop(
            this.ctx.currentTime+duration
        );

    }

    correct(){

        if(!this.ctx)return;

        [
            523.25,
            659.25,
            783.99,
            1046.50
        ].forEach((f,i)=>{

            setTimeout(()=>{

                this.playTone(
                    f,
                    .35,
                    "triangle"
                );

            },i*80);

        });

    }

    beepWrong(){

        if(!this.ctx)return;

        const osc=
            this.ctx.createOscillator();

        const gain=
            this.ctx.createGain();

        osc.type="sawtooth";

        osc.frequency.setValueAtTime(
            130,
            this.ctx.currentTime
        );

        gain.gain.setValueAtTime(
            .3,
            this.ctx.currentTime
        );

        gain.gain.linearRampToValueAtTime(
            .01,
            this.ctx.currentTime+.35
        );

        osc.connect(gain);

        gain.connect(
            this.ctx.destination
        );

        osc.start();

        osc.stop(
            this.ctx.currentTime+.35
        );

    }

    win(){

        if(!this.ctx)return;

        [
            523.25,
            659.25,
            783.99,
            1046.50,
            1318.51
        ].forEach((f,i)=>{

            setTimeout(()=>{

                this.playTone(
                    f,
                    .4,
                    "triangle"
                );

            },i*120);

        });

    }

    grab(){

        this.playTone(
            580,
            .08,
            "sine"
        );

    }

}

const TOTAL_ROUNDS=10;

/* =====================================================
   شافل کاملاً تصادفی
===================================================== */

function shuffleArray(array){

    const arr=[...array];

    for(
        let i=arr.length-1;
        i>0;
        i--
    ){

        const j=
            Math.floor(
                Math.random()*(i+1)
            );

        [
            arr[i],
            arr[j]
        ]=[
            arr[j],
            arr[i]
        ];

    }

    return arr;
}


/*
    هیچ قانونی برای ترتیب وجود ندارد.
    نه یکی‌درمیان،
    نه جلوگیری از پشت‌سرهم بودن،
    نه E/H.

    فقط انتخاب تصادفی.
*/

function createRandomPool(){

    const shuffled=
        shuffleArray(
            WORDS_MASTER
        );

    return shuffled.slice(
        0,
        TOTAL_ROUNDS
    );

}

let bee={

/* =====================================================
   تغییر اندازه
===================================================== */

function resize(){

    width=
        window.innerWidth;

    height=
        window.innerHeight;


    const ratio=
        window.devicePixelRatio||1;


    canvas.width=
        width*ratio;

    canvas.height=
        height*ratio;


    canvas.style.width=
        width+"px";

    canvas.style.height=
        height+"px";


    ctx.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
    );


    updatePositions();

}

window.addEventListener(
    "resize",
    resize
);


/* =====================================================
   موقعیت عناصر
===================================================== */

function updatePositions(){

    const isMobile=
        width<768;


    const hiveMargin=
        isMobile
        ?85
        :130;


    const hiveY=
        height*.58;


    hiveLeft.x=
        hiveMargin;

    hiveLeft.y=
        hiveY;

    hiveLeft.w=
        isMobile
        ?120
        :160;

    hiveLeft.h=
        isMobile
        ?180
        :230;


    hiveRight.x=
        width-hiveMargin;

    hiveRight.y=
        hiveY;

    hiveRight.w=
        isMobile
        ?120
        :160;

    hiveRight.h=
        isMobile
        ?180
        :230;


    bee.homeX=
        width/2;

    bee.homeY=
        height*.65;


    if(!bee.isDragging){

        bee.targetX=
            bee.homeX;

        bee.targetY=
            bee.homeY;

    }

}


/* =====================================================
   گلبرگ‌ها
===================================================== */

const petals=[];

/* =====================================================
   ستاره‌های انفجاری
===================================================== */

let burstStars=[];

function createBurst(
    x,
    y,
    color
){

    for(let i=0;i<25;i++){

        const angle=
            Math.random()*
            Math.PI*2;

        const speed=
            3+
            Math.random()*7;


        burstStars.push({

            x:x,
            y:y,

            vx:
                Math.cos(angle)*
                speed,

            vy:
                Math.sin(angle)*
                speed,

            life:1,

            size:
                4+
                Math.random()*6,

            color:color

        });

    }

}


/* =====================================================
   رسم کندو
===================================================== */

function drawHive(h){

    ctx.save();

    ctx.translate(
        h.x,
        h.y
    );


    ctx.shadowColor=
        h.glow;

    ctx.shadowBlur=25;


    ctx.fillStyle=
        h.color;


    ctx.beginPath();

    ctx.roundRect(
        -h.w/2,
        -h.h/2,
        h.w,
        h.h,
        [40,40,25,25]
    );

    ctx.fill();


    ctx.shadowBlur=0;


    ctx.strokeStyle=
        "rgba(255,255,255,.6)";

    ctx.lineWidth=4;

    ctx.stroke();


    /* ورودی کندو */

    ctx.fillStyle=
        "#100320";

    ctx.beginPath();

    ctx.ellipse(
        0,
        h.h*.25,
        h.w*.28,
        h.h*.16,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.strokeStyle=
        h.glow;

    ctx.lineWidth=3;

    ctx.stroke();


    /* نوشته کندو */

    ctx.shadowColor=
        "rgba(0,0,0,.8)";

    ctx.shadowBlur=8;

    ctx.fillStyle=
        "#fff";

    ctx.font=
        `bold ${h.w*.17}px Tahoma,sans-serif`;

    ctx.textAlign=
        "center";

    ctx.textBaseline=
        "middle";


    ctx.fillText(
        h.title,
        0,
        -h.h*.22
    );


    ctx.font=
        `bold ${h.w*.13}px Tahoma,sans-serif`;

    ctx.fillStyle=
        "#fffae6";


    ctx.fillText(
        h.sub,
        0,
        -h.h*.05
    );


    ctx.restore();

}


/* =====================================================
   رسم زنبور
===================================================== */

function drawBee(
    b,
    time
){

    ctx.save();

    ctx.translate(
        b.x,
        b.y
    );


    const floatOffset=
        b.isDragging
        ?0
        :Math.sin(
            time*.006
        )*6;


    ctx.translate(
        0,
        floatOffset
    );


    b.wingAngle=
        Math.sin(
            time*.04
        )*.5;


    /* بال‌ها */

    ctx.fillStyle=
        "rgba(255,255,255,.85)";

    ctx.strokeStyle=
        "#00f5d4";

    ctx.lineWidth=2;


    ctx.save();

    ctx.translate(
        -15,
        -20
    );

    ctx.rotate(
        -.4+
        b.wingAngle
    );

    ctx.beginPath();

    ctx.ellipse(
        0,
        -20,
        12,
        24,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.stroke();

    ctx.restore();


    ctx.save();

    ctx.translate(
        15,
        -20
    );

    ctx.rotate(
        .4-
        b.wingAngle
    );

    ctx.beginPath();

    ctx.ellipse(
        0,
        -20,
        12,
        24,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.stroke();

    ctx.restore();


    /* بدن */

    ctx.shadowColor=
        "rgba(255,230,0,.6)";

    ctx.shadowBlur=20;

    ctx.fillStyle=
        "#ffc300";

    ctx.beginPath();

    ctx.ellipse(
        0,
        0,
        b.size*.85,
        b.size*.7,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* خطوط بدن */

    ctx.shadowBlur=0;

    ctx.fillStyle=
        "#222";


    [-10,10].forEach(
        sx=>{

            ctx.beginPath();

            ctx.roundRect(
                sx-4,
                -b.size*.62,
                8,
                b.size*1.24,
                4
            );

            ctx.fill();

        }
    );


    /* گونه‌ها */

    ctx.fillStyle=
        "#ff007f";

    ctx.beginPath();

    ctx.arc(
        -18,
        6,
        6,
        0,
        Math.PI*2
    );

    ctx.arc(
        18,
        6,
        6,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* چشم‌ها */

    ctx.fillStyle=
        "#111";

    ctx.beginPath();

    ctx.arc(
        -12,
        -4,
        7,
        0,
        Math.PI*2
    );

    ctx.arc(
        12,
        -4,
        7,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* برق چشم */

    ctx.fillStyle=
        "#fff";

    ctx.beginPath();

    ctx.arc(
        -10,
        -6,
        2.5,
        0,
        Math.PI*2
    );

    ctx.arc(
        14,
        -6,
        2.5,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* لبخند */

    ctx.strokeStyle=
        "#222";

    ctx.lineWidth=3;

    ctx.beginPath();

    ctx.arc(
        0,
        4,
        8,
        .2*Math.PI,
        .8*Math.PI
    );

    ctx.stroke();


    ctx.restore();

}


/* =====================================================
   گرفتن موقعیت لمس
===================================================== */

function getPointer(e){

    const rect=
        canvas.getBoundingClientRect();


    const clientX=
        e.touches
        ?e.touches[0].clientX
        :e.clientX;


    const clientY=
        e.touches
        ?e.touches[0].clientY
        :e.clientY;


    return{

        x:
            clientX-
            rect.left,

        y:
            clientY-
            rect.top

    };

}


/* =====================================================
   شروع کشیدن زنبور
===================================================== */

function onDown(e){

    if(isLocked)return;


    const p=
        getPointer(e);


    const dist=
        Math.hypot(
            p.x-bee.x,
            p.y-bee.y
        );


    if(
        dist<
        bee.size*1.8
    ){

        bee.isDragging=
            true;

        sfx.grab();

    }

}


/* =====================================================
   حرکت زنبور
===================================================== */

function onMove(e){

    if(
        !bee.isDragging||
        isLocked
    ){

        return;

    }


    if(e.cancelable){
        e.preventDefault();
    }


    const p=
        getPointer(e);


    bee.targetX=
        p.x;

    bee.targetY=
        p.y;

}


/* =====================================================
   رها کردن زنبور
===================================================== */

function onUp(){

    if(!bee.isDragging){
        return;
    }


    bee.isDragging=
        false;


    checkDrop();

}


/* =====================================================
   رویدادها
===================================================== */

canvas.addEventListener(
    "mousedown",
    onDown
);

window.addEventListener(
    "mousemove",
    onMove
);

window.addEventListener(
    "mouseup",
    onUp
);

canvas.addEventListener(
    "touchstart",
    onDown,
    {passive:false}
);

window.addEventListener(
    "touchmove",
    onMove,
    {passive:false}
);

window.addEventListener(
    "touchend",
    onUp,
    {passive:false}
);


/* =====================================================
   UI
===================================================== */

const wordDisplay=
    document.getElementById(
        "word-display"
    );

const correctText=document.getElementById("correct-count");
const wrongText=document.getElementById("wrong-count");
const timerText=document.getElementById("timer");

const progressBadge=
    document.getElementById(
        "progress-badge"
    );

const toast=
    document.getElementById(
        "toast"
    );


function toFaDigits(num){

    return String(num).replace(
        /\d/g,
        d=>"۰۱۲۳۴۵۶۷۸۹"[d]
    );

}


/* =====================================================
   شروع بازی
===================================================== */

function startSession(){

    correctCount=0;
    wrongCount=0;
    resultSaved=false;

    currentRound=0;

    /*
       اینجا ترتیب کاملاً تصادفی ساخته می‌شود.
       هیچ محدودیت دیگری وجود ندارد.
    */

    gamePool=
        createRandomPool();


    correctText.textContent="۰";
    wrongText.textContent="۰";
    startTimer();


    nextWord();

}


/* =====================================================
   کلمه بعد
===================================================== */

function nextWord(){

    if(
        currentRound>=
        TOTAL_ROUNDS
    ){

        endGame();

        return;

    }


    currentWord=
        gamePool[
            currentRound
        ];


    currentRound++;


    progressBadge.textContent=
        `مرحله: ${
            toFaDigits(currentRound)
        } از ${
            toFaDigits(TOTAL_ROUNDS)
        }`;


    wordDisplay.style.transform=
        "scale(.3)";


    wordDisplay.textContent=
        currentWord.word;


    setTimeout(
        ()=>{

            wordDisplay.style.transform=
                "scale(1)";

        },
        50
    );


    bee.targetX=
        bee.homeX;

    bee.targetY=
        bee.homeY;


    isLocked=false;

}


/* =====================================================
   پیام
===================================================== */

function showToast(
    text,
    type
){

    toast.textContent=
        text;

    toast.className=
        "toast "+type;


    setTimeout(
        ()=>{

            toast.className=
                "toast";

        },
        1400
    );

}


/* =====================================================
   بررسی محل رها کردن
===================================================== */

function checkDrop(){

    const distLeft=
        Math.hypot(
            bee.x-hiveLeft.x,
            bee.y-hiveLeft.y
        );


    const distRight=
        Math.hypot(
            bee.x-hiveRight.x,
            bee.y-hiveRight.y
        );


    if(
        distLeft<
        hiveLeft.w*.8
    ){

        validate(
            "E",
            hiveLeft
        );

    }

    else if(
        distRight<
        hiveRight.w*.8
    ){

        validate(
            "H",
            hiveRight
        );

    }

    else{

        bee.targetX=
            bee.homeX;

        bee.targetY=
            bee.homeY;

    }

}


/* =====================================================
   بررسی پاسخ
===================================================== */

function validate(
    selectedType,
    hive
){

    if(
        selectedType===
        currentWord.sound
    ){

        isLocked=true;


        sfx.correct();


        correctCount++;
        correctText.textContent=toFaDigits(correctCount);


        createBurst(
            hive.x,
            hive.y,
            hive.glow
        );


        showToast(
            `آفرین ${studentName}! 👏`,
            "success"
        );


        setTimeout(
            nextWord,
            1400
        );

    }

    else{

        wrongCount++;
        wrongText.textContent=toFaDigits(wrongCount);


        sfx.beepWrong();


        wordDisplay.classList.add(
            "shake"
        );


        setTimeout(
            ()=>{

                wordDisplay.classList.remove(
                    "shake"
                );

            },
            400
        );


        showToast(
            "اشتباه بود! دوباره تلاش کن ❌",
            "retry"
        );


        bee.targetX=
            bee.homeX;

        bee.targetY=
            bee.homeY;

    }

}


/* =====================================================
   پایان بازی
===================================================== */

function endGame(){

    isLocked=true;


    sfx.win();


    document.getElementById(
        "victory-msg"
    ).innerHTML=
        `
        آفرین <b>${studentName}</b> عزیز!<br>
        تمام ۱۰ مرحله رو با موفقیت
        به پایان رسوندی! 🎉
        `;


    clearInterval(timerInterval);
    document.getElementById("final-result").textContent=`پاسخ درست: ${toFaDigits(correctCount)} | پاسخ غلط: ${toFaDigits(wrongCount)}`;
    if(!resultSaved){resultSaved=true;platformSaved=true;syncSaveResult(student.studentCode,GAME_ID,correctCount,wrongCount,Math.round((Date.now()-platformStartedAt)/1000));}


    document.getElementById(
        "victory-modal"
    ).style.display=
        "flex";

}

function startTimer(){
    clearInterval(timerInterval);
    timeLeft=window.timerSeconds||180;
    updateTimer();
    timerInterval=setInterval(()=>{timeLeft--;updateTimer();if(timeLeft<=0){clearInterval(timerInterval);isLocked=true;}},1000);
}

function updateTimer(){timerText.textContent=`${toFaDigits(Math.floor(timeLeft/60))}:${toFaDigits(String(timeLeft%60).padStart(2,"0"))}`;}


/* =====================================================
   حلقه اصلی
===================================================== */

function loop(timestamp){

    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    /* =========================
       تصویر پس‌زمینه
    ========================= */

    if(
        backgroundImage.complete&&
        backgroundImage.naturalWidth>0
    ){

        const imgRatio=
            backgroundImage.naturalWidth/
            backgroundImage.naturalHeight;


        const screenRatio=
            width/height;


        let drawWidth;
        let drawHeight;
        let offsetX;
        let offsetY;


        if(
            imgRatio>
            screenRatio
        ){

            drawHeight=
                height;

            drawWidth=
                height*
                imgRatio;

            offsetX=
                (width-drawWidth)/2;

            offsetY=0;

        }

        else{

            drawWidth=
                width;

            drawHeight=
                width/
                imgRatio;

            offsetX=0;

            offsetY=
                (height-drawHeight)/2;

        }


        ctx.drawImage(
            backgroundImage,
            offsetX,
            offsetY,
            drawWidth,
            drawHeight
        );

    }

    else{

        ctx.fillStyle=
            "#16052b";

        ctx.fillRect(
            0,
            0,
            width,
            height
        );

    }


    /* =========================
       گلبرگ‌ها
    ========================= */

    petals.forEach(
        p=>{

            p.y+=p.speedY;

            p.x+=p.speedX;

            p.rot+=p.rotSpeed;


            if(
                p.y>
                height+20
            ){

                p.y=-20;

                p.x=
                    Math.random()*width;

            }


            ctx.save();

            ctx.translate(
                p.x,
                p.y
            );

            ctx.rotate(
                p.rot
            );

            ctx.fillStyle=
                p.color;

            ctx.beginPath();

            ctx.ellipse(
                0,
                0,
                p.size,
                p.size*.4,
                0,
                0,
                Math.PI*2
            );

            ctx.fill();

            ctx.restore();

        }
    );


    /* کندوها */

    drawHive(
        hiveLeft
    );

    drawHive(
        hiveRight
    );


    /* انفجار ستاره‌ای */

    burstStars.forEach(
        (s,idx)=>{

            s.x+=s.vx;

            s.y+=s.vy;

            s.life-=.02;


            if(
                s.life<=0
            ){

                burstStars.splice(
                    idx,
                    1
                );

            }

            else{

                ctx.fillStyle=
                    s.color;

                ctx.globalAlpha=
                    s.life;

                ctx.beginPath();

                ctx.arc(
                    s.x,
                    s.y,
                    s.size,
                    0,
                    Math.PI*2
                );

                ctx.fill();

                ctx.globalAlpha=1;

            }

        }
    );


    /* حرکت نرم زنبور */

    bee.x+=
        (
            bee.targetX-
            bee.x
        )*.22;


    bee.y+=
        (
            bee.targetY-
            bee.y
        )*.22;


    drawBee(
        bee,
        timestamp
    );


    requestAnimationFrame(
        loop
    );

}


/* =====================================================
   دکمه شروع
===================================================== */

document.getElementById(
    "start-btn"
).addEventListener(
    "click",
    ()=>{

        const inputVal=
            document.getElementById(
                "student-input"
            ).value.trim();


        if(inputVal){

            studentName=
                inputVal;

        }


        document.getElementById(
            "student-badge"
        ).textContent=
            `دانش‌آموز: ${studentName}`;


        sfx.init();


        document.getElementById(
            "welcome-modal"
        ).style.display=
            "none";


        resize();


        startSession();


        requestAnimationFrame(
            loop
        );

    }
);


/* =====================================================
   بازی دوباره
===================================================== */

document.getElementById(
    "restart-btn"
).addEventListener(
    "click",
    ()=>{

        document.getElementById(
            "victory-modal"
        ).style.display=
            "none";


        /*
           بازی دوباره =
           ترتیب کاملاً جدید
        */

        startSession();

    }
);


/* =====================================================
   Enter
===================================================== */

document.getElementById(
    "student-input"
).addEventListener(
    "keydown",
    e=>{

        if(e.key==="Enter"){

            document.getElementById(
                "start-btn"
            ).click();

        }

    }
);


/* =====================================================
   شروع اولیه
===================================================== */

resize();

</script>
