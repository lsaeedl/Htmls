<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ماموریت علائم نگارشی 🚀</title>

<style>
*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
margin:0;
padding:0;
width:100%;
min-height:100%;
font-family:Tahoma,Arial,sans-serif;
}

body{
background:#020014;
color:#fff;
overflow:hidden;
}

.game{
min-height:100vh;
position:relative;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;

background-image:
linear-gradient(
rgba(2,0,20,.12),
rgba(2,0,20,.35)
),
url("../assets/img/game007-media-01.png");

background-size:cover;
background-position:center;
background-repeat:no-repeat;
}


/* ستاره‌های متحرک */

.game::before{
content:"";
position:absolute;
inset:0;
pointer-events:none;

background-image:
radial-gradient(circle,#fff 1px,transparent 2px),
radial-gradient(circle,#00ffff 1px,transparent 2px),
radial-gradient(circle,#ff55ff 1px,transparent 2px);

background-size:
100px 100px,
160px 160px,
220px 220px;

opacity:.3;

animation:stars 25s linear infinite;
}

@keyframes stars{
to{
background-position:
0 180px,
100px 250px,
-120px 170px;
}
}


/* کارت اصلی */

.panel{
position:relative;
z-index:5;

width:min(94%,800px);

padding:25px;

border-radius:35px;

background:rgba(3,0,30,.72);

border:2px solid rgba(0,255,255,.7);

box-shadow:
0 0 18px #00ffff,
0 0 55px rgba(0,255,255,.25),
inset 0 0 35px rgba(255,0,255,.08);

backdrop-filter:blur(8px);

text-align:center;
}

.hide{
display:none!important;
}


/* عنوان */

.logo{
font-size:clamp(28px,6vw,52px);
font-weight:900;

background:
linear-gradient(
90deg,
#00ffff,
#ff55ff,
#ffe600
);

-webkit-background-clip:text;
color:transparent;

margin:10px 0 15px;
}

.subtitle{
font-size:18px;
line-height:2;
color:#e5e1ff;
margin-bottom:22px;
}


/* فضانورد */

.astronaut{
font-size:82px;

filter:
drop-shadow(0 0 20px #00ffff);

animation:
float 3s ease-in-out infinite;
}

@keyframes float{
50%{
transform:
translateY(-12px)
rotate(3deg);
}
}


/* نام */

.nameInput{
width:min(100%,430px);
height:58px;

border:
2px solid #00ffff;

border-radius:18px;

background:rgba(0,0,30,.85);

color:white;

font-size:18px;

text-align:center;

outline:none;

box-shadow:
0 0 18px #00ffff66;

margin-bottom:15px;
}

.nameInput::placeholder{
color:#aaa6d0;
}


/* دکمه */

.neonBtn{
border:none;

border-radius:18px;

padding:
15px 35px;

font-size:19px;

font-weight:900;

cursor:pointer;

color:#050018;

background:
linear-gradient(
135deg,
#00ffff,
#a8ffff
);

box-shadow:
0 0 12px #00ffff,
0 0 30px #00ffff66;

transition:.2s;
}

.neonBtn:active{
transform:scale(.94);
}


/* نوار بالا */

.top{
display:flex;
justify-content:space-between;
align-items:center;
gap:8px;
flex-wrap:wrap;
margin-bottom:14px;
}

.badge{
padding:
9px 13px;

border-radius:14px;

background:
rgba(0,0,30,.85);

border:
1px solid #00ffff66;

font-size:14px;

box-shadow:
0 0 10px #00ffff22;
}

.level{
color:#ffe75a;
font-weight:900;
}


/* پیشرفت */

.progress{
height:9px;

background:#17112f;

border-radius:20px;

overflow:hidden;

margin-bottom:16px;
}

.progressBar{
height:100%;

width:0;

background:
linear-gradient(
90deg,
#00ffff,
#ff55ff,
#ffe600
);

box-shadow:
0 0 15px #00ffff;

transition:.5s;
}


/* مسیر فضایی */

.space{
height:100px;

position:relative;

border-radius:24px;

background:
rgba(0,0,25,.58);

border:
1px solid rgba(255,255,255,.15);

overflow:hidden;

margin-bottom:18px;
}

.route{
position:absolute;

left:7%;
right:7%;

top:52px;

height:3px;

background:
linear-gradient(
90deg,
#00ffff,
#ff55ff,
#ffe600
);

box-shadow:
0 0 12px #00ffff;
}

.planet{
position:absolute;

top:25px;

font-size:38px;

filter:
drop-shadow(0 0 10px #ff55ff);
}

.p1{left:3%}
.p2{left:25%}
.p3{left:48%}
.p4{left:71%}
.p5{right:2%}

#ship{
position:absolute;

top:21px;

left:4%;

font-size:50px;

z-index:3;

filter:
drop-shadow(0 0 15px #00ffff);

transition:
left .7s ease;
}

.fly{
animation:
fly .7s ease;
}

@keyframes fly{

30%{
transform:
translateY(-10px)
rotate(-5deg);
}

65%{
transform:
translateY(7px)
rotate(5deg);
}

}


/* جمله */

.questionBox{
min-height:145px;

display:flex;

align-items:center;

justify-content:center;

padding:18px;

border-radius:28px;

background:
rgba(0,0,25,.82);

border:
2px solid #ff55ff88;

box-shadow:
0 0 25px #ff00ff22,
inset 0 0 30px #00ffff0d;
}

.question{
font-size:
clamp(23px,5vw,37px);

font-weight:900;

line-height:1.9;
}

.hint{
font-size:13px;

color:#aaa6cc;

margin-top:5px;
}


/* پاسخ‌ها */

.answers{
display:grid;

grid-template-columns:
1fr 1fr;

gap:18px;

margin-top:20px;
}

.answer{
height:120px;

border-radius:28px;

background:
rgba(0,0,25,.88);

font-size:70px;

font-weight:900;

cursor:pointer;

transition:.2s;
}

.dot{
color:#00ffff;

border:
3px solid #00ffff;

box-shadow:
0 0 15px #00ffff,
inset 0 0 25px #00ffff11;
}

.ask{
color:#ff55ff;

border:
3px solid #ff55ff;

box-shadow:
0 0 15px #ff55ff,
inset 0 0 25px #ff55ff11;
}

.answer:active{
transform:scale(.93);
}

.correct{
animation:
correct .7s;
}

@keyframes correct{

40%{
box-shadow:
0 0 70px #00ff99;

border-color:#00ff99;
}

}


/* پیام */

.message{
height:30px;

margin-top:13px;

font-size:17px;

font-weight:900;
}


/* موفقیت */

.successIcon{
font-size:90px;

animation:
float 2.5s infinite;
}

.finalScore{
font-size:45px;

color:#ffe600;

font-weight:900;

text-shadow:
0 0 20px #ffe600;

margin:15px;
}


/* انفجار */

#explosion{
position:fixed;

inset:0;

z-index:100;

display:none;

align-items:center;

justify-content:center;

background:
radial-gradient(
circle,
#fff5a0,
#ff7200 15%,
#300000 50%,
#020006
);

overflow:hidden;
}

#explosion.show{
display:flex;

animation:
shake .45s;
}

@keyframes shake{

20%{
transform:
translate(-12px,7px);
}

40%{
transform:
translate(10px,-8px);
}

60%{
transform:
translate(-8px,-4px);
}

80%{
transform:
translate(7px,5px);
}

}

.blast{
position:absolute;

width:70px;
height:70px;

border-radius:50%;

background:white;

box-shadow:
0 0 25px white,
0 0 80px #ffe600,
0 0 160px #ff6500,
0 0 260px red;

animation:
blast 1.4s forwards;
}

@keyframes blast{

0%{
transform:scale(.1);
}

45%{
transform:scale(5);
opacity:1;
}

100%{
transform:scale(18);
opacity:0;
}

}

.flame{
position:absolute;

font-size:110px;

animation:
flame 1.4s forwards;
}

@keyframes flame{

0%{
transform:scale(.2);
opacity:0;
}

25%{
transform:scale(1.3);
opacity:1;
}

100%{
transform:scale(2.5);
opacity:0;
}

}

.gameOver{
position:relative;

z-index:3;

text-align:center;

opacity:0;

animation:
appear .8s .6s forwards;
}

@keyframes appear{
to{
opacity:1;
}
}

.gameOver h2{

font-size:
clamp(40px,9vw,70px);

color:#ff4c4c;

text-shadow:
0 0 25px red;

margin:0 0 12px;
}

.gameOver p{
font-size:19px;
line-height:2;
}


/* موبایل */

@media(max-width:600px){

.panel{
padding:17px 12px;
}

.astronaut{
font-size:68px;
}

.space{
height:88px;
}

.route{
top:45px;
}

#ship{
font-size:43px;
top:19px;
}

.planet{
font-size:31px;
}

.answer{
height:105px;
font-size:58px;
}

}

</style>

</style>
</head>

<br>

<script>

/* سوالات */

const questions=[

{
text:"پدرم یک گلدان زیبا خرید",
answer:"."
},

{
text:"کجا می‌روی",
answer:"?"
},

{
text:"بچه‌ها در حیاط مدرسه بازی کردند",
answer:"."
},

{
text:"چرا می‌خندی",
answer:"?"
},

{
text:"ماه شب‌ها در آسمان می‌درخشد",
answer:"."
},

{
text:"چه‌طور نقاشی می‌کشی",
answer:"?"
},

{
text:"فضانورد وارد سفینه‌ی خود شد",
answer:"."
},

{
text:"چگونه این کار را انجام دادی",
answer:"?"
},

{
text:"فریده سیاره‌های زیادی را در آسمان دید",
answer:"."
},

{
text:"آیا امروز به مدرسه رفتی",
answer:"?"
}

];


let current=0;

let correctCount=0;
let wrongCount=0;
let studentName="";
let timerInterval=null;
let timeLeft=0;
let resultSaved=false;


/* عناصر */

const welcome=
document.getElementById("welcome");

const game=
document.getElementById("gameScreen");

const success=
document.getElementById("success");

const question=
document.getElementById("question");

const correctEl=document.getElementById("correctCount");
const wrongEl=document.getElementById("wrongCount");
const timerEl=document.getElementById("timer");

const level=
document.getElementById("level");

const progress=
document.getElementById("progressBar");

const message=
document.getElementById("message");

const ship=
document.getElementById("ship");

const explosion=
document.getElementById("explosion");


/* شروع بازی */

document
.getElementById("start")
.onclick=startGame;


function startGame(){

studentName=student.fullName;


welcome.classList.add("hide");

game.classList.remove("hide");

document
.getElementById("player")
.textContent=
studentName;

startTimer();
loadQuestion();

}


/* نمایش سؤال */

function loadQuestion(){

if(current>=questions.length){

finishGame();

return;

}


const q=
questions[current];

question.textContent=
q.text;

level.textContent=
current+1;

progress.style.width=
(current/questions.length*100)+"%";

message.textContent="";


const positions=[
4,
18,
32,
46,
60,
70,
78,
85,
91,
94
];

ship.style.left=
positions[current]+"%";

ship.classList.remove("fly");

void ship.offsetWidth;

ship.classList.add("fly");

}


/* بررسی پاسخ */

document
.querySelectorAll(".answer")
.forEach(button=>{

button.addEventListener(
"click",
function(){

checkAnswer(
this.dataset.answer,
this
);

});

});


function checkAnswer(
selected,
button
){

const correct=
questions[current].answer;


if(selected===correct){

correctCount++;
correctEl.textContent=correctCount.toLocaleString("fa-IR");

message.textContent=
"آفرین! ستاره را گرفتی ⭐✨";

message.style.color=
"#00ff99";

button.classList.add(
"correct"
);


setTimeout(()=>{

button.classList.remove(
"correct"
);

current++;

loadQuestion();

},650);


}else{

wrongCount++;
wrongEl.textContent=wrongCount.toLocaleString("fa-IR");

burnShip();

}

}


/* پاسخ اشتباه */

function burnShip(){

document
.getElementById("wrongText")
.textContent=

"اوه نه "
+
studentName
+
"! پاسخ اشتباه بود و سفینه سوخت! 🔥🚀";

explosion.classList.add(
"show"
);

}


/* پایان موفق */

function finishGame(){

if(resultSaved) return;
resultSaved=true;
clearInterval(timerInterval);

game.classList.add(
"hide"
);

success.classList.remove(
"hide"
);

document
.getElementById("winner")
.textContent=
studentName;

document.getElementById("finalCorrect").textContent=`پاسخ درست: ${correctCount.toLocaleString("fa-IR")}`;
document.getElementById("finalWrong").textContent=`پاسخ غلط: ${wrongCount.toLocaleString("fa-IR")}`;
syncSaveResult(student.studentCode,GAME_ID,correctCount,wrongCount,Math.round((Date.now()-platformStartedAt)/1000));

progress.style.width=
"100%";

}

function startTimer(){
clearInterval(timerInterval);
timeLeft=window.timerSeconds||180;
updateTimer();
timerInterval=setInterval(()=>{timeLeft--;updateTimer();if(timeLeft<=0){clearInterval(timerInterval);document.querySelectorAll('.answer').forEach(button=>button.disabled=true);}},1000);
}

function updateTimer(){
timerEl.textContent=`${Math.floor(timeLeft/60)}:${String(timeLeft%60).padStart(2,"0")}`;
}

</script>
