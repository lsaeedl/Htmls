<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#061b2c;
    font-family:Tahoma,Arial,sans-serif;
}

#gameCanvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:1;
}

#game-layout{
    position:fixed;
    inset:0;
    z-index:10;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:12px;
    pointer-events:none;
}

.top-section{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:9px;
    pointer-events:auto;
}

.header-row{
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
}

.hud-group{
    display:flex;
    align-items:center;
    gap:7px;
}

.btn-round{
    width:44px;
    height:44px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    font-size:21px;
    cursor:pointer;

    background:linear-gradient(
        145deg,
        rgba(255,255,255,.30),
        rgba(255,255,255,.08)
    );

    border:2px solid rgba(255,255,255,.65);

    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);

    box-shadow:
        inset 0 2px 6px rgba(255,255,255,.35),
        0 5px 18px rgba(0,0,0,.25);
}

.btn-round:active{
    transform:scale(.9);
}

.hud-pill{
    min-height:40px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    padding:6px 11px;
    border-radius:25px;
    color:#fff;
    font-size:.9rem;
    font-weight:900;
    white-space:nowrap;

    background:linear-gradient(
        145deg,
        rgba(255,255,255,.28),
        rgba(255,255,255,.08)
    );

    border:2px solid rgba(255,255,255,.45);

    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);

    box-shadow:
        inset 0 2px 5px rgba(255,255,255,.2),
        0 5px 15px rgba(0,0,0,.2);
}

.progress-container{
    width:80px;
    height:11px;
    border-radius:10px;
    overflow:hidden;
    background:rgba(0,0,0,.45);
    border:1px solid rgba(255,255,255,.5);
}

.progress-bar{
    width:0%;
    height:100%;
    border-radius:10px;

    background:linear-gradient(
        90deg,
        #00f5d4,
        #ffe600
    );

    box-shadow:0 0 12px #00f5d4;

    transition:width .45s ease;
}

.question-box{
    max-width:94%;
    padding:10px 22px;
    border-radius:22px;
    text-align:center;

    background:linear-gradient(
        145deg,
        rgba(4,31,53,.94),
        rgba(8,54,78,.88)
    );

    border:3px solid #00f5d4;

    box-shadow:
        inset 0 3px 8px rgba(255,255,255,.12),
        0 7px 30px rgba(0,245,212,.42);
}

.question-title{
    color:#ffe600;
    font-size:1.2rem;
    font-weight:900;
    margin-bottom:2px;
    text-shadow:0 0 12px rgba(255,230,0,.75);
}

.question-sub{
    color:#fff;
    font-size:1rem;
    font-weight:900;
    line-height:1.55;
}

/* =========================
   WORD CARDS
========================= */

.bottom-section{
    width:100%;
    max-width:780px;
    margin:0 auto 9px;
    pointer-events:auto;
}

.cards-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.word-btn{
    position:relative;
    width:100%;
    min-height:86px;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:12px 5px;

    border:0;
    outline:0;
    border-radius:20px;

    cursor:pointer;

    background-image:url(
        "https://cdn.imgurl.ir/uploads/q707451_photo-output.png"
    );

    background-size:100% 100%;
    background-position:center;
    background-repeat:no-repeat;

    touch-action:manipulation;
    overflow:hidden;

    filter:drop-shadow(
        0 8px 7px rgba(0,0,0,.4)
    );

    transition:
        transform .18s ease,
        filter .18s ease,
        opacity .4s ease;
}

.word-text{
    position:relative;
    z-index:5;

    width:100%;

    color:#000 !important;

    font-family:
        Tahoma,
        Arial,
        sans-serif;

    font-size:1.55rem;
    font-weight:900;

    line-height:1.3;
    text-align:center;

    direction:rtl;
    unicode-bidi:plaintext;

    white-space:nowrap;

    word-spacing:0 !important;
    letter-spacing:0 !important;

    text-shadow:
        1px 0 0 #fff,
        -1px 0 0 #fff,
        0 1px 0 #fff,
        0 -1px 0 #fff;
}

.word-btn:active{
    transform:translateY(5px) scale(.94);

    filter:
        brightness(1.1)
        drop-shadow(
            0 3px 4px rgba(0,0,0,.3)
        );
}

.word-btn.collected{
    opacity:0;
    pointer-events:none;

    transform:
        scale(.2)
        rotate(12deg);
}

/* =========================
   WRONG / BURN
========================= */

.word-btn.burning{
    animation:
        burnCard .8s ease forwards;

    pointer-events:none;
}

.word-btn.burning::before{
    content:"🔥";

    position:absolute;

    z-index:20;

    font-size:3rem;

    animation:
        flame .8s ease forwards;
}

@keyframes burnCard{

    0%{
        transform:scale(1) rotate(0);
        opacity:1;
        filter:brightness(1);
    }

    25%{
        transform:
            scale(1.08)
            rotate(-4deg);

        filter:
            brightness(1.8)
            saturate(2);
    }

    50%{
        transform:
            scale(.95)
            rotate(5deg);

        filter:
            brightness(2.2)
            saturate(3);
    }

    75%{
        transform:
            scale(.55)
            rotate(-8deg);

        opacity:.65;

        filter:
            brightness(2)
            blur(1px);
    }

    100%{
        transform:
            scale(.05)
            rotate(18deg);

        opacity:0;

        filter:
            brightness(3)
            blur(5px);
    }
}

@keyframes flame{

    0%{
        transform:scale(.4);
        opacity:0;
    }

    30%{
        transform:scale(1.3);
        opacity:1;
    }

    100%{
        transform:scale(1.8) translateY(-20px);
        opacity:0;
    }
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;

    top:50%;
    left:50%;

    transform:
        translate(-50%,-50%)
        scale(0);

    z-index:100;

    max-width:90%;

    padding:17px 32px;

    border-radius:30px;

    text-align:center;

    font-size:1.65rem;
    font-weight:900;

    opacity:0;

    pointer-events:none;

    transition:
        all .35s
        cubic-bezier(.175,.885,.32,1.275);
}

.toast.success{
    opacity:1;

    transform:
        translate(-50%,-50%)
        scale(1);

    color:#fff;

    background:
        linear-gradient(
            135deg,
            #00f5d4,
            #0582ca
        );

    border:3px solid #fff;

    box-shadow:
        0 0 50px #00f5d4;
}

.toast.retry{
    opacity:1;

    transform:
        translate(-50%,-50%)
        scale(1);

    color:#fff;

    background:
        linear-gradient(
            135deg,
            #ff9f1c,
            #e63946
        );

    border:3px solid #fff;

    box-shadow:
        0 0 45px #ff9f1c;

    font-size:1.15rem;

}

/* =========================

.edu-card{

    align-items:center;

}

.edu-card.show{

}

.edu-title{

.edu-formula{

<script>
//INTEGRATION: اتصال بازی به نشست دانش‌آموز، نوبت مجاز، تنظیمات پلتفرم و دریافت نام آموزگار
const GAME_ID = 3; 
const platformStudent = getCurrentStudent();
const platformStartedAt = Date.now();
let platformSaved = false;

(async function initializeGamePlatform() {
    if (!platformStudent) {
        window.location.href = '../index.html';
        return;
    }
    document.documentElement.style.visibility = 'hidden';
    const attemptCheck = await syncCheckAttempts(platformStudent.studentCode, GAME_ID);
    if (!attemptCheck.success) {
        document.documentElement.style.visibility = 'visible';
        document.body.innerHTML = '<main style="font-family:Tahoma,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;text-align:center;padding:24px"><h2>' + (attemptCheck.error || 'امکان شرکت در این بازی وجود ندارد.') + '</h2></main>';
        return;
    }
    const settings = await syncGetGameSettings(GAME_ID);
    window.timerSeconds = settings.timerSeconds || 180;
    window.platformStudent = platformStudent;

    // دریافت نام آموزگار با منطق داینامیک پلتفرم
    let teacherName = 'خانم دهگودی'; // مقدار پیش‌فرض
    if (platformStudent.teacherName) {
        teacherName = platformStudent.teacherName;
    } else if (platformStudent.className) {
        try {
            const classesResult = await syncListClasses();
            if (classesResult && classesResult.success) {
                const match = classesResult.classes.find(c => c.className === platformStudent.className);
                if (match && match.teacherName) {
                    teacherName = match.teacherName;
                }
            }
        } catch (e) {
            console.error('Error fetching teacher name:', e);
        }
    }
    window.platformTeacherName = teacherName;

    document.documentElement.style.visibility = 'visible';
})();

//INTEGRATION: نمایش ثابت آموزگار و فوتر پلتفرم.
window.addEventListener('DOMContentLoaded', function () {
    if (!document.querySelector('.platform-teacher')) {
        const teacher = document.createElement('div');
        teacher.className = 'platform-teacher';
        teacher.textContent = 'آموزگار: ' + (window.platformTeacherName || 'خانم دهگودی');
        teacher.style.cssText = 'position:fixed;top:12px;left:50%;transform:translateX(-50%);text-align:center;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,0.8);background:rgba(0,0,0,0.4);padding:6px 16px;border-radius:20px;z-index:9999;';
        document.body.appendChild(teacher);
    }
    if (!document.querySelector('.platform-footer')) {
        const footer = document.createElement('footer');
        footer.className = 'platform-footer';
        footer.textContent = 'طراحی و پیاده‌سازی: سعید سراوانی';
        footer.style.cssText = 'text-align:center;font-weight:700;padding:12px;color:#fff;background:rgba(0,0,0,0.6);position:fixed;bottom:0;width:100%;z-index:9999;';
        document.body.appendChild(footer);
    }
});
</script>

<script>

/* =================================
   AUDIO
================================= */

class SoundFX{

    constructor(){
        this.ctx=null;
        this.muted=false;
    }

    init(){

        if(!this.ctx){

            this.ctx=
                new(
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }

        if(this.ctx.state==="suspended"){
            this.ctx.resume();
        }

    }

    playTone(
        freq,
        duration,
        type="sine"
    ){

        if(!this.ctx || this.muted){
            return;
        }

        const osc=
            this.ctx.createOscillator();

        const gain=
            this.ctx.createGain();

        osc.type=type;

        osc.frequency.setValueAtTime(
            freq,
            this.ctx.currentTime
        );

        gain.gain.setValueAtTime(
            .2,
            this.ctx.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            this.ctx.currentTime+duration
        );

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start();

        osc.stop(
            this.ctx.currentTime+duration
        );

    }

    correct(){

        if(!this.ctx || this.muted){
            return;
        }

        [
            523.25,
            659.25,
            783.99,
            1046.5,
            1318.51
        ].forEach((f,i)=>{

            setTimeout(()=>{
                this.playTone(
                    f,
                    .32,
                    "triangle"
                );
            },i*70);

        });

    }

    wrong(){

        if(!this.ctx || this.muted){
            return;
        }

        const osc=
            this.ctx.createOscillator();

        const gain=
            this.ctx.createGain();

        osc.type="sawtooth";

        osc.frequency.setValueAtTime(
            180,
            this.ctx.currentTime
        );

        osc.frequency.exponentialRampToValueAtTime(
            55,
            this.ctx.currentTime+.45
        );

        gain.gain.setValueAtTime(
            .3,
            this.ctx.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            this.ctx.currentTime+.45
        );

        osc.connect(gain);

        gain.connect(
            this.ctx.destination
        );

        osc.start();

        osc.stop(
            this.ctx.currentTime+.45
        );

    }

    victory(){

        if(!this.ctx || this.muted){
            return;
        }

        [
            523.25,
            659.25,
            783.99,
            1046.5,
            1318.51,
            1567.98
        ].forEach((f,i)=>{

            setTimeout(()=>{

/* =================================
   BACKGROUND + BOAT
================================= */

function drawBackground(time){

    if(
        backgroundImage.complete &&
        backgroundImage.naturalWidth>0
    ){

        const imgRatio=
            backgroundImage.width/
            backgroundImage.height;

        const screenRatio=
            width/height;

        let dw,dh,ox,oy;

        if(imgRatio>screenRatio){

            dh=height;

            dw=
                height*
                imgRatio;

            ox=
                (width-dw)/2;

            oy=0;

        }else{

            dw=width;

            dh=
                width/
                imgRatio;

            ox=0;

            oy=
                (height-dh)/2;

        }

        ctx.drawImage(
            backgroundImage,
            ox,
            oy,
            dw,
            dh
        );

    }else{

        ctx.fillStyle="#06283f";

        ctx.fillRect(
            0,
            0,
            width,
            height
        );

    }


    /* حباب‌ها */

    bubbles.forEach(b=>{

        b.y-=b.speed;

        b.x+=
            Math.sin(
                time*.002+b.drift
            )*.35;

        if(b.y<-20){

            b.y=
                height+20;

            b.x=
                Math.random()*width;

        }

        ctx.save();

        ctx.strokeStyle=
            "rgba(255,255,255,.4)";

        ctx.fillStyle=
            "rgba(0,245,212,.12)";

        ctx.lineWidth=1.3;

        ctx.beginPath();

        ctx.arc(
            b.x,
            b.y,
            b.radius,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.stroke();

        ctx.restore();

    });


    /* قایق */

    boat.bobble=
        Math.sin(
            time*.003
        )*5;

    ctx.save();

    ctx.translate(
        boat.x,
        boat.y+
        boat.bobble
    );


    ctx.save();

    ctx.shadowColor=
        "rgba(0,245,212,.75)";

    ctx.shadowBlur=25;

    ctx.fillStyle=
        "rgba(0,245,212,.18)";

    ctx.beginPath();

    ctx.ellipse(
        0,
        40,
        100,
        17,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.restore();


    const hull=
        ctx.createLinearGradient(
            -90,
            0,
            90,
            40
        );

    hull.addColorStop(
        0,
        "#ff007f"
    );

    hull.addColorStop(
        .5,
        "#7928ca"
    );

    hull.addColorStop(
        1,
        "#4361ee"
    );

    ctx.fillStyle=hull;

    ctx.shadowColor=
        "#00f5d4";

    ctx.shadowBlur=18;

    ctx.beginPath();

    ctx.moveTo(
        -80,
        -5
    );

    ctx.quadraticCurveTo(
        -90,
        25,
        -38,
        40
    );

    ctx.lineTo(
        45,
        40
    );

    ctx.quadraticCurveTo(
        85,
        25,
        80,
        -5
    );

    ctx.closePath();

    ctx.fill();

    ctx.shadowBlur=0;

    ctx.strokeStyle=
        "#ffe600";

    ctx.lineWidth=3;

    ctx.stroke();


    /* دکل */

    ctx.strokeStyle="#fff";

    ctx.lineWidth=4;

    ctx.beginPath();

    ctx.moveTo(
        0,
        -5
    );

    ctx.lineTo(
        0,
        -82
    );

    ctx.stroke();


    /* بادبان */

    const sail=
        ctx.createLinearGradient(
            0,
            -80,
            50,
            -15
        );

    sail.addColorStop(
        0,
        "#ffe600"
    );

    sail.addColorStop(
        1,
        "#ff8c00"
    );

    ctx.fillStyle=sail;

    ctx.beginPath();

    ctx.moveTo(
        2,
        -78
    );

    ctx.lineTo(
        52,
        -17
    );

    ctx.lineTo(
        2,
        -17
    );

    ctx.closePath();

    ctx.fill();

    ctx.strokeStyle="#fff";

    ctx.lineWidth=2;

    ctx.stroke();


    /* پرچم */

    ctx.fillStyle=
        "#00f5d4";

    ctx.beginPath();

    ctx.moveTo(
        1,
        -85
    );

    ctx.lineTo(
        26,
        -76
    );

    ctx.lineTo(
        1,
        -68
    );

    ctx.closePath();

    ctx.fill();

    ctx.restore();


    /* موج */

    ctx.save();

    for(let i=0;i<3;i++){

        const waveY=
            boat.y+
            40+
            i*8+
            boat.bobble;

        const waveWidth=
            55+
            i*18+
            Math.sin(
                time*.003+i
            )*8;

        ctx.strokeStyle=
            `rgba(255,255,255,${.25-i*.05})`;

        ctx.lineWidth=2;

        ctx.beginPath();

        ctx.ellipse(
            boat.x,
            waveY,
            waveWidth,
            7+i*2,
            0,
            0,
            Math.PI*2
        );

        ctx.stroke();

    }

    ctx.restore();


    /* جرقه‌ها */

    sparkles.forEach(
        (s,index)=>{

            s.x+=s.vx;
            s.y+=s.vy;
            s.vy+=.15;
            s.life-=.025;

            if(s.life<=0){

                sparkles.splice(
                    index,
                    1
                );

            }else{

                ctx.save();

                ctx.fillStyle=
                    s.color;

                ctx.globalAlpha=
                    s.life;

                ctx.shadowColor=
                    s.color;

                ctx.shadowBlur=12;

                ctx.beginPath();

                ctx.arc(
                    s.x,
                    s.y,
                    s.size,
                    0,
                    Math.PI*2
                );

                ctx.fill();

                ctx.restore();

            }

        }
    );

}


/* =================================
   PARTICLES
================================= */

function spawnSparkles(x,y){

    for(let i=0;i<40;i++){

        const angle=
            Math.random()*
            Math.PI*2;

        const speed=
            3+
            Math.random()*8;

        sparkles.push({

            x:x,
            y:y,

            vx:
                Math.cos(angle)*
                speed,

            vy:
                Math.sin(angle)*
                speed,

            size:
                3+
                Math.random()*5,

            color:[
                "#ffe600",
                "#00f5d4",
                "#ff007f",
                "#ffffff"
            ][
                Math.floor(
                    Math.random()*4
                )
            ],

            life:1

        });

    }

}

function loop(time){

    ctx.clearRect(

        0,
        width,
        height

    drawBackground(time);

    requestAnimationFrame(loop);

}

/* =================================

================================= */

function generateCards(){

    container.innerHTML="";


    const shuffled=
        [...WORD_ITEMS].sort(
            ()=>Math.random()-.5
        );


    shuffled.forEach(
        item=>{

            const btn=
                document.createElement(
                    "div"
                );

            btn.className=
                "word-btn";


            const text=
                document.createElement(
                    "span"
                );

            text.className=
                "word-text";


            text.textContent=
                item.text;


            btn.appendChild(text);


            btn.addEventListener(
                "click",
                ()=>{
                    handleWordClick(
                        item,
                        btn
                    );
                }
            );


            container.appendChild(btn);

        }
    );

}


/* =================================
   CLICK
================================= */

function handleWordClick(
    item,
    btnElement
){

    if(
        isLocked ||
        btnElement.classList.contains(
            "collected"
        ) ||
        btnElement.classList.contains(
            "burning"
        )
    ){

        return;

    }


    /* =============================
       جواب درست
    ============================= */

    if(item.isCorrect){

        isLocked=true;

        sfx.correct();

        foundCount++;


        btnElement.classList.add(
            "collected"
        );


        spawnSparkles(
            boat.x,
            boat.y
        );


        document.getElementById("correct-count").textContent = toFa(foundCount);


        progressBar.style.width=
            `${
                (foundCount/
                TOTAL_VALID)*100
            }%`;


        showToast(
            `آفرین ${studentName}! 👏`,
            "success"
        );


        eduBase.textContent=
            item.base;

        eduFull.textContent=
            item.text;


        eduCard.classList.add(
            "show"
        );


        setTimeout(
            ()=>{

                eduCard.classList.remove(
                    "show"
                );

                isLocked=false;


                if(
                    foundCount>=
                    TOTAL_VALID
                ){

                    triggerVictory();

                }

            },
            1500
        );


    }

    /* =============================
       جواب غلط
    ============================= */

    else{

        sfx.wrong();

        wrongCount++;
        document.getElementById("wrong-count").textContent = toFa(wrongCount);


        /* افکت سوختن */

        btnElement.classList.add(
            "burning"
        );


        showToast(
            "🔥 اشتباه بود! دوباره تلاش کن.",
            "retry"
        );


        /* جرقه قرمز/نارنجی */

        spawnFireParticles(
            btnElement
        );


        setTimeout(
            ()=>{

                btnElement.classList.remove(
                    "burning"
                );

            },
            850
        );

    }

}


/* =================================
   FIRE PARTICLES
================================= */

function spawnFireParticles(element){

    const rect=
        element.getBoundingClientRect();


    for(let i=0;i<18;i++){

        const fire=
            document.createElement(
                "span"
            );

        fire.textContent=
            Math.random()>.5
            ? "🔥"
            : "✨";


        fire.style.position=
            "fixed";

        fire.style.left=
            (
                rect.left+
                rect.width/2+
                (Math.random()-.5)*
                rect.width
            )+"px";

        fire.style.top=
            (
                rect.top+
                rect.height/2
            )+"px";

        fire.style.fontSize=
            (
                12+
                Math.random()*18
            )+"px";

        fire.style.zIndex=
            "500";

        fire.style.pointerEvents=
            "none";

        fire.style.transition=
            "all .7s ease";

        document.body.appendChild(
            fire
        );


        requestAnimationFrame(
            ()=>{

                fire.style.transform=
                    `
                    translate(
                        ${(Math.random()-.5)*80}px,
                        ${-30-Math.random()*100}px
                    )
                    scale(.2)
                    `;

                fire.style.opacity="0";

            }
        );


        setTimeout(
            ()=>{
                fire.remove();
            },
            750
        );

    }

}

================================= */

async function triggerVictory(){

    sfx.victory();

    spawnSparkles(
        width/2,
        height/2
    );

    clearInterval(timerInterval);

    document.getElementById(
        "victory-text"
    ).innerHTML=
        `
        آفرین <b>${studentName}</b> عزیز! 🌟<br>
        هر ۶ واژه‌ی ساخته‌شده با
        پیشوند «هم» را پیدا کردی! 🏝️✨
        `;


    document.getElementById("final-correct").textContent = `پاسخ درست: ${toFa(foundCount)}`;
    document.getElementById("final-wrong").textContent = `پاسخ غلط: ${toFa(wrongCount)}`;
    
    // INTEGRATION: ثبت نتیجه در پلتفرم
    if (!resultSaved && window.platformStudent) {
        resultSaved = true;
        const durationSeconds = Math.round((Date.now() - platformStartedAt) / 1000);
        await syncSaveResult(platformStudent.studentCode, GAME_ID, foundCount, wrongCount, durationSeconds);
    }

    document.getElementById(
        "victory-modal"
    ).style.display=
        "flex";

}

function startTimer() {
    clearInterval(timerInterval);
    timeLeft = window.timerSeconds || 180;
    updateTimer();
    timerInterval = setInterval(() => {
        timeLeft--;
        updateTimer();
        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            document.querySelectorAll('.word-btn').forEach(btn => btn.style.pointerEvents = 'none');
            triggerVictory();
        }
    }, 1000);
}

function updateTimer() {
    const minutes = Math.floor(timeLeft / 60);
    const seconds = String(timeLeft % 60).padStart(2, '0');
    document.getElementById('game-timer').textContent = `${toFa(minutes)}:${toFa(seconds)}`;
}
